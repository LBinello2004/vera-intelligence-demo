    sql: |
      SELECT
        COUNT(*) FILTER (WHERE manejaobjecionesconalternativas = 'Sí') AS si,
        COUNT(*) FILTER (WHERE manejaobjecionesconalternativas IN ('Sí','No')) AS base
      FROM dashboard_v2.vw_salomon_rendimiento_vendedor
      WHERE seller_id = 'Salomon'
    respuesta_esperada: '3.774 de 4.679 (80,7%)'

