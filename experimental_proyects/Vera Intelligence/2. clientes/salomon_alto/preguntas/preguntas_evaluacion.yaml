  - id: q12_tipointeraccion_enum_trap
    pregunta: ¿Cuántas conversaciones terminaron en cambio o devolución?
    fuentes_requeridas: [demography]
    es_trampa: true
    requisitos:
    - 'TRAMPA: "Cambio" es un valor configurado del enum tipointeraccion pero no se observó ninguna
      fila con ese valor en el muestreo -el agente debe verificar y responder 0 o aclarar que no se
      observan casos, no asumir ni inventar un número.'
    sql: |
      SELECT COUNT(*) FROM dashboard_v2.vw_salomon_demografia
      WHERE seller_id = 'Salomon' AND tipointeraccion = 'Cambio'
    respuesta_esperada: '0 conversaciones observadas con ese valor (el agente no debe inventar un número)'

