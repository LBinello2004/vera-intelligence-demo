client_id: salomon
display_name: "Salomon"
tenant: "Salomon"
model: gemini-3.7-flash
data_map: "2. clientes/salomon_alto/data_map/VI Data Map Salomon V1.yaml"

# Salomon es un cliente de "schema delgado": sólo tiene 2 vistas en Postgres
# (demografia + rendimiento_vendedor), a diferencia del molde completo de 6
# vistas de los primeros 9 clientes. Existe un prompt de insights en Langfuse
# (clientes/Salomon/insights) pero NO hay vista de insights materializada en
# dashboard_v2 -verificado contra information_schema.views-, así que no se
# declara como business_rulebook: no hay datos que consultar con esos
# criterios, sólo confundiría al agente a pensar que puede llamarlos.
sources:
  dashboard_v2.vw_salomon_demografia:
    tenant_field: seller_id
  dashboard_v2.vw_salomon_rendimiento_vendedor:
    tenant_field: seller_id

business_rulebooks:
  sales_evaluation:
    name: "clientes/Salomon/checklist"
    label: production
    business_scope: "Criterios de atención y desempeño del vendedor en tienda de retail deportivo/outdoor (Salomon)"
  # Generalizado a todos los clientes (2026-09-11) -source local, NO Langfuse: contenido
  # versionado en este mismo repo ("2. clientes/_shared/business_rulebooks/coaching_playbook.md"),
  # borrador técnico sin revisión del equipo de negocio todavía. Ver README de
  # "3. experimentos/coaching_playbook/".
  coaching_playbook:
    source: local
    path: "2. clientes/_shared/business_rulebooks/coaching_playbook.md"
    business_scope: "Recomendaciones de coaching y desarrollo de vendedores según su desempeño (bajo o alto)"

# Salomon no tiene RAG: su prompt de checklist no declara geminiFileSearchStoreName
# (verificado en Langfuse) -el store que sí tiene clientes/Salomon/feedback es de
# otro producto/feature, no de Vera Intelligence, mismo criterio de exclusión
# usado en el resto de los clientes-.

# Búsqueda vectorial habilitada (2026-09-16, ampliación a todos los clientes viables) -verificado
# por SQL directo: 18.949 embeddings reales para seller_id='Salomon' -el segundo volumen más alto
# de todo el proyecto después de Huerpel-, repartidos en 30 tiendas distintas, actividad hasta
# 2026-09-13. Sin insights_descriptivos_generales -resumen_verificado sale None, degradación
# normal de schema delgado.
vector_search:
  top_k: 5
