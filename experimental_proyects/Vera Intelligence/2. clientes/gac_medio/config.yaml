client_id: gac
display_name: "GAC"
tenant: "GAC"
model: gemini-3.7-flash
data_map: "2. clientes/gac_medio/data_map/VI Data Map GAC V1.yaml"

# GAC es un cliente de "schema delgado" (2 vistas, sin insights) y de volumen chico
# (98 conversaciones totales) -mismo patrón que Agrosuper/Hyundai/Dalton, ver README.
sources:
  dashboard_v2.vw_gac_demografia:
    tenant_field: seller_id
  dashboard_v2.vw_gac_rendimiento_vendedor:
    tenant_field: seller_id

business_rulebooks:
  sales_evaluation:
    name: "clientes/GAC/checklist"
    label: production
    business_scope: "Criterios de atención y desempeño del asesor en concesionaria de vehículos (GAC)"
  # Generalizado a todos los clientes (2026-09-11) -source local, NO Langfuse: contenido
  # versionado en este mismo repo ("2. clientes/_shared/business_rulebooks/coaching_playbook.md"),
  # borrador técnico sin revisión del equipo de negocio todavía. Ver README de
  # "3. experimentos/coaching_playbook/".
  coaching_playbook:
    source: local
    path: "2. clientes/_shared/business_rulebooks/coaching_playbook.md"
    business_scope: "Recomendaciones de coaching y desarrollo de vendedores según su desempeño (bajo o alto)"

# GAC no tiene RAG: su prompt de checklist no declara geminiFileSearchStoreName -el store
# de clientes/GAC/feedback es de otro producto/feature, no de Vera Intelligence-.

# Búsqueda vectorial habilitada (2026-09-16, ampliación a todos los clientes viables) -verificado
# por SQL directo: 545 embeddings reales para seller_id='GAC', tienda única, actividad hasta
# 2026-09-12 (activo). GAC no declara insights_descriptivos_generales -resumen_verificado sale
# None para este cliente, degradación normal de schema delgado, no un error.
vector_search:
  top_k: 5
