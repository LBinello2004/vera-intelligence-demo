client_id: agrosuper
display_name: "Agrosuper"
tenant: "Agrosuper"
model: gemini-3.7-flash
data_map: "2. clientes/agrosuper_bajo/data_map/VI Data Map Agrosuper V1.yaml"

# Agrosuper es "schema delgado" (2 vistas, sin insights) y el cliente de MENOR volumen de
# todo el proyecto: 11 conversaciones totales, 9 analizables. Ver README.
sources:
  dashboard_v2.vw_agrosuper_demografia:
    tenant_field: seller_id
  dashboard_v2.vw_agrosuper_rendimiento_vendedor:
    tenant_field: seller_id

business_rulebooks:
  sales_evaluation:
    name: "clientes/Agrosuper/checklist"
    label: production
    business_scope: "Criterios de venta consultiva B2B de campo (visitas a comercios: carnicerías, hoteles, restaurantes) para Agrosuper"
  # Generalizado a todos los clientes (2026-09-11) -source local, NO Langfuse: contenido
  # versionado en este mismo repo ("2. clientes/_shared/business_rulebooks/coaching_playbook.md"),
  # borrador técnico sin revisión del equipo de negocio todavía. Ver README de
  # "3. experimentos/coaching_playbook/".
  coaching_playbook:
    source: local
    path: "2. clientes/_shared/business_rulebooks/coaching_playbook.md"
    business_scope: "Recomendaciones de coaching y desarrollo de vendedores según su desempeño (bajo o alto)"

# Agrosuper no tiene RAG: su prompt de checklist no declara geminiFileSearchStoreName -el
# store de clientes/Agrosuper/feedback es de otro producto/feature, no de Vera Intelligence-.

# Búsqueda vectorial habilitada (2026-09-29) -verificado por SQL directo: 11 de 14 grabaciones
# tienen embedding (13 filas, una conversación con más de un chunk), cobertura real 79%. Volumen
# chico pero real -mismo criterio que Hyundai (151 embeddings, cliente inactivo, habilitado igual
# "la búsqueda tiene valor sobre el histórico ya vectorizado")-. Sin insights_descriptivos_generales
# (schema delgado) -resumen_verificado sale None, degradación normal.
vector_search:
  top_k: 5
