joins:
  rule: 'demography y performance comparten conversation_id pero NO tienen la misma
    población: performance tiene 235 filas más que demography (huérfanas, ver
    known_findings_v1). Un INNER JOIN entre ambas pierde esas 235 filas
    silenciosamente -advertir esto explícitamente en cualquier respuesta que cruce
    resultado (demography) con checklist (performance)-.'
limitations:
- Resultado y desempeño son inferencias conversacionales del modelo, no ventas
  certificadas.
- 'LIMITACIÓN PRINCIPAL: no existe vista de insights materializada para Ventas
  (clientes/Huerpel/Ventas/insights existe en Langfuse pero no en Postgres). Cualquier
  pregunta sobre motivo de venta perdida, escalamiento entre segmentos, resultado
  comercial estructurado (venta_cerrada/cotización/seguimiento_pendiente/venta_
  perdida) u objeciones categorizadas no puede responderse -sólo demography.
  tipointeraccion da una lectura general aproximada (compra/cambio/queja/no_compra/
  conversación no finalizada), no el detalle fino que trae el prompt de insights.'
- 'FILAS HUÉRFANAS: 235 de 1.942 filas de performance (12,1%) no tienen contraparte
  en demography. QUEDA ABIERTO, no investigado el pipeline que genera la
  discrepancia.'
- 'PROMPT_ID NO IDENTIFICADO: 57 de 1.942 filas de performance (2,9%) fueron
  generadas por un prompt_id que no corresponde a ninguna versión conocida del
  checklist vigente en Langfuse; su checklist queda 100% NULL. QUEDA ABIERTO.'
- Este Data Map cubre exclusivamente la asesoría de venta de Huerpel Ventas. No cubre
  Hostess ni Hostess Seminuevos (clientes separados, ver README).
- No responde organización, conectividad, gamificación, roleplays ni dominios de otros
  clientes.
