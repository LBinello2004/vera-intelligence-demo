        configured_values: [compra, cambio, queja, no_compra, conversacion_no_finalizada]
        observed_values: [compra, conversacion_no_finalizada, cambio, no_compra, queja]
        type: text
        nullable: true
        description: 'compra=1.169 (68,5%), conversacion_no_finalizada=314 (18,4%),
          cambio=88 (5,2%), no_compra=82 (4,8%), queja=1 (0,06%), 53 NULL (3,1%).
          Enum en minúsculas snake_case -distinto del casing de Hostess/Hostess
          Seminuevos, ver known_findings_v1-.'
