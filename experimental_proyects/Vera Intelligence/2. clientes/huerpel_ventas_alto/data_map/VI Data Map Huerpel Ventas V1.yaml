metadata:
  name: VI Data Map Huerpel Ventas V1
  version: 1.0.0
  client: Huerpel Ventas
  model_target: Gemini 3.7
  generated_at: '2026-09-08'
  scope: Dos vistas dashboard_v2 de la sub-marca Ventas de Huerpel (demografia +
    rendimiento_vendedor). El tenant ('Huerpel') es fijo. "Esquema delgado" para la
    parte de insights -existe clientes/Huerpel/Ventas/insights en Langfuse pero NO hay
    vista de insights materializada en Postgres, mismo patrón que Dalton/Salomon/GAC/
    Agrosuper/Hyundai-. Cubre exclusivamente la asesoría comercial de piso (APV), no la
    recepción (huerpel_hostess/huerpel_hostess_seminuevos, clientes separados).
  source_of_truth:
    checklist_prompt: clientes/Huerpel/Ventas/checklist (Langfuse, label production, v4
      al construir este mapa, promptId 4bomiv5RyqWUtRg3dfPX)
    note: 'Ver clientes/huerpel_hostess_alto/data_map/VI Data Map Huerpel Hostess
      V1.yaml para el contexto completo del grupo Huerpel (3 sub-marcas, 8 vistas reales
      en Postgres, por qué se onboardearon como 3 clientes separados). Verificado
      cruzando dashboard_v2.vw_huerpel_ventas_rendimiento_vendedor.prompt_id contra el
      promptId del prompt de Langfuse: 1.885 de 1.942 filas (97,1%) coinciden con el
      promptId vigente (4bomiv5RyqWUtRg3dfPX). El resto (57 filas, 2,9%) tiene un
      prompt_id distinto NO identificado en Langfuse (O7fesqEq1wN5oQXSOEcT) -ver
      known_findings_v1, hallazgo real QUEDA ABIERTO-.
      clientes/Huerpel/Ventas/insights SÍ existe en Langfuse (v4 al momento de este
      onboarding) pero no tiene vista materializada en Postgres -por eso este Data Map
      y su config.yaml NO declaran conversation_insights, mismo criterio que Dalton-.'
  known_findings_v1:
  - 'ROL DEL APV (ASESOR), NO DE LA HOSTESS: el checklist evalúa al Asesor Profesional
      de Ventas que continúa la atención después de la recepción. No confundir con
      huerpel_hostess/huerpel_hostess_seminuevos (clientes separados que evalúan al
      personal de recepción).'
  - 'HALLAZGO REAL — FILAS HUÉRFANAS (ver V2 para la causa raíz exacta verificada
      después de la primera corrida del banco dorado): rendimiento_vendedor tiene
      1.942 filas pero demografia sólo tiene 1.707 -235 filas (12,1%) existen en
      performance pero NO tienen fila correspondiente en demografia por
      conversation_id (verificado con LEFT JOIN). Mismo patrón que el hallazgo de
      filas huérfanas de Farma24 (descriptive_insights, 22,5% -ver README, sección
      "Investigación de las filas huérfanas de descriptive_insights"-). Efecto
      práctico: cualquier pregunta que requiera cruzar checklist con género/resultado
      de la interacción pierde esas 235 filas; una pregunta que sólo use performance
      (sin cruzar con demography) sí las incluye. QUEDA ABIERTO -no investigado el
      pipeline que genera la discrepancia, igual que en Farma24-.'
  - 'HALLAZGO REAL — PROMPT_ID NO IDENTIFICADO: 57 de 1.942 filas de performance
      (2,9%) tienen prompt_id=O7fesqEq1wN5oQXSOEcT, que NO coincide con ninguna versión
      conocida del prompt clientes/Huerpel/Ventas/checklist en Langfuse (se revisaron
      las versiones 1 y 2, ambas usan otro promptId o ninguno). De esas 57 filas, 41
      están marcadas estado_analisis=''Analizada'' y usefulforanalysis=true pero
      TODOS los 18 campos del checklist son NULL (no ''N/A'', NULL real) -verificado
      con SELECT-; las 16 restantes están fuera del cruce con demografia (parte de las
      235 filas huérfanas de arriba). Efecto práctico: estas 57 filas no distorsionan
      las tasas de cumplimiento (los NULL se excluyen naturalmente de Sí/No), pero SÍ
      infuenclarían un COUNT(*) crudo sin filtrar checklist poblado. QUEDA ABIERTO -no
      identificado a qué prompt/versión corresponde este promptId; no está en el
      historial de versiones revisado de Langfuse-.'
  - 'demography.tipointeraccion SÍ está poblado (a diferencia de las dos sub-marcas de
      Hostess, donde es 100% NULL): compra=1.169 (68,5% de 1.707), conversacion_no_
      finalizada=314 (18,4%), cambio=88 (5,2%), no_compra=82 (4,8%), no_identificado
      -vía NULL-=53 (3,1%), queja=1 (0,06%). Enum en minúsculas snake_case (a
      diferencia de Hostess/Hostess Seminuevos, que usan PascalCase con tilde) -
      particularidad propia del prompt de Ventas/insights, documentada para no asumir
      casing homogéneo entre las 3 sub-marcas-.'
  - 'demography.generocliente: no_identificado=711 (41,7%), masculino=697 (40,8%),
      femenino=246 (14,4%), 53 NULL (3,1%, coincide con las filas sin tipointeraccion
      -mismo patrón de conversaciones sin useful/analizar-). Igual que tipointeraccion,
      en minúsculas (distinto casing que Hostess/Hostess Seminuevos).'
  - 'Volumen real y alto, MULTI-TIENDA (a diferencia de Hostess/Hostess Seminuevos que
      son tienda única): 1.707 conversaciones en demografia / 1.942 en performance,
      1.555 analizables, 10 tiendas (BDC=869 la mayor -probablemente Business
      Development Center/call center, no piso físico-, Tula=183, Angelópolis=166,
      Apizaco=106, San Manuel=92, Tulancingo=79, Cholula=75, Pachuca=71, Zumpango=65,
      Huachinango=1), 42 asesores distintos, 2026-06-08 a 2026-09-07.'
  - 'Enum estándar Sí/No/N/A con mayúscula inicial en los 18 campos del checklist de
      performance (mismo casing que Hostess) -verificado con SELECT DISTINCT-.'
decision_flow:
- Identificar si la pregunta es sobre la asesoría de VENTA/piso (este Data Map) o
  sobre la RECEPCIÓN inicial (huerpel_hostess/huerpel_hostess_seminuevos, clientes
  distintos).
- Si la pregunta requiere cruzar checklist con género/resultado de la interacción,
  advertir que 235 de 1.942 filas de performance (12,1%) no tienen contraparte en
  demography (filas huérfanas, ver known_findings_v1) y quedan fuera del cruce.
- No existe categorización de motivo/necesidad/objeción estructurada más allá de los
  campos booleanos del checklist (financiamiento, valuación, prueba de manejo, etc) -
  no hay vista de insights materializada para Ventas.
- Verificar que cada condición explícita de la pregunta aparezca en SELECT, WHERE,
  GROUP BY o cálculo.
routing:
  demography:
    questions: resultado general de la interacción (compra/cambio/queja/no compra/no
      finalizada), género del cliente.
    avoid: no cruzar con performance sin advertir las 235 filas huérfanas.
  performance:
    questions: criterios del proceso de venta consultiva (inicio de consulta,
      diagnóstico de necesidades, presentación del producto y prueba de manejo, manejo
      de objeciones/propuesta económica, cierre de la venta).
    avoid: no tratar N/A como incumplimiento -la grabación puede empezar a mitad del
      proceso, en cuyo caso las etapas previas son N/A por diseño, no incumplimiento-;
      no usar prompt_id para negocio; excluir naturalmente las filas con checklist
      NULL (57 filas de prompt_id no identificado, ver known_findings_v1).
profiles:
  standard_conversation:
    row_key: conversation_id
    tenant_field: seller_id
    date_field: uploaded_at_local
    optional_dimensions:
    - store_id
    - store_name
    - employee_id
    - employee_full_name
    quality_filter: usefulforanalysis IS TRUE cuando la pregunta se refiera a
      conversaciones analizables.
sql_rules:
  scope: Usar únicamente sources[].source. Nunca consultar otra vista, schema o cliente.
  read_only: Un único SELECT o WITH...SELECT; sin interpolar texto del usuario; LIMIT 200
    para detalle.
  tenant: Aplicar el valor exacto autorizado de sesión ('Huerpel') sobre el tenant_field
    de cada fuente.
  time: Filtrar profiles[profile].date_field sólo cuando el usuario indique un período.
  conversation_population: COUNT(DISTINCT conversation_id).
  performance_rate: cumplimientos / base_evaluada; base = conversaciones distintas con
    valor Sí o No; excluir N/A y null (esto excluye automáticamente las 57 filas del
    prompt_id no identificado, cuyo checklist es NULL).
  categorical_rate_general_rule: Para cualquier campo categórico con semántica
    Sí/No/N/A o equivalente, la base evaluada excluye explícitamente "no identificado/
    no aplica" salvo que la pregunta pida esa categoría específicamente.
