    conversation_id, mientras que demography/insights simplemente no las incluye), no
    una particularidad de Huerpel Ventas. No corregido en código compartido -fuera de
    alcance de esta auditoría-, pero el mecanismo ya no es un misterio: reclasificado de
    "QUEDA ABIERTO, pipeline no investigado" a "DOCUMENTADO, causa raíz confirmada, no
    requiere fix de Data Map" (la respuesta correcta del agente sigue siendo la misma:
    reportar demografia vs. performance por separado con COUNT(*) y explicar la
    diferencia, ver joins.cross_source_totals_pattern, que no cambia con este hallazgo).'
