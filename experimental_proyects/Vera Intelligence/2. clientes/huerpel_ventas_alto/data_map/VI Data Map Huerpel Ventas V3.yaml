    que asigna conversation_id, así que jamás llegan a existir en demografia (esa vista
    sólo se puebla para conversaciones efectivamente analizadas). No es un problema de
    integridad entre dos vistas ya pobladas, es que una de las dos fuentes (demografia)
    nunca ve esas filas en absoluto. MISMO PATRÓN exacto encontrado independientemente en
