joins:
  rule: 'demography y performance comparten conversation_id pero NO tienen la misma
    población: performance tiene 235 filas más que demography (huérfanas, ver
    known_findings_v1). Un INNER JOIN entre ambas pierde esas 235 filas
    silenciosamente -advertir esto explícitamente en cualquier respuesta que cruce
    resultado (demography) con checklist (performance)-.'
  cross_source_totals_pattern: 'HALLAZGO REAL (verificado 2026-09-08, primera corrida
    del banco dorado, q03): para comparar el total de filas entre demography y
    performance (ej. para detectar/confirmar la discrepancia de filas huérfanas), NO
    usar FULL OUTER JOIN ni un JOIN dentro de CTEs con el filtro de tenant escrito
    adentro de cada CTE -la validación de seguridad de la consulta (aislamiento de
    tenant) puede rechazar ese patrón aunque cada CTE filtre correctamente por
    seller_id=Huerpel, porque exige el filtro calificado por alias en el nivel del
    WHERE de la sentencia final cuando hay más de una fuente física. Usar en cambio dos
    SELECT independientes de conteo unidos por UNION ALL, cada uno con su propio alias
    y su propio WHERE alias.seller_id = ''Huerpel'' (patrón verificado, pasa la
    validación): SELECT ''demografia'' AS fuente, COUNT(*) FROM
    dashboard_v2.vw_huerpel_ventas_demografia d WHERE d.seller_id=''Huerpel'' UNION ALL
    SELECT ''performance'', COUNT(*) FROM
    dashboard_v2.vw_huerpel_ventas_rendimiento_vendedor p WHERE p.seller_id=''Huerpel'''
known_findings_v2:
- 'CAUSA RAÍZ DE LAS 235 FILAS "HUÉRFANAS" — AHORA CONFIRMADA (auditoría de ronda 2,
    2026-09-08, no una discrepancia real de integridad referencial): V2 caracterizaba
    estas 235 filas como "existen en performance pero no tienen fila correspondiente en
    demografia por conversation_id (verificado con LEFT JOIN)", dejando el mecanismo de
    fondo QUEDA ABIERTO. Verificado ahora con SQL directo: las 235 filas NO tienen un
    conversation_id real que falle el join contra demografia -de hecho, un LEFT JOIN
    filtrando conversation_id IS NOT NULL en performance da CERO huérfanas reales (0 de
    1.707 filas de performance con conversation_id poblado carecen de contraparte en
    demografia, y 0 filas de demografia carecen de contraparte en performance)-. Las 235
    filas simplemente tienen `conversation_id IS NULL` directamente en la vista de
