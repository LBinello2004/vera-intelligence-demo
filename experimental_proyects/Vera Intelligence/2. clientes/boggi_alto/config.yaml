client_id: boggi
display_name: "Boggi"
tenant: "Boggi"
model: gemini-3.7-flash
data_map: "2. clientes/boggi_alto/data_map/VI Data Map Boggi V2.yaml"

# Cada fuente declara el campo que debe contener el tenant autorizado. El
# validador SQL exige el filtro de forma deterministica antes de ejecutar.
# insights_descriptivos_generales usa "seller" (no seller_id) -pero SI tiene
# conversation_id, a diferencia de Maga/Atlas-.
sources:
  dashboard_v2.vw_boggi_demografia:
    tenant_field: seller_id
  dashboard_v2.vw_boggi_rendimiento_vendedor:
    tenant_field: seller_id
  dashboard_v2.vw_boggi_insights_categoricos_generales:
    tenant_field: seller_id
  dashboard_v2.vw_boggi_insights_descriptivos_generales:
    tenant_field: seller
  dashboard_v2.vw_boggi_insights_categoricos_por_producto:
    tenant_field: seller_id
  dashboard_v2.vw_boggi_insights_descriptivos_por_producto:
    tenant_field: seller_id

# Fuentes semanticas autorizadas. El agente no puede listar ni solicitar otros
# contenidos de Langfuse; siempre resuelve la version marcada production.
business_rulebooks:
  sales_evaluation:
    name: "clientes/Haber/Boggi/checklist"
    label: production
    business_scope: "Criterios de atención y desempeño del vendedor"
  conversation_insights:
    name: "clientes/Haber/Boggi/insights"
    label: production
    business_scope: "Criterios de resultados, motivos y comportamiento comercial"
  # Generalizado a todos los clientes (2026-09-11) -source local, NO Langfuse: contenido
  # versionado en este mismo repo ("2. clientes/_shared/business_rulebooks/coaching_playbook.md"),
  # borrador técnico sin revisión del equipo de negocio todavía. Ver README de
  # "3. experimentos/coaching_playbook/".
  coaching_playbook:
    source: local
    path: "2. clientes/_shared/business_rulebooks/coaching_playbook.md"
    business_scope: "Recomendaciones de coaching y desarrollo de vendedores según su desempeño (bajo o alto)"

# Boggi no tiene RAG: su prompt de checklist no declara geminiFileSearchStoreName.

# Búsqueda vectorial habilitada (2026-09-16, ampliación a todos los clientes viables) -verificado
# por SQL directo: 1.670 embeddings reales para seller_id='Boggi' en
# analytics_v2.conversation_embeddings, repartidos en 4 tiendas distintas, actividad desde
# 2026-03-31 hasta 2026-09-13 (no es un cliente inactivo). resumen_verificado SÍ está disponible:
# vw_boggi_insights_descriptivos_generales tiene conversation_id y su columna
# resumen_ejecutivo_conversacion coincide con el nombre por defecto -no hace falta agregar Boggi
# a _RESUMEN_COLUMN_BY_TENANT ni a _DESCRIPTIVOS_UNSUPPORTED_TENANTS en vector_search.py-.
vector_search:
  top_k: 5
