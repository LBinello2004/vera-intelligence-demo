client_id: huerpel_hostess_seminuevos
display_name: "Huerpel Hostess Seminuevos"
tenant: "Huerpel"
model: gemini-3.7-flash
data_map: "2. clientes/huerpel_hostess_seminuevos_medio/data_map/VI Data Map Huerpel Hostess Seminuevos V2.yaml"

# Sub-marca "Hostess Seminuevos" del grupo Huerpel (México): recepción inicial en la
# unidad de vehículos SEMINUEVOS/usados multimarca (Nami), tienda única, 673 conversaciones
# / 609 analizables -volumen bien menor que Hostess (autos nuevos) y Ventas-. Ver
# clientes/huerpel_hostess_alto/config.yaml para la justificación completa de por qué
# Huerpel se onboardeó como TRES clientes separados (Hostess, Hostess Seminuevos, Ventas)
# en vez de uno solo con múltiples business_rulebooks, y el README, sección "Onboarding de
# Huerpel".
sources:
  dashboard_v2.vw_huerpel_hostess_seminuevos_demografia:
    tenant_field: seller_id
  dashboard_v2.vw_huerpel_hostess_seminuevos_rendimiento_vendedor:
    tenant_field: seller_id
  dashboard_v2.vw_huerpel_hostess_seminuevos_insights_categoricos:
    tenant_field: seller_id

business_rulebooks:
  sales_evaluation:
    name: "clientes/Huerpel/Hostess Seminuevos/checklist"
    label: production
    business_scope: "Criterios de recepción inicial en la unidad de seminuevos certificados (Huerpel Hostess Seminuevos): saludo institucional, perfilamiento del vehículo buscado, datos de contacto, identificación de origen, asignación de asesor"
  conversation_insights:
    name: "clientes/Huerpel/Hostess Seminuevos/insights"
    label: production
    business_scope: "Tipo y forma de llegada, vehículo buscado, medio publicitario de origen, intención de toma, forma de pago estimada y completitud del registro de datos del cliente"
  # Generalizado a todos los clientes (2026-09-11) -source local, NO Langfuse: contenido
  # versionado en este mismo repo ("2. clientes/_shared/business_rulebooks/coaching_playbook.md"),
  # borrador técnico sin revisión del equipo de negocio todavía. Ver README de
  # "3. experimentos/coaching_playbook/".
  coaching_playbook:
    source: local
    path: "2. clientes/_shared/business_rulebooks/coaching_playbook.md"
    business_scope: "Recomendaciones de coaching y desarrollo de vendedores según su desempeño (bajo o alto)"

# Huerpel Hostess Seminuevos no tiene RAG: ninguno de los dos prompts declara
# geminiFileSearchStoreName en su config de Langfuse -sólo traen promptId-.

# Búsqueda vectorial habilitada (2026-09-16, ampliación a todos los clientes viables) -mismo
# seller_id='Huerpel' compartido por las tres sub-marcas, ver justificación completa de
# `store_names` en huerpel_hostess_alto/config.yaml. Acá el store_name físico exclusivo es
# "Hostess Seminuevos" (1.673 embeddings verificados por SQL directo, volumen menor que Hostess,
# consistente con el volumen de conversaciones ya documentado arriba). Sin
# insights_descriptivos_generales -resumen_verificado sale None.
vector_search:
  top_k: 5
  store_names:
    - "Hostess Seminuevos"
