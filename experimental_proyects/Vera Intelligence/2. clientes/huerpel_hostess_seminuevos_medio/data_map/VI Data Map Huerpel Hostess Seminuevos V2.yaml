          a la v5 del prompt.'
        operations: [filter, group]
joins:
  rule: 'demography, performance y conversation_insights comparten conversation_id.
    Join permitido calificando el tenant en cada fuente si se usan más de una en la
    misma consulta.'
limitations:
- Resultado y desempeño son inferencias conversacionales del modelo, no ventas
  certificadas.
- 'LIMITACIÓN PRINCIPAL: demography.tipointeraccion está 100% sin poblar. No existe
  ninguna fuente de "resultado comercial" en este Data Map.'
- Este Data Map cubre exclusivamente la recepción de Huerpel Hostess Seminuevos. No
  cubre Hostess (autos nuevos) ni Ventas (clientes separados, ver README).
- Volumen menor (673 conversaciones) que Hostess (5.609) o Ventas (1.707) -las cifras
  segmentadas por tienda/vendedor/mes pueden volverse poco representativas rápido; se
  recomienda presentar cifras absolutas junto a los porcentajes.
- No responde organización, conectividad, gamificación, roleplays ni dominios de otros
  clientes.