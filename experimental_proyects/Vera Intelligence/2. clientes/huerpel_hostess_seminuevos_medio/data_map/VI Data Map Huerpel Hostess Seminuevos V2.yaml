metadata:
  name: VI Data Map Huerpel Hostess Seminuevos V2
  version: 2.0.0
  client: Huerpel Hostess Seminuevos
  model_target: Gemini 3.7
  generated_at: '2026-09-16'
  scope: Tres vistas dashboard_v2 de la sub-marca Hostess Seminuevos de Huerpel
    (demografia + rendimiento_vendedor + insights_categoricos). El tenant ('Huerpel') es
    fijo. Cubre exclusivamente la recepción inicial en la unidad de vehículos SEMINUEVOS/
    usados certificados (marca comercial interna "Nami"), no la recepción de autos nuevos
    (huerpel_hostess) ni la asesoría comercial de piso (huerpel_ventas).
  source_of_truth:
    checklist_prompt: clientes/Huerpel/Hostess Seminuevos/checklist (Langfuse, label
      production, v4 al construir este mapa, promptId idVHo0KCaHXS67SxqvVf)
    insights_prompt: clientes/Huerpel/Hostess Seminuevos/insights (Langfuse, label
      production, v5 al construir este mapa, promptId idVHo0KCaHXS67SxqvVf)
    note: 'Ver clientes/huerpel_hostess_alto/data_map/VI Data Map Huerpel Hostess
      V1.yaml para el contexto completo del grupo Huerpel (3 sub-marcas, 8 vistas
      reales en Postgres, por qué se onboardearon como 3 clientes separados). Verificado
      cruzando dashboard_v2.vw_huerpel_hostess_seminuevos_rendimiento_vendedor.prompt_id
      (idVHo0KCaHXS67SxqvVf, 673 filas, 100% de la vista) contra el promptId del prompt
      de Langfuse: coincide exacto.'
  changes_from_v1:
  - 'Actualización del prompt conversation_insights de v4 a v5: se agrega el campo descriptivo
      nombre_cliente (nombre de pila o completo identificado en la transcripción, sin requerir
      hostess_pregunta_nombre_completo=true).'
  hallazgos_criticos_verificados_2026-09-16:
  - 'nombre_cliente en dashboard_v2.vw_huerpel_hostess_seminuevos_insights_categoricos:
      columna materializada en base de datos pero con 100% NULL (622 de 622 filas al 2026-09-16)
      por tratarse de un campo recién incorporado en la versión 5 del prompt para conversaciones nuevas.'
  known_findings_v1:
  - 'VOLUMEN MENOR que Hostess y Ventas: 673 conversaciones totales, 609 analizables
      (90,5%), 2026-06-08 a 2026-09-07, tienda única, 7 hostess/host distintos. Da señal
      real pero menos robusta que Hostess (5.609) o Ventas (1.707); bases de 600 filas
      son razonablemente interpretables pero conviene presentar cifras absolutas junto
      a los porcentajes en preguntas segmentadas.'
  - 'ROL DE RECEPCIÓN, NO DE VENTA: el checklist evalúa a quien hace la recepción
      inicial de seminuevos (saludo institucional, perfilamiento, datos de contacto,
      asignación de APV), no al asesor que vende la unidad. No atribuir tasas de cierre
      de venta a este Data Map.'
  - 'CAMPO MUERTO VERIFICADO (mismo hallazgo que Hostess): demography.tipointeraccion es
      100% NULL (673 de 673 filas). No usar para "resultado de la interacción"; no
      existe otra fuente de resultado comercial en este Data Map.'
  - 'demography.generocliente SÍ está poblado (673 de 673, 0 NULL): Masculino=295
      (43,8%), No Identificado=279 (41,5%), Femenino=99 (14,7%).'
  - 'Enum estándar Sí/No/N/A con mayúscula inicial en los 14 campos del checklist -
      verificado con SELECT DISTINCT en cada uno-. A diferencia del checklist de Hostess
      (10 campos), este tiene 14, organizados en 5 secciones: Abordaje y Bienvenida (2),
      Perfilamiento Estratégico (4), Datos de Contacto y Validación (4), Identificación
      de Origen (2), Asignación y Experiencia (2).'
  - 'insights_categoricos usa snake_case en minúsculas para valores (a diferencia de
      Hostess/Ventas que usan PascalCase con tilde, ej. "Fresh Up") -verificado en el
      prompt: "tipo_visita" usa "fresh up"/"be back"/"no identificado" en minúsculas,
      no "Fresh Up". Particularidad propia de este prompt, documentada para no asumir
      el mismo casing que las otras 2 sub-marcas al construir SQL con comparaciones de
      texto.'
  - 'registro_completo=true sólo en 81 de 673 (12,0%) -exige las 8 preguntas
      obligatorias del registro completas (nombre, teléfono, correo, unidad buscada,
      medio publicitario, intención de toma, forma de pago, presupuesto). aplica_
      registro_completo=true en 470 de 673 (69,8%, el resto son Be-Back donde no
      corresponde exigir registro completo). Tasa de registro completo cuando aplica:
      81/470 = 17,2% -bajo, documentado como hallazgo real, no corregido (es una
      medición honesta del cumplimiento, no un error del Data Map).'
decision_flow:
- Identificar si la pregunta es sobre la RECEPCIÓN de seminuevos (este Data Map) o
  sobre autos nuevos (huerpel_hostess) / venta de piso (huerpel_ventas) -clientes
  distintos-.
- Si pide "resultado de la interacción", advertir que demography.tipointeraccion está
  100% sin poblar para esta sub-marca.
- Verificar que cada condición explícita de la pregunta aparezca en SELECT, WHERE,
  GROUP BY o cálculo.
routing:
  demography:
    questions: género del cliente. NO resultado de la interacción (campo muerto).
    avoid: no usar tipointeraccion, está 100% NULL.
  performance:
    questions: criterios del protocolo de recepción de seminuevos (saludo
      institucional, perfilamiento de marca/modelo/año, vehículo para toma, forma de
      pago, presupuesto, datos de contacto, verificación de atención previa, origen,
      cita/promoción, presentación del asesor, amenidad).
    avoid: no tratar N/A como incumplimiento; en Be-Back la mayoría de los campos de
      perfilamiento/datos/origen son N/A por diseño (ver reglas del prompt).
  conversation_insights:
    questions: tipo y forma de llegada, vehículo buscado (marca/segmento/color),
      medio publicitario, intención de toma, forma de pago estimada, completitud del
      registro de datos, nombre del cliente.
    avoid: no confundir aplica_registro_completo (si correspondía exigir el registro)
      con registro_completo (si efectivamente se completó).
profiles:
  standard_conversation:
    row_key: conversation_id
    tenant_field: seller_id
    date_field: uploaded_at_local
    optional_dimensions:
    - store_id
    - store_name
    - employee_id
    - employee_full_name
    quality_filter: usefulforanalysis IS TRUE cuando la pregunta se refiera a
      conversaciones analizables.
sql_rules:
  scope: Usar únicamente sources[].source. Nunca consultar otra vista, schema o cliente.
  read_only: Un único SELECT o WITH...SELECT; sin interpolar texto del usuario; LIMIT 200
    para detalle.
  tenant: Aplicar el valor exacto autorizado de sesión ('Huerpel') sobre el tenant_field
    de cada fuente.
  time: Filtrar profiles[profile].date_field sólo cuando el usuario indique un período.
  conversation_population: COUNT(DISTINCT conversation_id).
  performance_rate: cumplimientos / base_evaluada; base = conversaciones distintas con
    valor Sí o No; excluir N/A y null.
  categorical_rate_general_rule: Para cualquier campo categórico con semántica
    Sí/No/N/A o equivalente, la base evaluada excluye explícitamente "no identificado/
    no aplica" salvo que la pregunta pida esa categoría específicamente.
  dominant_category_rule: 'HALLAZGO REAL (verificado 2026-09-08, primera corrida del
    banco dorado, q11): al reportar "cuál es el valor/categoría más frecuente" de un
    campo categórico, calcular la moda sobre la POBLACIÓN TOTAL (incluyendo "no
    mencionado"/"no identificado"/"no aplica" si resulta ser la categoría mayoritaria),
    nunca sólo sobre el subconjunto de valores declarados/identificados -salvo que la
    pregunta pida explícitamente "entre los que sí declararon X". En la primera corrida,
    el agente tituló forma_pago_estimada como "la forma de pago más mencionada es
    crédito" (149 de 673, 22,1%) cuando la categoría real mayoritaria es "no
    mencionado" (384 de 673, 57,1%) -la tabla completa que acompañaba la respuesta era
    correcta, pero el titular condicionaba implícitamente sobre el subconjunto
    declarado sin decirlo. Mismo tipo de hallazgo que la ambigüedad de denominador
    documentada para "cashback" en Mens Fashion V4 y para q16 de Farma24.'
