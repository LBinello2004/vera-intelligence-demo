  descriptive_insights:
    source: dashboard_v2.vw_maga_insights_descriptivos_generales
    use_when: Motivo textual de la no compra, y dimensiones de negocio (mes/año). AISLADA -ver known_findings_v1-.
    grain: Una fila por recordingid (NO por conversation_id, a diferencia de Farma24); texto libre no agregable.
    profile: descriptive_conversation_aislada
    data_quality_note: 'A diferencia de Farma24, en Maga esta vista NO tiene conversation_id ni seller_id (sólo
      seller_name, recordingid) y SIGUE ACTUALIZÁNDOSE con normalidad (no está congelada). No se puede cruzar
      con ninguna otra fuente de Maga. Ver known_findings_v1 para el detalle completo.'
    fields:
      month:
        type: integer
        nullable: true
        description: 'Mes de la conversación (nombre físico "month", no "business_month" como en Farma24 —
          verificado contra information_schema.columns, no es un error de este mapa).'
        operations: [filter, group]
      year:
        type: integer
        nullable: true
        description: 'Año de la conversación (nombre físico "year", no "business_year" como en Farma24).'
        operations: [filter, group]
      descriptivos_generales_tipo_interaccion_detalle:
        type: text
        nullable: true
        description: 'Explicación breve del motivo de no compra (sólo poblado cuando el resultado de la
          interacción es no_compra). Si el motivo fue falta de stock, menciona qué producto faltaba.'
        operations: [select_evidence]
  categorical_product_insights:
    source: dashboard_v2.vw_maga_insights_categoricos_por_producto
    use_when: Producto, marca, presentación, rol comercial, falta de stock y su gestión, venta con promoción
      Banco Provincia, si el producto se terminó comprando.
    grain: Una fila por conversation_id + producto_index.
    profile: standard_conversation
    fields:
      producto_index:
        type: integer
        nullable: false
        description: Índice del producto dentro de la conversación (empieza en 1, correlativo). Clave de join
          con descriptive_product_insights.
        operations: [join_key, filter]
      producto:
        type: text
        nullable: true
        description: 'Nombre del producto tal como fue mencionado, texto libre (no enum cerrado). 152 filas NULL
          sobre 247.682 (0,06%), verificado — declarado nullable=true por precaución (mismo criterio que la
          corrección de Farma24 V2). CASING: variantes de mayúsculas/minúsculas comunes (ej. "ibuprofeno" en 3
          variantes, 11.340 filas) — normalizar con LOWER(TRIM(producto)) antes de agrupar o rankear.'
        operations: [select_evidence, filter]
      marca:
        type: text
        nullable: true
        description: Marca o laboratorio del producto, sólo si hay evidencia clara. Mismo problema sistémico de
          casing que producto — normalizar antes de agrupar o rankear.
        operations: [select_evidence]
      presentacion:
        type: text
        nullable: true
        description: Dosis, concentración, tamaño, cantidad o forma farmacéutica. Null si no hay evidencia clara;
          nunca inferida.
        operations: [select_evidence]
      rol_comercial:
        configured_values: [pedido_inicial, sustituto, adicional_ofrecido_por_vendedor, solicitado_adicionalmente_por_cliente, no_determinable]
        observed_values: [pedido_inicial, sustituto, adicional_ofrecido_por_vendedor, solicitado_adicionalmente_por_cliente, no_determinable]
        type: text
        nullable: true
        description: 'Rol del producto en la interacción. IMPORTANTE: NULL para las filas anteriores al
          2026-08-03 por corte de versión del prompt (106.726 de 247.682 pobladas, 43,1% — verificado 2026-09-07,
          misma fecha de corte que Farma24). No es "no determinable" de negocio, es cobertura histórica.'
        operations: [filter, group, compare]
      se_vendio_con_promo_banco_provincia:
        configured_values: [si, 'no', no_determinable]
        observed_values: [si, 'no', no_determinable]
        type: text
        nullable: true
        description: 'Si este producto quedó incluido en una compra pagada/financiada con Banco Provincia, Cuenta
          DNI o cuotas sin interés aceptadas. Si "si" para cualquier producto, categorical_insights.cliente_tiene_banco_provincia_o_cuenta_dn
          debe ser "si" en ~97,8% de los casos (ver semantic_dependencies.banco_provincia). REGLA DE TASA: base
          evaluada = si+no = 39.244, tasa si = 14,8% (verificado 2026-09-07).'
        operations: [filter, group, compare]
      hubo_falta_stock:
        type: boolean
        configured_values: [false, true]
        observed_values: [false, true]
        nullable: true
        description: Si hubo falta real de disponibilidad física de este producto (no confundir con trabas de
          receta, obra social, PAMI, autorización, cobertura, sistema, DNI, fecha o precio).
        operations: [filter, group, compare]
      que_hizo_vendedor:
        configured_values: [ofrecio_sustituto, ofrecio_vale_o_drogueria, ofrecio_otra_sucursal_o_envio, no_ofrecio_nada, no_aplica]
        observed_values: [no_aplica, no_ofrecio_nada, ofrecio_sustituto, ofrecio_vale_o_drogueria, ofrecio_otra_sucursal_o_envio]
        type: text
        nullable: true
        description: Acción del vendedor frente a la falta de stock de ESTE producto. Sólo interpretable cuando
          hubo_falta_stock=true (si es false, siempre no_aplica).
        operations: [filter, group, compare]
      se_termino_comprando:
        type: boolean
        configured_values: [false, true]
        observed_values: [false, true]
        nullable: true
        description: Si este producto puntual terminó vendiéndose. Un producto faltante reemplazado por un
          sustituto exitoso queda en false para el original y true para el sustituto (filas separadas).
        operations: [filter, group, compare]
  descriptive_product_insights:
    source: dashboard_v2.vw_maga_insights_descriptivos_por_producto
    use_when: Evidencia textual de falta de stock y de la acción del vendedor, por producto.
    grain: Una fila por conversation_id + producto_index; texto libre no agregable como categoría.
    profile: standard_conversation
    fields:
      producto_index:
        type: integer
        nullable: false
        description: Índice del producto; unir con la vista categórica usando conversation_id + producto_index.
        operations: [join_key, filter]
      evidencia_falta_stock:
        type: text
        nullable: true
        description: Cita textual breve que conecta el producto con la falta de stock. Casi siempre null si
          hubo_falta_stock=false y casi siempre poblada si es true (patrón heredado de Farma24, no re-verificado
          campo por campo en Maga — tratar como "casi siempre", no como regla absoluta).
        operations: [select_evidence]
      evidencia_accion_vendedor:
        type: text
        nullable: true
        description: Cita textual del momento donde el vendedor ofreció sustituto/vale/droguería/otra
          sucursal/envío. Casi siempre null si que_hizo_vendedor es no_ofrecio_nada o no_aplica (mismo patrón
          heredado de Farma24, no re-verificado campo por campo).
        operations: [select_evidence]
limitations:
- Compra y resultado son inferencias conversacionales del modelo, no tickets ni ventas certificadas.
- 'Este Data Map reutiliza la estructura de Farma24 V7 porque los prompts de negocio son carácter por carácter
  idénticos, pero todos los números fueron re-verificados de forma independiente contra los datos propios de
  Maga (ver metadata.known_findings_v1). La única diferencia estructural real (no sólo de datos) es
  descriptive_insights, con un esquema físico distinto en Maga -ver ese hallazgo-.'
- No se re-verificaron campo por campo las correlaciones "casi siempre" de evidencia_falta_stock/evidencia_accion_vendedor
  contra que_hizo_vendedor/hubo_falta_stock -se heredó el patrón de Farma24 sin re-medir los porcentajes exactos
  en Maga, a diferencia del resto del mapa-.
- No se investigó la tabla dashboard_v2.reporte_semanal_farma24 (ni si existe un equivalente para Maga) — fuera
  del alcance de este mapa, mismo criterio que Farma24.
- El mapa no responde organización, conectividad, gamificación, roleplays ni dominios de otros clientes.
