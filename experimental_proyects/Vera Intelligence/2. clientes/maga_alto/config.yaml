client_id: maga
display_name: "Maga"
tenant: "Maga"
model: gemini-3.7-flash
data_map: "2. clientes/maga_alto/data_map/VI Data Map Maga V2.yaml"

# Cada fuente declara el campo que debe contener el tenant autorizado. El
# validador SQL exige el filtro de forma deterministica antes de ejecutar.
# Las 5 vistas principales usan seller_id de forma consistente (igual que
# Farma24). La excepcion es insights_descriptivos_generales, que en Maga NO
# tiene seller_id ni conversation_id -ver Data Map, fields.descriptive_insights-.
sources:
  dashboard_v2.vw_maga_demografia:
    tenant_field: seller_id
  dashboard_v2.vw_maga_rendimiento_vendedor:
    tenant_field: seller_id
  dashboard_v2.vw_maga_insights_categoricos_generales:
    tenant_field: seller_id
  dashboard_v2.vw_maga_insights_descriptivos_generales:
    tenant_field: seller_name
  dashboard_v2.vw_maga_insights_categoricos_por_producto:
    tenant_field: seller_id
  dashboard_v2.vw_maga_insights_descriptivos_por_producto:
    tenant_field: seller_id

# Fuentes semanticas autorizadas. El agente no puede listar ni solicitar otros
# contenidos de Langfuse; siempre resuelve la version marcada production.
business_rulebooks:
  sales_evaluation:
    name: "clientes/Maga/checklist"
    label: production
    business_scope: "Criterios de atención y desempeño del vendedor/farmacéutico"
  conversation_insights:
    name: "clientes/Maga/insights"
    label: production
    business_scope: "Criterios de resultados, faltantes de stock, sustituciones y promoción Banco Provincia/Cuenta DNI"
  # Generalizado a todos los clientes (2026-09-11) -source local, NO Langfuse: contenido
  # versionado en este mismo repo ("2. clientes/_shared/business_rulebooks/coaching_playbook.md"),
  # borrador técnico sin revisión del equipo de negocio todavía. Ver README de
  # "3. experimentos/coaching_playbook/".
  coaching_playbook:
    source: local
    path: "2. clientes/_shared/business_rulebooks/coaching_playbook.md"
    business_scope: "Recomendaciones de coaching y desarrollo de vendedores según su desempeño (bajo o alto)"

# Fuentes de RAG (Gemini File Search) autorizadas. El nombre físico del store
# se resuelve en tiempo de ejecución vía rag_sources.py, nunca se declara acá.
# IMPORTANTE: Maga comparte el store físico de catálogo con Farma24 (confirmado
# por el negocio: misma cadena/franquicia, mismo catálogo real) — verificado en
# Langfuse que clientes/Maga/checklist declara el mismo geminiFileSearchStoreName
# que clientes/Farma 24/checklist (fileSearchStores/centralchecklistfarma24chec-...).
rag_sources:
  product_catalog:
    name: "clientes/Maga/checklist"
    label: production
    business_scope: "Catálogo de productos y patologías: información de referencia sobre productos, sustitutos y usos"
    top_k: 5

# Búsqueda semántica sobre conversaciones vectorizadas (generalización 2026-09-11, ver
# "6. busqueda_vectorial/README.md" > Iteración 20). Segundo cliente con RAG + búsqueda vectorial
# a la vez (después de Farma24). Cobertura de backfill verificada: 83,0% (168.855/203.365
# recordings con embedding, mismo EMBEDDING_CONFIG_ID que mens_fashion_alto) -el mejor volumen y
# cobertura de todos los clientes con vector_search habilitado hasta ahora.
# Limitación propia de Maga: vw_maga_insights_descriptivos_generales NO tiene columna
# conversation_id (usa recordingid) -el JOIN de resumen_verificado de vector_search.py se rompería
# con "column di.conversation_id does not exist" si se intentara -por eso el tenant "Maga" está en
# _DESCRIPTIVOS_UNSUPPORTED_TENANTS (vector_search.py), tratado como cliente de schema delgado para
# esto: resumen_verificado sale None, sólo el fragmento reconstruido está disponible.
vector_search:
  top_k: 5
