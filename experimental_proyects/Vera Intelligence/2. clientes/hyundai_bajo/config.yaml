client_id: hyundai
display_name: "Hyundai"
tenant: "Hyundai"
model: gemini-3.7-flash
data_map: "2. clientes/hyundai_bajo/data_map/VI Data Map Hyundai V2.yaml"

# Hyundai es "schema delgado" (2 vistas, sin insights) y el cliente de este batch con más
# señales de estar INACTIVO: sin conversaciones nuevas desde 2026-06-20 (ver README y
# known_findings_v1 del Data Map). checklist idéntico carácter por carácter al de GAC
# (gemelo de prompt, ambos concesionarias) -verificado leyendo Langfuse-.
sources:
  dashboard_v2.vw_hyundai_demografia:
    tenant_field: seller_id
  dashboard_v2.vw_hyundai_rendimiento_vendedor:
    tenant_field: seller_id

business_rulebooks:
  sales_evaluation:
    name: "clientes/Hyundai/checklist"
    label: production
    business_scope: "Criterios de atención y desempeño del asesor en concesionaria de vehículos (Hyundai)"
  # Generalizado a todos los clientes (2026-09-11) -source local, NO Langfuse: contenido
  # versionado en este mismo repo ("2. clientes/_shared/business_rulebooks/coaching_playbook.md"),
  # borrador técnico sin revisión del equipo de negocio todavía. Ver README de
  # "3. experimentos/coaching_playbook/".
  coaching_playbook:
    source: local
    path: "2. clientes/_shared/business_rulebooks/coaching_playbook.md"
    business_scope: "Recomendaciones de coaching y desarrollo de vendedores según su desempeño (bajo o alto)"

# Hyundai no tiene RAG: su prompt de checklist no declara geminiFileSearchStoreName -el store
# de clientes/Hyundai/feedback es de otro producto/feature, no de Vera Intelligence-.

# Búsqueda vectorial habilitada (2026-09-16, ampliación a todos los clientes viables) -verificado
# por SQL directo: 151 embeddings reales para seller_id='Hyundai', tienda única. Cliente inactivo
# desde 2026-06-20 (ver nota arriba) -la búsqueda igual tiene valor sobre el histórico ya
# vectorizado para coaching retrospectivo, no se descarta por inactividad. Sin
# insights_descriptivos_generales -resumen_verificado sale None, degradación normal.
vector_search:
  top_k: 5
