joins:
  rule: Sin segunda fuente disponible en este cliente, no hay joins posibles.
limitations:
- Compra y resultado son inferencias conversacionales del modelo, no ventas certificadas.
- 'LIMITACIÓN PRINCIPAL 1: no existe ninguna vista de insights para este cliente. Cualquier pregunta
  sobre motivo, necesidad, objeción o competencia no puede responderse.'
- 'LIMITACIÓN PRINCIPAL 2: sin conversaciones nuevas desde 2026-06-20 (casi 3 meses a la fecha de
  este Data Map) -advertir siempre que estos datos pueden no reflejar la operación actual.'
- 'LIMITACIÓN PRINCIPAL 3: tipointeraccion tiene una taxonomía fragmentada con al menos 3
  convenciones de captura mezcladas, incluyendo un valor ("Trámite") fuera del enum configurado del
  prompt y un string literal "N/A" distinto de NULL real -ver known_findings_v1-. No se investigó la
  causa raíz ni se normalizó -QUEDA ABIERTO para una futura auditoría-.'
- El mapa no responde organización, conectividad, gamificación, roleplays ni dominios de otros
  clientes.
