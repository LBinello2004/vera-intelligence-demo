# Tigo no tiene RAG: su prompt de checklist no declara geminiFileSearchStoreName.

# Búsqueda semántica sobre conversaciones vectorizadas (generalización 2026-09-11, ver
# "6. busqueda_vectorial/README.md" > Iteración 20). Cobertura de backfill verificada: 67,4%
# (65.671/97.442 recordings con embedding, mismo EMBEDDING_CONFIG_ID que mens_fashion_alto).
# Limitación propia de Tigo (esquema no estándar, no es bug): su fuente se llama
# "vw_tigo_insights_descriptivos" (sin sufijo "_generales"), así que no matchea la convención de
# nombre de _find_descriptivos_source -mismo caso que Steren- y resumen_verificado sale None,
# sólo el fragmento reconstruido está disponible.
vector_search:
  top_k: 5
