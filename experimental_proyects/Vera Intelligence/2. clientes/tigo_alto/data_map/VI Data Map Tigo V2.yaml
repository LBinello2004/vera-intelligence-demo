  categorical_insights:
    source: dashboard_v2.vw_tigo_insights_categoricos
    use_when: Trámite principal, causas de retiro/no retención, dolor del cliente, causa de demora, motivo de
      consulta de factura, inducción de NPS, canal sugerido indebidamente, y las 18 calificaciones cualitativas
      1-5 del asesor (ver known_findings_v1, comparten numeración "a" con performance pero son campos distintos).
    grain: Una fila por conversación.
    profile: standard_conversation
    fields:
      i03_solicitud_o_tramite_principal:
        configured_values: [factura, cancelacion_retiro, soporte_tecnico_hogar, soporte_tecnico_movil, venta_hogar, venta_movil, cambio_plan, portabilidad, reposicion_chip_esim, imei_bloqueo_desbloqueo, pqr_reclamo, app_autogestion, otro, n/a]
        observed_values: [factura, cancelacion_retiro, soporte_tecnico_hogar, soporte_tecnico_movil, venta_hogar, venta_movil, cambio_plan, portabilidad, reposicion_chip_esim, imei_bloqueo_desbloqueo, pqr_reclamo, app_autogestion, otro, n/a]
        type: text
        nullable: true
        description: 'Trámite/gestión principal de la conversación. Verificado (top 5): factura=15.701,
          n/a=11.102, cancelacion_retiro=9.210, pqr_reclamo=7.456, reposicion_chip_esim=4.680.'
        operations: [filter, group, compare]
      i05_induce_calificacion_nps_5:
        configured_values: [si, 'no', n/a]
        observed_values: [si, 'no', n/a]
        type: text
        nullable: true
        description: 'si si el asesor induce/presiona/guía al cliente a calificar 5 en NPS/encuesta. Es un
          hallazgo de integridad de métrica, no un logro comercial (ver semantic_dependencies.nps_induction).
          n/a si no se menciona encuesta/NPS.'
        operations: [filter, group, compare]
      i07_causa_principal_de_no_retencion:
        configured_values: &causa_retiro_enum [precio, factura_alta, mala_senal_cobertura, mal_servicio_experiencia, mejor_oferta_externa, no_necesita_servicio, no_le_interesa_oferta, beneficios_insuficientes, proceso_lento, otro, n/a]
        observed_values: *causa_retiro_enum
        type: text
        nullable: true
        description: 'Causa por la que un intento de retención NO logró convencer al cliente (sólo interpretable
          si hubo intento de retención con oferta/descuento/beneficio y el cliente no aceptó). Ver
          semantic_dependencies.retencion_causas — no confundir con i09.'
        operations: [filter, group, compare]
      i09_causa_principal_de_retiro:
        configured_values: *causa_retiro_enum
        observed_values: *causa_retiro_enum
        type: text
        nullable: true
        description: 'Causa por la que el cliente quiere cancelar/retirarse (independiente de si hubo o no
          intento de retención). Verificado (excluyendo n/a): factura_alta=6.538, mal_servicio_experiencia=2.603,
          precio=2.367, otro=1.947, no_necesita_servicio=1.699, mala_senal_cobertura=1.544.'
        operations: [filter, group, compare]
      i22_dolor_o_molestia_principal_del_cliente:
        configured_values: [factura_alta_incorrecta, mala_senal_cobertura, lentitud_demora, falla_tecnica_hogar, falla_tecnica_movil, cobro_no_reconocido, mal_servicio_atencion, problema_con_plan_beneficios, problema_con_equipo, otro, n/a]
        observed_values: [factura_alta_incorrecta, mala_senal_cobertura, lentitud_demora, falla_tecnica_hogar, falla_tecnica_movil, cobro_no_reconocido, mal_servicio_atencion, problema_con_plan_beneficios, problema_con_equipo, otro, n/a]
        type: text
        nullable: true
        description: Dolor/fricción principal expresado por el cliente en la conversación.
        operations: [filter, group, compare]
      i32_causa_principal_de_demora:
        configured_values: [sistema_lento, validacion_documental, espera_de_turno, falta_de_respuesta_de_otro_canal, busqueda_de_informacion, proceso_operativo, cliente_indeciso, otro, n/a]
        observed_values: [sistema_lento, validacion_documental, espera_de_turno, falta_de_respuesta_de_otro_canal, busqueda_de_informacion, proceso_operativo, cliente_indeciso, otro, n/a]
        type: text
        nullable: true
        description: Causa principal de una demora observable/mencionada en la atención. n/a si no hay demora
          evaluable.
        operations: [filter, group, compare]
      i34_motivo_principal_consulta_factura:
        configured_values: [queja_factura, inconformidad_facturacion, variacion_de_factura, distribucion_de_factura, cobranzas, suspension_reconexion, otro, n/a]
        observed_values: [queja_factura, inconformidad_facturacion, variacion_de_factura, distribucion_de_factura, cobranzas, suspension_reconexion, otro, n/a]
        type: text
        nullable: true
        description: Motivo específico de una consulta de factura. n/a si la conversación no trata de factura.
        operations: [filter, group, compare]
      i35_incita_contactar_otros_canales_para_tema_de_tienda:
        configured_values: [si, 'no', n/a]
        observed_values: [si, 'no', n/a]
        type: text
        nullable: true
        description: si si el asesor empuja indebidamente al cliente a otro canal para un tema resoluble en
          tienda.
        operations: [filter, group, compare]
      i35_canal_sugerido_indebidamente:
        configured_values: [cc, chat, app, otro, n/a]
        observed_values: [cc, chat, app, otro, n/a]
        type: text
        nullable: true
        description: Canal sugerido indebidamente cuando i35_incita_contactar_otros_canales_para_tema_de_tienda=si;
          n/a en cualquier otro caso.
        operations: [filter, group, compare]
      calidad_del_asesor_escala:
        description: 'Los siguientes 18 campos usan escala 1-5 (1=muy deficiente, 5=excelente, n/a=sin base
          suficiente). Reportar promedio/distribución, no tasa de cumplimiento (ver sql_rules.scale_field_rule).
          Promedios verificados contra Postgres el 2026-09-07 (formato: descripción — promedio sobre base
          evaluada / filas n/a). Ningún campo baja de 3,0 ni supera 3,75 — desempeño cualitativo consistentemente
          "aceptable a bueno" en todo el checklist, sin outliers extremos.'
        campos:
          a03_tono_amable_respetuoso_profesional: 'Tono amable, respetuoso y profesional — promedio 3,60 (base=54.738, n/a=12.726).'
          a04_manejo_emocional_del_cliente_molesto: 'Manejo emocional de un cliente molesto — promedio 3,31 (base=26.048, n/a=41.416, la de mayor n/a: sólo se activa si el cliente está molesto).'
          a05_genera_confianza_y_seguridad_desde_el_inicio: 'Genera confianza y seguridad desde el inicio — promedio 3,15 (base=52.091, n/a=15.373).'
