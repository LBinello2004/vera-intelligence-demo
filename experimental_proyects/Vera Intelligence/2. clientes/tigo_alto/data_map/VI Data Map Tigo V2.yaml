    grain: Una fila por conversation_id + producto_index; texto libre no agregable.
    profile: standard_conversation
    fields:
      producto_index: {type: integer, nullable: false, description: Índice del producto; unir con la vista categórica usando conversation_id + producto_index., operations: [join_key, filter]}
      detalle_producto_servicio: {type: text, nullable: true, description: Detalle textual del producto/servicio mencionado., operations: [select_evidence]}
      detalle_mencion: {type: text, nullable: true, description: Detalle textual de la mención (contexto, motivo, resultado)., operations: [select_evidence]}
limitations:
- Compra y resultado son inferencias conversacionales del modelo, no tickets ni ventas certificadas.
- 'ESCALA DEL CLIENTE: dado el volumen (137 campos entre performance e insights, ~67-83 mil filas por vista),
  este Data Map V1 se construyó apoyándose principalmente en los nombres de campo y las reglas generales del
  prompt para los 59 criterios binarios de performance, sin verificar cada uno campo por campo como en los
  clientes más chicos (sí se verificaron: tipo_mencion, motivo_principal, resultado_comercial, sentimiento,
  region, pos_code y los 18 campos de escala — ver metadata.scale_disclaimer, actualizado 2026-09-07).'
- 'Los triggers de cumplimiento t01-t15 tienen NULL/N/A residuales pese a que el prompt vigente no permite N/A
  en esos campos -no se investigó la causa (posible residuo de versiones anteriores del prompt, hubo 19
  revisiones previas a la v20 vigente)-.'
- El mapa no responde organización, conectividad, gamificación, roleplays ni dominios de otros clientes.
