metadata:
  name: VI Data Map Tigo V2
  version: 2.0.0
  client: Tigo
  model_target: Gemini 3.7
  generated_at: '2026-09-07'
  scope: Sólo seis vistas dashboard_v2 de Tigo. El tenant ('Tigo') es fijo para este cliente; no se resuelve
    dinámicamente.
  source_of_truth:
    checklist_prompt: clientes/Tigo/Asesor/checklist (Langfuse, label production, v20 al construir este mapa)
    insights_prompt: clientes/Tigo/Asesor/insights (Langfuse, label production, v13 al construir este mapa)
    note: 'Tigo es un operador de telecomunicaciones (Colombia, según el propio prompt de insights), no un
      retail de indumentaria como el resto de los clientes de este batch. Es también, con enorme diferencia,
      el más grande y complejo: ~67-83 mil filas por vista (vs cientos/miles en el resto) y un checklist de
      59 criterios binarios (a01-a59, sin a55) más 15 triggers críticos de cumplimiento/ética (t01-t15),
      contra 12-27 campos en los demás clientes. El dominio tampoco es mayormente "venta": el trámite
      principal más frecuente es factura (15.701 casos), seguido de cancelación/retiro (9.210) y PQR/reclamo
      (7.456) — Tigo es ante todo una operación de servicio/atención y retención, con venta como uno más de
      varios flujos (venta_movil=3.086, venta_hogar=869).'
  changes_from_v1: 'V2 (auditoría de ronda 2, 2026-09-08): no cambia ninguna regla de
    sql_rules/decision_flow ni ningún comportamiento del agente -es una ronda de auditoría
    de calidad de datos, no un fix de comportamiento-. Confirma con SQL directo la causa
    raíz de los 16.078 conversation_id NULL en performance (antes sin confirmar en
    known_findings_v1: grabaciones que nunca completaron el análisis, mismo patrón
    encontrado independientemente en Huerpel Ventas esta misma ronda) y documenta un
    hallazgo nuevo de enum overflow en categoria_producto_servicio (21 valores reales no
    configurados en el prompt, ~700 filas). Se re-corrió el banco dorado completo (15/15,
    sin fallback, incluidas las 4 preguntas trampa) contra el agente vigente: ningún
    hallazgo de esta ronda afecta ninguna pregunta existente (q01 ya excluye las filas sin
    análisis vía usefulforanalysis IS TRUE; q14 usa un TOP 6 que no llega a los valores
    fuera de enum). Ver known_findings_v2.'
  scale_disclaimer: 'DADO EL VOLUMEN DE CAMPOS (59+15 en performance, 18+7 en categorical_insights, más los de
    producto), las descripciones de la mayoría de los 59 campos "a" de performance se derivan de sus NOMBRES
    -muy descriptivos por diseño- y de las reglas generales del prompt, no de prosa verificada campo por
    campo como en los clientes más chicos. ACTUALIZADO 2026-09-07: los 6 campos que habían quedado sin
    verificar (tipo_mencion, motivo_principal, resultado_comercial, sentimiento, region, pos_code) y los 18
    campos de escala 1-5 de calidad_del_asesor ya se verificaron contra Postgres y tienen enums/promedios
    reales -ver sources.categorical_product_insights, sources.demography y
    sources.categorical_insights.calidad_del_asesor_escala-. Lo que sigue sin verificar campo por campo son
    los 59 criterios binarios de performance (fuera de los que ya se muestrearon: a01, a25, a30, a42).'
  known_findings_v2:
  - 'CAUSA RAÍZ CONFIRMADA DE LOS 16.078 conversation_id NULL EN PERFORMANCE (auditoría de
      ronda 2, 2026-09-08): known_findings_v1 ya documentaba NULL residuales en los campos t
      (ej. 15.763 simultáneos) y especulaba, sin confirmar, que podían corresponder a
      "conversaciones no analizables". Verificado ahora con SQL directo: performance tiene
      85.572 filas pero sólo 69.494 tienen conversation_id poblado (69.494 = exactamente el
      total de filas de demografia/categorical_insights/descriptive_insights, que sólo
      incluyen conversaciones que completaron el análisis). Las 16.078 filas restantes de
      performance tienen conversation_id IS NULL de forma directa (no es un problema de join
      ni de integridad referencial: 0 filas de performance con conversation_id poblado
      carecen de contraparte en demografia), y el 100% de ellas tiene
      estado_analisis=''No analizable'' con usefulforanalysis NULL (no false) -son grabaciones
      que llegaron al pipeline pero nunca completaron el análisis que asigna
      conversation_id-. Esto explica también por qué los campos t (que nunca admiten N/A por
      diseño del prompt) aparecen en NULL para exactamente estas mismas filas
      (t01_null_count=16.110, de las cuales 16.078 coinciden con conversation_id NULL): no es
      un residuo de versiones anteriores del prompt como especulaba known_findings_v1, es que
      el checklist directamente nunca corrió sobre esas grabaciones. MISMO PATRÓN encontrado
      independientemente esta misma ronda en Huerpel Ventas (235 filas de performance con
      conversation_id NULL, idéntica correlación con estado_analisis=''No analizable'' +
      usefulforanalysis NULL) -sugiere comportamiento del pipeline compartido entre clientes,
      no una particularidad de Tigo-. No corregido en código compartido (fuera de alcance).
      Reclasificado de "no confirmado/punto abierto" a "DOCUMENTADO, causa raíz confirmada, no
      requiere fix de Data Map ni cambio de sql_rules" -las reglas ya vigentes (excluir NULL
      de la base evaluada en performance_rate) ya manejan esto correctamente, no hay ningún
      hallazgo del banco dorado afectado (q01 filtra usefulforanalysis IS TRUE, que excluye
      naturalmente estas filas).'
  - 'ENUM OVERFLOW REAL EN categoria_producto_servicio (categorical_product_insights) — QUEDA
      ABIERTO, no corregible desde el Data Map: el campo tiene 10 valores configurados
      ([planes, hogar_fijo, movil, devices, add_ons, devices_en_cuotas, otro, servicios_hogar,
      servicios_moviles, n/a]) pero Postgres tiene 30 valores distintos en producción.
      Verificado 2026-09-08: además de los 10 configurados, aparecen 21 valores no
      documentados por el prompt -algunos parecen variantes singular/plural del mismo
      concepto (device=198 vs devices=5.462; add_on=9 vs add_ons=2.140), otros son nombres de
      producto/servicio específicos que deberían vivir en producto_servicio, no en la
      categoría (full_tigo=134, hbo=53, full_equipo=45, otra_app=43, win=39, disney=15,
      max=3, amazon=2, paramount=1, honor_400=27, motorola_g47=15, motorola_g56=3,
      full_equipo_plus=1), y varios son combinaciones de servicios de hogar fuera del enum
      (fijo_tv_ba_telefonia=35, fijo_ba=30, fijo_tv_ba=30, fijo_telefonia=15,
      fijo_ba_telefonia=9, fijo_tv_telefonia=4). Volumen combinado ~700 filas (1,7% de las
      41.200 filas de la vista) -no distorsiona un TOP 6 (q14_categoria_producto_distribucion
      del banco dorado usa LIMIT 6 y ninguno de estos valores entra en el top), pero SÍ
      distorsiona cualquier pregunta que pida "todas las categorías" o "cuántas categorías
      distintas existen". Mismo patrón de overflow de enum ya documentado para
      respuestaantefaltadeproducto en Steren (ver README) -no es un error del Data Map, es
      que la extracción real no respeta estrictamente el enum configurado del prompt.'
  - 'FALSA ALARMA DESCARTADA (documentada para que nadie la repita): en una primera pasada de
      esta auditoría, varios valores de texto con tilde (ej. "Sí", nombres con Á/Ñ/Í en
      employee_full_name) se veían en la terminal como "S�"/caracteres corruptos. Verificado
      con WHERE campo = ''Sí'' (match exacto, 19.698 filas) y con octet_length/length sobre
      employee_full_name (28 bytes / 27 caracteres para un nombre con una sola tilde, +1 byte
      consistente con UTF-8 normal): el dato en Postgres está correctamente codificado en
      UTF-8, la corrupción visual era enteramente un artefacto de la consola/terminal usada
      para inspeccionar, no un problema real de datos. No hay ningún hallazgo de encoding que
      corregir.'
  known_findings_v1:
  - 'VALIDACIÓN DE CONFIABILIDAD (2026-09-07, mismo día del onboarding): Tigo había quedado en grado
      "medio" (ver README.md > convención de nombres de carpeta) no por un hallazgo puntual sino por ser,
      con diferencia, el cliente más grande y complejo del batch (137 campos, ~67-83 mil filas por vista)
      sin trayectoria de uso real todavía. Se corrió el banco completo de 15 preguntas una vez (15/15 sin
      ningún UNSAFE_ANSWER_FALLBACK) y después se repitieron las 4 preguntas trampa
      (`q02_a_series_split_trap`, `q06_nps_induction_trap`, `q08_venta_es_minoria_trap`,
      `q09_causa_retiro_vs_no_retencion_trap`) dos veces más cada una (3 corridas en total por pregunta,
      12 ejecuciones) — mismo patrón de iteración barata usado históricamente con Farma24/Mens Fashion.
      Resultado: 12/12 limpias, sin fallback, con números estables entre corridas (ej. q02 dio 3,31/5,0
      exacto las 3 veces; q08 dio 5,91% / 4.021 de 68.078 exacto en 2 de las 3). No se encontró ninguna
      falla de ejecución. Con esta evidencia, carpeta renombrada de `tigo_medio` a `tigo_alto`
      (2026-09-07) — el volumen/complejidad del cliente sigue siendo real (ver scale_disclaimer, quedan
      59 criterios binarios sin muestrear campo por campo), pero eso ya estaba documentado como
      limitación conocida, no como una falla de confiabilidad, y no amerita por sí solo un grado más
      bajo si la ejecución es consistentemente correcta.'
  - 'ESTRUCTURA CLAVE — LA SERIE "a" ESTÁ PARTIDA ENTRE DOS VISTAS FÍSICAS: el checklist define una única
      numeración a01...a59 (sin a55, excluido explícitamente por el propio prompt: "No debes calcular ni
      devolver el campo a55"), pero Postgres la reparte en dos tablas según el TIPO de campo — los campos
      binarios (Sí/No/N/A, pasos de comportamiento concretos como saludo, indagación, cierre) quedan en
      performance (vw_tigo_rendimiento_vendedor); los campos de ESCALA 1-5 (calidad cualitativa: tono, empatía,
      dominio de proceso) quedan en categorical_insights (vw_tigo_insights_categoricos), bajo la sección del
      propio prompt "Insights_categoricos.calidad_del_asesor". No hay superposición de números entre ambos
      grupos -a01,a02,a06,a07,a10,a12-14,a16-18,a20-25,a27,a28,a30-32,a34,a35,a37,a38,a41,a42,a44,a46-50,a53,
      a54,a56-59 son binarios (performance); a03,a04,a05,a08,a09,a11,a15,a19,a26,a29,a33,a36,a39,a40,a43,a45,
      a51,a52 son escala (categorical_insights)-. No tratar ambos grupos como intercambiables ni buscar un
      campo "a03" en performance, no existe ahí.'
  - 'TRIGGERS DE CUMPLIMIENTO/ÉTICA (t01-t15) SE DISPARAN CON VOLUMEN REAL, NO SON TEÓRICOS: verificado
      2026-09-07 contra Postgres — t01 (solicita dinero/pago no oficial) = 48 casos "Sí"; t02 (condiciona
      atención a compra) = 1.458; t11 (sugiere suplantación de identidad) = 77; t13 (trato grosero/agresivo/
      discriminatorio) = 221; t14 (oculta/tergiversa condiciones críticas) = 1.023. El usuario confirmó
      explícitamente (2026-09-07) que Vera Intelligence SÍ debe poder responder preguntas de negocio sobre
      estos campos -no están restringidos-, tratarlos con el mismo criterio que el resto del checklist. El
      propio prompt exige "privilegiar precisión por encima de recall" en estos triggers (regla 12 del
      checklist): un "Sí" exige evidencia clara y específica, nunca por mera sospecha.'
  - 'REGLA DE POLARIDAD DE LOS TRIGGERS t: a diferencia de los campos "a" (donde "Sí" = cumplió correctamente,
      polaridad positiva), en los campos "t" **"Sí" significa que SÍ ocurrió el incumplimiento/riesgo**
      (polaridad de detección, no de cumplimiento). No leer "Sí" en un trigger t como algo positivo.'
  - 'LOS TRIGGERS t NUNCA ADMITEN N/A por diseño del prompt (regla 6, "Nunca uses N/A en campos que empiezan
      con t") — sólo "Sí"/"No". Sin embargo, se observaron valores N/A y NULL en Postgres para varios campos t
      (t01: 51 N/A + 15.763 NULL sobre 83.197 filas; patrón similar en t02/t11/t13/t14) — probablemente
      residuo de versiones anteriores del prompt (v20 es la vigente, hubo 19 revisiones previas) o filas donde
      el análisis no corrió. No se investigó la causa exacta; tratar cualquier N/A o NULL en un campo t como
      "no evaluado", nunca como "no ocurrió el incumplimiento".'
  - 'Los 15.763 NULL simultáneos en varios campos t sugieren un bloque de filas donde el checklist directamente
      no corrió (¿conversaciones no analizables, ¿usefulForAnalysis=false?). No confirmado; consistente con la
      regla 15 del prompt ("si usefulForAnalysis=false, usa N/A amplio en campos a, pero No en campos t" — lo
      observado no calza exactamente con eso, ya que hay NULL, no "No", en esas filas — punto abierto).'
  - 'Dominio de negocio distinto al resto del batch: el trámite más común es factura (15.701), seguido de
      cancelación/retiro (9.210) y PQR/reclamo (7.456). Venta (móvil+hogar) es sólo 3.955 de 62.836 trámites
      identificados (~6,3%). Cualquier pregunta sobre "ventas" debe aclarar que representa una fracción menor
      del volumen total de atenciones; la mayoría son gestiones de servicio/soporte/retención.'
  - 'a30_retencion_exitosa sólo tiene sentido junto con i09_causa_principal_de_retiro/i07_causa_principal_de_no_retencion
      (categorical_insights) — un intento de retención fallido tiene causa documentada en i07, mientras que
      i09 documenta por qué el cliente quiso irse en primer lugar (pueden coincidir o no, son dos preguntas
      distintas según el propio prompt de insights).'
  - 'RAG no aplica: el checklist no declara geminiFileSearchStoreName.'
decision_flow:
- 'Identificar primero si la pregunta requiere un campo binario de comportamiento (performance, a01-a59
  excepto los de escala) o una calificación cualitativa 1-5 (categorical_insights, ver known_findings_v1 —
  no buscar campos de escala en performance).'
- 'Si la pregunta toca cumplimiento/ética/fraude, usar los campos t01-t15 de performance con su polaridad de
  detección (Sí=ocurrió el incumplimiento), citando el volumen exacto y aclarando que N/A/NULL significa "no
  evaluado", nunca "no ocurrió".'
- Identificar si la pregunta es general de conversación o específica de producto/servicio.
- Resolver profile, grano, tenant y fecha antes de escribir SQL.
- Verificar que cada condición explícita de la pregunta aparezca en SELECT, WHERE, GROUP BY o cálculo.
routing:
  demography:
    questions: resultado de la interacción (compra/no compra), canal previo, uso principal de datos móviles u
      hogar mencionado por el cliente, región, punto de venta
    avoid: no es la fuente de trámite principal, causas de retiro ni calidad cualitativa — eso vive en
      categorical_insights
  performance:
    questions: los 59 criterios binarios del checklist (apertura, validación de identidad, indagación,
      retención, venta cruzada por segmento, cierre, política documental) y los 15 triggers de cumplimiento/
      ética t01-t15
    avoid: no tratar N/A como incumplimiento en campos "a"; no usar N/A en campos "t" (no existe, ver
      known_findings_v1); no buscar campos de calificación 1-5 acá, están en categorical_insights
  categorical_insights:
    questions: trámite principal, causa de retiro/no retención, dolor del cliente, causa de demora, motivo de
      consulta de factura, si induce NPS 5, canal sugerido indebidamente, y las 18 calificaciones cualitativas
      1-5 (tono, empatía, dominio de proceso, etc.)
    avoid: no usar para ejemplos textuales; no confundir i09 (causa de retiro) con i07 (causa de no retención
      tras intento fallido) — son preguntas distintas
  descriptive_insights:
    questions: detalle textual de causa de no retención, de retiro, de dolor del cliente, de demora
    avoid: no agrupar ni calcular frecuencia de texto
  categorical_product_insights:
    questions: producto/servicio mencionado, categoría, tipo de mención, motivo principal, resultado
      comercial, sentimiento del cliente sobre ese producto
    avoid: no afirmar ventas transaccionales sin evidencia
  descriptive_product_insights:
    questions: detalle textual del producto/servicio y de la mención
    avoid: no usar sin la vista categórica para confirmar resultado_comercial
profiles:
  standard_conversation:
    row_key: conversation_id
    tenant_field: seller_id
    date_field: uploaded_at_local
    optional_dimensions: [store_id, store_name, sector_id, sector_name, employee_id, employee_full_name, region, pos_code]
    quality_filter: 'usefulforanalysis IS TRUE cuando la pregunta se refiera a conversaciones analizables. No
      agregar por costumbre si no se pide explícitamente.'
sql_rules:
  scope: Usar únicamente sources[].source. Nunca consultar otra vista, schema o cliente.
  read_only: Un único SELECT o WITH...SELECT; sin interpolar texto del usuario; LIMIT 200 para detalle.
  tenant: Aplicar el valor exacto autorizado de sesión ('Tigo') sobre seller_id en cada fuente.
  time: Filtrar profiles.standard_conversation.date_field sólo cuando el usuario indique un período.
  conversation_population: COUNT(DISTINCT conversation_id).
  product_population: COUNT(DISTINCT (conversation_id, producto_index)).
  performance_rate: 'cumplimientos / base_evaluada; base = conversaciones distintas con valor Sí o No; excluir
    N/A y null. Para campos t, la "base evaluada" es Sí+No (nunca hay N/A por diseño, pero sí NULL residual —
    ver known_findings_v1, excluir también esos NULL).'
  scale_field_rule: 'Para los 18 campos de calidad_del_asesor (escala 1-5 en categorical_insights), reportar
    promedio y/o distribución completa, no una "tasa de cumplimiento" — no son campos binarios.'
  categorical_filters: Usar valores de configured_values respetando snake_case exacto (enums en minúsculas).
  free_text: Seleccionar como evidencia con claves y fecha. Nunca GROUP BY, COUNT o ranking por texto narrativo.
semantic_dependencies:
  a_series_split: 'Ver known_findings_v1: la numeración a01-a59 está partida físicamente entre performance
    (binarios) y categorical_insights (escala 1-5) según el tipo de campo. No buscar un número de campo "a"
    en la fuente equivocada.'
  t_series_polarity: 'Ver known_findings_v1: en los campos t01-t15, "Sí" significa que el incumplimiento SÍ
    ocurrió (polaridad de detección), al revés que los campos "a" donde "Sí" es cumplimiento positivo.'
  retencion_causas: 'i09_causa_principal_de_retiro (por qué el cliente quiere irse) e
    i07_causa_principal_de_no_retencion (por qué el intento de retención no funcionó) comparten el mismo
    enum pero responden preguntas distintas y pueden no coincidir -ej. el cliente puede querer irse por
    factura_alta (i09) pero rechazar la retención específicamente por precio (i07) si la oferta no bajó lo
    suficiente-.'
  nps_induction: 'i05_induce_calificacion_nps_5 detecta si el asesor presiona/induce al cliente a calificar 5
    -es un hallazgo de integridad de la métrica NPS, no un logro comercial positivo-.'
joins:
  general_evidence:
    left: categorical_insights
    right: descriptive_insights
    keys: [conversation_id]
    cardinality: conversation_to_conversation
  product_evidence:
    left: categorical_product_insights
    right: descriptive_product_insights
    keys: [conversation_id, producto_index]
    cardinality: product_to_product
  rule: No usar CROSS JOIN para asociar evidencia. Si falta una clave, no atribuir el texto al grupo categórico.
sources:
  demography:
    source: dashboard_v2.vw_tigo_demografia
    use_when: Resultado de la interacción, canal previo, uso principal de datos móviles/internet hogar
      mencionado por el cliente.
    grain: Una fila por conversación.
    profile: standard_conversation
    fields:
      tipointeraccion:
        configured_values: ['compra', 'no compra']
        observed_values: ['compra', 'no compra']
        type: text
        nullable: true
        description: 'compra si al menos un producto/servicio se vincula con evidencia de compra; no compra
          en cualquier otro caso (no admite N/A, ver regla del insights). OJO: valores con espacio ("no
          compra"), no snake_case, distinto del patrón de otros clientes del proyecto. Verificado: no
          compra=58025, compra=8811 (2 NULL).'
        operations: [filter, group, compare]
      i08_canal_previo_principal:
        configured_values: [cc, chat, app, otro, n/a]
        observed_values: [cc, chat, app, otro, n/a]
        type: text
        nullable: true
        description: Canal previo mencionado por el cliente antes de esta atención (call center, chat/WhatsApp,
          app Mi Tigo, u otro). n/a si no se menciona ninguno.
        operations: [filter, group, compare]
      i11_uso_principal_de_datos_moviles_mencionado_por_cliente:
        configured_values: [redes_sociales, mensajeria, streaming_video, streaming_musica, videojuegos, trabajo_estudio, videollamadas, navegacion_general, otro, n/a]
        observed_values: [redes_sociales, mensajeria, streaming_video, streaming_musica, videojuegos, trabajo_estudio, videollamadas, navegacion_general, otro, n/a]
        type: text
        nullable: true
        description: Uso principal de datos móviles que el CLIENTE menciona (no inferido). Si menciona varios,
          se elige el más relevante para la decisión comercial.
        operations: [filter, group, compare]
      i12_uso_principal_de_internet_hogar_mencionado_por_cliente:
        configured_values: [streaming_video, videojuegos, trabajo_estudio, videollamadas, redes_sociales, hogar_conectado, navegacion_general, otro, n/a]
        observed_values: [streaming_video, videojuegos, trabajo_estudio, videollamadas, redes_sociales, hogar_conectado, navegacion_general, otro, n/a]
        type: text
        nullable: true
        description: Uso principal de internet hogar que el CLIENTE menciona (no inferido).
        operations: [filter, group, compare]
      region:
        configured_values: [COSTA, BOGOTA, ANDINA, SUR, ORIENTE]
        observed_values: [COSTA, BOGOTA, ANDINA, SUR, ORIENTE]
        type: text
        nullable: true
        description: 'Región geográfica de la atención (5 valores, mayúsculas). Verificado 2026-09-07:
          COSTA=20.052, BOGOTA=15.734, ANDINA=14.760, SUR=13.121, ORIENTE=3.799.'
        operations: [filter, group]
      pos_code:
        type: text
        nullable: true
        description: 'Código numérico de punto de venta (texto, no enum cerrado — decenas de valores distintos,
          ej. "3000032", "2000625"). Verificado que existe y tiene valores reales; no se listó el catálogo
          completo de puntos de venta en esta ronda.'
        operations: [filter, group]
  performance:
    source: dashboard_v2.vw_tigo_rendimiento_vendedor
    use_when: Los 59 criterios binarios del checklist (a01-a59, sin a55, sin los de escala — ver
      known_findings_v1) y los 15 triggers de cumplimiento/ética (t01-t15).
    grain: Una fila por conversación con 74 columnas de criterios (59 "a" binarios + 15 "t" críticos).
    profile: standard_conversation
    decision_semantics: 'Campos "a": "Sí" = ocurrió con evidencia suficiente; "No" = la etapa aplicaba y el
      asesor no lo hizo o hizo lo contrario; "N/A" = la etapa no aplicaba a este flujo/producto/momento, o no
      quedó capturada. Campos "t" (triggers críticos): SÓLO "Sí" o "No", nunca N/A por diseño; "Sí" significa
      que el incumplimiento/riesgo SÍ ocurrió (polaridad de detección, ver semantic_dependencies.t_series_polarity)
      — el prompt exige privilegiar precisión sobre recall en estos triggers.'
    fields_a_apertura_y_validacion:
