metadata:
  name: VI Data Map Roberts V2
  version: 2.0.0
  client: Roberts
  model_target: Gemini 3.7
  generated_at: '2026-09-07'
  scope: Sólo seis vistas dashboard_v2 de Roberts. El tenant ('Roberts') es fijo para este prototipo de un solo
    cliente; no se resuelve dinámicamente.
  source_of_truth:
    checklist_prompt: clientes/Haber/Roberts/checklist (Langfuse, label production, v8 al construir este mapa)
    insights_prompt: clientes/Haber/Roberts/insights (Langfuse, label production, v5 al construir este mapa)
    note: 'IMPORTANTE: el texto de ambos prompts de Roberts es character-por-character IDÉNTICO a los de Mens
      Fashion (clientes/Haber/Mens Fashion/checklist v10, clientes/Haber/Mens Fashion/insights v7) — tan literal
      que el checklist de Roberts todavía dice "Actúa como auditor del protocolo de venta de Men''s Fashion" en
      su rol y contexto, nunca se adaptó el texto a la marca. Confirmado explícitamente por el cliente de negocio
      que Roberts opera con el mismo protocolo/rubric que Mens Fashion (no es un error de configuración). Por
      eso este Data Map reutiliza la estructura completa de campos, enums y semántica de VI Data Map Mens
      Fashion V6 -mismos nombres de campo, misma lógica Sí/No/N-A-, pero NINGÚN número (tasas, % de coincidencia,
      NULL, hallazgos de calidad de datos) se copió de Mens Fashion: cada cifra de este mapa fue re-verificada
      contra Postgres QA de Roberts de forma independiente el 2026-09-07, porque son específicas del dataset de
      cada cliente aunque el prompt sea el mismo.'
  known_findings_v1:
  - 'PERFORMANCE.vendedordestacaventajasconfeccionmedida — mismo hallazgo grave que Mens Fashion V3, verificado
      con números propios de Roberts: el checklist exige que este campo sea N/A siempre que
      vendedormencionoconfeccionamedida sea N/A. Verificado contra Postgres: de 3.770 filas con
      vendedormencionoconfeccionamedida=N/A, 2.087 (55,4%) tienen este campo en ''No'' en vez de ''N/A'' (sólo
      1.679 sí quedaron N/A, 4 quedaron incorrectamente en ''Sí''). Menos grave que el 71% medido en Mens
      Fashion pero el mismo patrón real: un conteo crudo de "No" en este campo sobrestima el incumplimiento
      real. Marcado reliability_warning en el campo.'
  - 'semantic_dependencies dual-source (mismo patrón que Mens Fashion V5/V6, verificado con datos propios de
      Roberts): los tres pares checklist/categorical_insights que miden lo mismo desde dos fuentes independientes
      NO coinciden siempre. Tasas de coincidencia medidas en Roberts (excluyendo la combinación N-A/false, no
      informativa, mismo criterio que Mens Fashion): ocasion_uso 87,1% (6.790/7.796), confeccion_medida 77,9%
      (5.316/6.824), complementarios 83,6% (5.830/6.971). Regla: usar siempre el campo de categorical_insights
      como fuente primaria para preguntas de negocio, nunca cruzar ambos como si fueran la misma medición.'
  - 'categorical_insights.data_quality_note: 852 filas huérfanas sobre 11.098 (7,7%) con conversation_id que no
      cruza contra ninguna fila de performance/demography (verificado: 11.098 total vs 10.246 conversation_id
      distintos). Mismo fenómeno que Mens Fashion (ahí era ~9,6%). SIEMPRE usar COUNT(DISTINCT conversation_id),
      nunca COUNT(*).'
  - 'categorical_insights cashback cluster: ~82,9% NULL (1.902 de 11.098 filas con primer_mencion_cashback no
      nulo) — muy similar al ~85% de Mens Fashion. NO evaluado en la mayoría de las conversaciones; NULL no
      equivale a no_mencionado/false.'
  - 'motivador_visita taxonomy_drift: mismo fenómeno que Mens Fashion -dos generaciones de enum conviven en
      Postgres-, pero con más peso relativo en Roberts: la taxonomía vieja (aparador=69, ecommerce=16,
      promocion=408, recomendacion=4, redes_sociales=2, referencia_externa=1, necesidad_especifica=2.039) suma
      2.539 filas, con necesidad_especifica siendo el segundo valor más frecuente de TODO el campo (2.039 filas,
      más que casi cualquier valor de la taxonomía vigente salvo no_claro). Preferir configured_values (taxonomía
      vigente) para preguntas del período reciente; incluir ambos conjuntos para preguntas históricas/agregadas.'
  - 'performance.vendedorexplicoprogramadelealtad / vendedormencionoprogramadelealtad: igual que en Mens Fashion,
      son campos legado (81,3% de filas pobladas, 8.360/10.285) que NO forman parte del checklist v8 vigente de
      Roberts (que sólo pide vendedorinformocashback20porciento, poblado en 18,5%/1.902 filas). Verificado que
      NUNCA se solapan en la misma fila (0 filas con ambos clusters poblados a la vez) y que el cashback empieza
      a aparecer recién desde 2026-08-24 -consistente con que es el criterio del checklist copiado de Mens
      Fashion, adoptado más tarde que el criterio legado de "programa de lealtad"-. Marcados legacy: true.'
  - 'objecion_principal (por producto): marca y comparacion_competencia son valores válidos pero muy raros (3 y 6
      filas de 8.700+ no-nulas). disparador_de_cierre: calidad_producto y urgencia también raros (35 y 15 filas).
      Mismo patrón que Mens Fashion, confirmado con conteos propios de Roberts.'
  known_findings_v2:
  - '[CORREGIDO] categorical_insights: 12 campos (hubo_mencion_competencia, hubo_mencion_a_medida,
      hubo_ofrecimiento_a_medida, hubo_ofrecimiento_complementarios, hubo_ofrecimiento_paquete,
      atencion_pasiva_vendedor, falta_cierre_vendedor, no_ofrece_solucion_completa, hubo_venta_perdida,
      motivo_principal_venta_perdida, cantidad_productos_mencionados, cantidad_productos_comprados)
      estaban mal declarados nullable=false. Verificado contra Postgres (2026-09-08): 870 de 11.142 filas
      tienen los 12 campos NULL simultáneamente. De esas, 847 son las filas huérfanas ya documentadas en
      V1 (conversation_id literalmente NULL en esta vista, no sólo "no cruza" como decía la nota de V1 —
      matiz corregido también en data_quality_note). Las 23 filas restantes SÍ tienen conversation_id
      poblado y existen en demography, pero tienen los 12 campos NULL igual — root cause identificado
      (ver hallazgo siguiente): fueron procesadas con un prompt equivocado. Corregido nullable a true en
      los 12 campos de V2.'
  - '[CORREGIDO/DOCUMENTADO] Root cause de filas rotas — prompt_id equivocado: la vista performance
      expone una columna prompt_id no documentada en V1. Verificado contra Langfuse (2026-09-08): el
      promptId real de "clientes/Haber/Roberts/checklist" es 4rvKMB6F30H5YY8QJ3U8 (estable en las 8
      versiones, v1 a v8). En Postgres aparecen 3 promptId adicionales: (a) O7fesqEq1wN5oQXSOEcT en 23
      filas de performance (2026-08-09 a 2026-08-31) — identificado: es el promptId de un prompt
      COMPLETAMENTE DISTINTO en Langfuse, "Managers General/checklist" (JSON de otro cliente/dominio, no
      Roberts) — explica exactamente las 23 filas de categorical_insights con todos los campos NULL del
      hallazgo anterior (verificado por JOIN: mismas 23 conversation_id en ambas vistas). Esas 23
      conversaciones deben excluirse de cualquier cálculo de tasas de performance/categorical_insights, no
      sólo tratarse como NULL genérico. (b) gWch0Ghibd0U86LOTcsN en 1.928 filas (2026-08-24 a 2026-09-07,
      actividad RECIENTE y significativa, ~19% del total) y (c) tOVoJnG2B71jCHFcgQnp en 101 filas
      (2026-09-07 a 2026-09-08) — NINGUNO de estos dos promptId matchea ningún prompt existente en
      Langfuse (se revisaron las 88 entradas del proyecto). QUEDA ABIERTO: no se pudo identificar su
      origen (¿prompt borrado de Langfuse? ¿versión intermedia no versionada?) — a diferencia del caso (a),
      estas filas SÍ tienen valores Sí/No/N/A poblados y con distribución plausible, por lo que no hay
      evidencia de que su contenido esté mal, sólo que su prompt_id no se puede verificar contra la fuente
      de verdad vigente. Documentado como semantic_dependencies.prompt_id_no_verificado. Mismo patrón que
      el prompt_id no identificado de Huerpel Ventas (57 filas), pero de mayor volumen relativo (~20% de
      Roberts).'
  - '[DOCUMENTADO, no requiere fix] tipointeraccion.demography vs tipo_interaccion.categorical_insights:
      ambas usan el mismo enum válido (cambio/compra/no_compra/queja) sin variantes de casing detectadas
      -verificado explícitamente en esta ronda, no había sido chequeado en V1-.'
  - '[VERIFICACIÓN POSITIVA, sin hallazgo] No se detectó casing duplicado en producto (categorical_product_insights,
      enum cerrado ya normalizado) ni en store_name/store_id (demography) -verificado con GROUP BY
      LOWER(TRIM(...)) contra Postgres, 0 variantes-.'
decision_flow:
- Identificar si la pregunta es general de conversación o específica de producto.
- Elegir una sola familia primaria según routing; sumar una segunda fuente sólo si la pregunta exige evidencia y existe join
  declarado.
- Resolver profile, grano, tenant y fecha antes de escribir SQL.
- Elegir campos físicos exactos y valores observados; después construir filtros y agregaciones.
- 'Si el campo tiene nullable: true, decidir explícitamente si la pregunta requiere excluir NULL (IS NOT NULL) o si
  NULL es parte legítima de la respuesta (por ejemplo "en cuántas conversaciones no se evaluó cashback").'
- Verificar que cada condición explícita de la pregunta aparezca en SELECT, WHERE, GROUP BY o cálculo.
routing:
  demography:
    questions: quién es el cliente, cómo llega, para quién compra, necesidad, decisión, precio o urgencia
    avoid: no usar para motivos comerciales detallados ni evaluación del vendedor
  performance:
    questions: criterios, cumplimiento, incumplimiento, fortalezas, debilidades, ranking o evolución del vendedor
    avoid: no usar textos narrativos como si fueran criterios; no usar los dos campos legacy de programa de lealtad
      como si fueran parte del checklist vigente
  categorical_insights:
    questions: resultado general, venta perdida, motivador, cashback, competencia, a medida, cierre o cantidades
    avoid: no usar para ejemplos o explicaciones textuales; no filtrar cashback como false/no_mencionado sin antes
      considerar que ~83% de las filas son NULL (cashback no evaluado)
  descriptive_insights:
    questions: por qué, cómo fue la ejecución, ejemplos, errores, mejores prácticas o acciones sugeridas
    avoid: no agrupar ni calcular frecuencia de textos
  categorical_product_insights:
    questions: producto, compra, ocasión, fit, talla, color, objeción, inventario, complementarios o a medida por producto
    avoid: no afirmar ventas transaccionales
  descriptive_product_insights:
    questions: ejemplos y explicaciones narrativas de un producto
    avoid: no usar sin la vista categórica cuando la condición del producto debe comprobarse físicamente
profiles:
  standard_conversation:
    row_key: conversation_id
    tenant_field: seller_id
    date_field: uploaded_at_local
    optional_dimensions:
    - store_id
    - store_name
    - sector_id
    - sector_name
    - employee_id
    - employee_full_name
    quality_filter: 'usefulforanalysis IS TRUE cuando la pregunta se refiera a conversaciones analizables. REGLA
      NEGATIVA EXPLICITA (mismo criterio que Mens Fashion V5): si la pregunta NO menciona "analizables" ni pide
      explícitamente excluir conversaciones de baja calidad, NO agregar este filtro por costumbre.'
  descriptive_conversation:
    row_key: conversation_id
    tenant_field: seller
    date_field: date
    optional_dimensions: []
    quality_filter: 'No asumir usefulforanalysis: esta vista no lo expone.'
sql_rules:
  scope: Usar únicamente sources[].source. Nunca consultar otra vista, schema o cliente.
  read_only: Un único SELECT o WITH...SELECT; parámetros psycopg; sin interpolar texto del usuario; LIMIT 200 para detalle.
  tenant: Aplicar el valor exacto autorizado de sesión sobre profiles[profile].tenant_field; no inferirlo del texto de la
    pregunta.
  time: Filtrar profiles[profile].date_field sólo cuando el usuario indique un período. No inventar ventanas temporales.
  conversation_population: COUNT(DISTINCT conversation_id).
  product_population: COUNT(DISTINCT (conversation_id, producto_index)).
  performance_rate: cumplimientos / base_evaluada; base = conversaciones distintas con valor Sí o No; excluir N/A y null.
  categorical_rate_general_rule: La misma convención de performance_rate aplica a cualquier campo categórico booleano
    o Sí/No/N-A del Data Map, no sólo a los criterios de performance.
  categorical_filters: Usar valores de configured_values (no sólo observed_values) respetando tipo, mayúsculas y acentos;
    excluir null/no_aplica de rankings salvo pedido explícito.
  nullable_fields: Para un campo con nullable=true, decidir si NULL debe incluirse, excluirse (IS NOT NULL) o ser el foco
    de la pregunta antes de agregar o filtrar.
  free_text: Seleccionar como evidencia con claves y fecha. Nunca GROUP BY, COUNT o ranking por texto narrativo.
semantic_dependencies:
  lost_sale_general: hubo_venta_perdida IS TRUE habilita motivo_principal_venta_perdida; excluir no_aplica.
  confeccion_medida_dual_source: 'vendedormencionoconfeccionamedida (performance, checklist, Sí/No/N-A) y
    hubo_mencion_a_medida (categorical_insights, boolean) son DOS MEDICIONES INDEPENDIENTES. Verificado contra
    Postgres QA de Roberts (cruce por conversation_id, excluyendo la combinación N-A/false por no informativa):
    coinciden el 77,9% de las veces (Sí/true=2.453, No/false=2.863; discrepan No/true=1.077, N-A/true=362,
    Sí/false=69). REGLA: usar SIEMPRE hubo_mencion_a_medida (categorical_insights) como fuente primaria para
    preguntas de negocio; vendedormencionoconfeccionamedida es la evaluación del checklist, una lectura distinta,
    no intercambiable.'
  ofrecimiento_complementarios_dual_source: 'vendedorsugiriocomplementos (performance, checklist, Sí/No/N-A) y
    hubo_ofrecimiento_complementarios (categorical_insights, boolean) son DOS MEDICIONES INDEPENDIENTES.
    Verificado contra Postgres QA de Roberts: coinciden el 83,6% de las veces (Sí/true=2.535, No/false=3.295;
    discrepan No/true=837, Sí/false=236, N-A/true=68). REGLA: usar SIEMPRE hubo_ofrecimiento_complementarios
    (categorical_insights) como fuente primaria; vendedorsugiriocomplementos no es intercambiable.'
  ocasion_uso_dual_source: 'hubo_pregunta_ocasion_de_uso (categorical_insights, boolean) y vendedorpreguntaocasionuso
    (performance, checklist, enum Sí/No/N-A) son DOS MEDICIONES INDEPENDIENTES de si el vendedor preguntó la
    ocasión de uso -no son la misma columna con dos nombres, ni intercambiables-. Verificado contra Postgres QA
    de Roberts (cruce por conversation_id, excluyendo N-A/false): coinciden en el 87,1% de los casos
    (No/false=4.208, Sí/true=2.582); discrepan en el resto (Sí/false=446, No/true=445, N-A/true=115). Coincidencia
    más alta que en Mens Fashion (~72,5%) -mismo patrón cualitativo, magnitud distinta, verificada de forma
    independiente-. REGLA: usar SIEMPRE hubo_pregunta_ocasion_de_uso (categorical_insights) como fuente primaria;
    si se necesita la versión del checklist, usar vendedorpreguntaocasionuso explícitamente y aclarar que es una
    lectura distinta.'
  lost_sale_product: resultado_producto = 'no_comprado' habilita motivo_venta_perdida_producto.
  bought_product: Para compra por producto preferir se_compro IS TRUE y mostrar resultado_producto para auditar consistencia.
  objection_handling: objecion_principal identifica la objeción; hubo_manejo_objecion habilita resultado_manejo_objecion.
  made_to_measure: hubo_ofrecimiento_a_medida habilita resultado_a_medida; excluir no_aplica al medir efectividad.
  cashback: 'Antes de leer primer_mencion_cashback o conducta_vendedor_cashback, filtrar por IS NOT NULL: en
    ~83% de las filas el cashback no fue evaluado (no es lo mismo NULL que no_mencionado/false). Una conjunción
    sobre llegada y primera mención exige cliente_llega_con_cashback_para_usar IS TRUE y primer_mencion_cashback
    con el valor pedido. Si además se cruza con performance.vendedorinformocashback20porciento (ver
    joins.cashback_cross_check), declarar explícitamente si la tasa resultante incluye o excluye las filas de
    performance con valor NULL: pueden dar números muy distintos según la convención elegida. No reportar una
    sola cifra sin decir cuál convención se usó.'
  inventory: solucion_ante_falta describe la respuesta; una brecha textual requiere descriptive_product_insights unido por
    conversation_id + producto_index.
  cascada_a_medida_no_confiable: 'vendedordestacaventajasconfeccionmedida = ''No'' NO es un conteo confiable de
    incumplimiento real: ver fields.performance.vendedordestacaventajasconfeccionmedida.reliability_warning.
    Antes de responder cuántas veces "no se destacaron ventajas" (o calcular una tasa con este campo), advertir
    que el indicador está inflado por una cascada semántica que la extracción no respeta de forma consistente
    (medido en Roberts: 55,4% de violación).'
  legacy_performance_fields: vendedorexplicoprogramadelealtad y vendedormencionoprogramadelealtad no están en el
    checklist v8 vigente de Roberts. Sólo usarlos si el usuario pregunta explícitamente por "programa de lealtad"
    o pide una lectura histórica; aclarar en la respuesta que es un criterio legado, no evaluado por el checklist
    actual.
  motivador_visita_taxonomy: antes de filtrar por un valor puntual, considerar que hay dos generaciones de
    taxonomía (ver fields.motivador_visita.taxonomy_drift). En Roberts la taxonomía vieja tiene peso relativo
    alto (necesidad_especifica=2.039 filas). Si la pregunta es sobre el período reciente, preferir los valores de
    configured_values (taxonomía vigente); si es histórica o agregada, puede requerir ambos conjuntos.
joins:
  general_evidence:
    left: categorical_insights
    right: descriptive_insights
    keys:
    - conversation_id
    cardinality: conversation_to_conversation
  product_evidence:
    left: categorical_product_insights
    right: descriptive_product_insights
    keys:
    - conversation_id
    - producto_index
    cardinality: product_to_product
  cashback_cross_check:
    left: categorical_insights
    right: performance
    keys:
    - conversation_id
    cardinality: conversation_to_conversation
    note: 'Cruza "mencionó cashback" (categorical_insights.primer_mencion_cashback/conducta_vendedor_cashback) con
      "informó la mecánica completa" (performance.vendedorinformocashback20porciento) — son criterios distintos con
      distinta severidad, no intercambiables. Ver semantic_dependencies.cashback sobre cómo tratar los NULL de
      performance en este cruce antes de calcular una tasa.'
  rule: No usar CROSS JOIN para asociar evidencia. Si falta una clave, no atribuir el texto al grupo categórico.
sources:
  demography:
    source: dashboard_v2.vw_roberts_demografia
    use_when: 'Características de las conversaciones y clientes: interacción, género, destinatario, tipo, necesidad, decisión,
      precio y urgencia.'
    grain: Una fila por conversación.
    profile: standard_conversation
    fields:
      tipointeraccion:
        configured_values: &tipointeraccion_generico
        - cambio
        - compra
        - no_compra
        - queja
        observed_values: *tipointeraccion_generico
        type: text
        nullable: true
        description: 'Resultado operativo de la interacción según el insights: compra, no_compra, cambio o queja.
          Es la copia de tipo_interaccion en esta vista (misma fuente, mismo campo). Verificado 23 filas NULL sobre
          10.285 en demography (a diferencia del reporte NOT NULL de Mens Fashion, en Roberts sí aparecen algunos
          NULL — declarado nullable=true en consecuencia).'
        operations:
        - filter
        - group
        - compare
      genero_cliente:
        configured_values: &genero_cliente
        - femenino
        - masculino
        - no_claro
        observed_values: *genero_cliente
        type: text
        nullable: true
        description: 'Género del cliente. Sólo masculino/femenino con evidencia razonable (nunca por estereotipo
          o tipo de producto); si no hay evidencia clara, no_claro. 23 filas NULL sobre 10.285.'
        operations:
        - filter
        - group
        - compare
      cliente_compra_para:
        configured_values: &cliente_compra_para
        - no_claro
        - regalo
        - si_mismo
        - tercero
        observed_values: *cliente_compra_para
        type: text
        nullable: true
        description: 'Destinatario de la compra: si_mismo (el propio cliente), regalo (obsequio explícito), tercero
          (uso funcional de otra persona sin ser regalo), o no_claro si la evidencia es insuficiente o contradictoria.
          23 filas NULL.'
        operations:
        - filter
        - group
        - compare
      tipo_cliente:
        configured_values: &tipo_cliente
        - no_claro
        - nuevo
        - recurrente
        observed_values: *tipo_cliente
        type: text
        nullable: true
        description: 'nuevo = primera visita o poca familiaridad; recurrente = hay evidencia de compras previas o
          trato habitual; no_claro si la evidencia es insuficiente. 23 filas NULL.'
        operations:
        - filter
        - group
        - compare
      perfil_necesidad:
        configured_values: &perfil_necesidad
        - casual
        - evento
        - exploracion
        - no_claro
        - reposicion
        - trabajo
        observed_values: *perfil_necesidad
        type: text
        nullable: true
        description: 'Necesidad dominante que organiza la visita: evento, trabajo, casual, reposicion (reemplazar/renovar
          algo conocido), exploracion (búsqueda abierta sin necesidad definida), o no_claro si no es sostenible. 23
          filas NULL.'
        operations:
        - filter
        - group
        - compare
      nivel_decision_cliente:
        configured_values: &nivel_decision_cliente
        - comparando
        - decidido
        - indeciso
        - no_claro
        observed_values: *nivel_decision_cliente
        type: text
        nullable: true
        description: 'decidido = decisión fuerte o muy encaminada; comparando = evalúa opciones activamente (no implica
          indecisión); indeciso = duda sin avanzar con claridad; no_claro si la evidencia es insuficiente. 23 filas
          NULL.'
        operations:
        - filter
        - group
        - compare
      sensibilidad_precio_general:
        configured_values: &sensibilidad_precio_general
        - alta
        - baja
        - media
        - no_claro
        observed_values: *sensibilidad_precio_general
        type: text
        nullable: true
        description: Nivel de sensibilidad del cliente frente al precio en la conversación completa. 23 filas NULL
          sobre 10.285.
        operations:
        - filter
        - group
        - compare
      urgencia_general:
        configured_values: &urgencia_general
        - inmediata
        - no_claro
        - planeada
        observed_values: *urgencia_general
        type: text
        nullable: true
        description: Urgencia temporal general de la necesidad del cliente. 23 filas NULL sobre 10.285.
        operations:
        - filter
        - group
        - compare
  performance:
    source: dashboard_v2.vw_roberts_rendimiento_vendedor
    use_when: Criterios estructurados de desempeño del vendedor (checklist Sí/No/N/A), auditados por etapa de la
      atención (recepción, investigación, asesoría, complementos, manejo de objeciones, cierre, conocimiento del
      producto).
    grain: Una fila por conversación con múltiples columnas de criterios.
    profile: standard_conversation
    decision_semantics: Todos los campos de esta vista (salvo los marcados legacy) admiten únicamente Sí, No o N/A,
      con la misma lógica de desempate en las 27 columnas -> "Sí" = el vendedor tuvo una oportunidad real y hay
      evidencia clara de que cumplió; "No" = tuvo una oportunidad real y suficiente pero no cumplió o cumplió de
      forma insuficiente; "N/A" = no tuvo una oportunidad real (faltó la etapa/el disparador, el cliente resolvió
