        - true
        nullable: true  # V2: corregido, ver known_findings_v2 (23 filas con conversation_id valido pero campo NULL por prompt_id equivocado)
        description: true si cliente o vendedor mencionan interés, posibilidad o necesidad de confección a medida/
          sastrería. Una mención no implica que haya sido ofrecida (ver hubo_ofrecimiento_a_medida). Ver
          semantic_dependencies.confeccion_medida_dual_source.
        operations:
        - filter
        - group
        - compare
      hubo_ofrecimiento_a_medida:
        type: boolean
        configured_values:
        - false
        - true
        observed_values:
        - false
        - true
        nullable: true  # V2: corregido, ver known_findings_v2 (23 filas con conversation_id valido pero campo NULL por prompt_id equivocado)
        description: true sólo si el vendedor propone activamente la confección a medida/sastrería como opción o
          solución (no basta con que se haya mencionado el tema).
        operations:
        - filter
        - group
        - compare
      hubo_ofrecimiento_complementarios:
        type: boolean
        configured_values:
        - false
        - true
        observed_values:
        - false
        - true
        nullable: true  # V2: corregido, ver known_findings_v2 (23 filas con conversation_id valido pero campo NULL por prompt_id equivocado)
        description: true si el vendedor propone al menos un producto adicional comercialmente relacionado con el
          principal. Ver semantic_dependencies.ofrecimiento_complementarios_dual_source.
        operations:
        - filter
        - group
        - compare
      hubo_ofrecimiento_paquete:
        type: boolean
        configured_values:
        - false
        - true
        observed_values:
        - false
        - true
        nullable: true  # V2: corregido, ver known_findings_v2 (23 filas con conversation_id valido pero campo NULL por prompt_id equivocado)
        description: true si el vendedor arma o intenta armar una solución integral con múltiples prendas/accesorios.
          Un adicional aislado no constituye necesariamente un paquete.
        operations:
        - filter
        - group
        - compare
      hubo_pregunta_ocasion_de_uso:
        type: boolean
        configured_values:
        - false
        - true
        observed_values:
        - false
        - true
        nullable: true
        description: 'true sólo si el vendedor pregunta o explora para qué necesita el producto el cliente. Una
          ocasión aportada únicamente por el cliente no cuenta. VER semantic_dependencies.ocasion_uso_dual_source:
          este es el campo PRIMARIO para preguntas de negocio sobre esto -NO es intercambiable con
          vendedorpreguntaocasionuso de performance, coinciden 87,1% de las veces-.'
        operations:
        - filter
        - group
        - compare
      atencion_pasiva_vendedor:
        type: boolean
        configured_values:
        - false
        - true
        observed_values:
        - false
        - true
        nullable: true  # V2: corregido, ver known_findings_v2 (23 filas con conversation_id valido pero campo NULL por prompt_id equivocado)
        description: true si el vendedor es mayormente reactivo, responde lo mínimo y muestra poca iniciativa; false
          si explora, propone y mueve la conversación. No se marca true por un momento aislado si el desempeño
          global fue proactivo.
        operations:
        - filter
        - group
        - compare
      falta_cierre_vendedor:
        type: boolean
        configured_values:
        - false
        - true
        observed_values:
        - false
        - true
        nullable: true  # V2: corregido, ver known_findings_v2 (23 filas con conversation_id valido pero campo NULL por prompt_id equivocado)
        description: true si, llegado un momento donde correspondía avanzar, el vendedor no intenta obtener una
          decisión, concretar la compra o definir un siguiente paso. No confundir con no_compra.
        operations:
        - filter
        - group
        - compare
      no_ofrece_solucion_completa:
        type: boolean
        configured_values:
        - false
        - true
        observed_values:
        - false
        - true
        nullable: true  # V2: corregido, ver known_findings_v2 (23 filas con conversation_id valido pero campo NULL por prompt_id equivocado)
        description: true si el caso justificaba alternativas, complementarios, paquete, sustitución o a medida y el
          vendedor no construye una solución razonablemente completa.
        operations:
        - filter
        - group
        - compare
      hubo_venta_perdida:
        type: boolean
        configured_values:
        - false
        - true
        observed_values:
        - false
        - true
        nullable: true  # V2: corregido, ver known_findings_v2 (23 filas con conversation_id valido pero campo NULL por prompt_id equivocado)
        description: true si al menos una necesidad o producto comercialmente relevante queda sin resolverse en
          compra. Puede coexistir con resultado_general=compra_parcial. Habilita motivo_principal_venta_perdida.
        operations:
        - filter
        - group
        - compare
      motivo_principal_venta_perdida:
        configured_values: &motivo_perdida_general
        - calidad_valor
        - diseno_estilo
        - ejecucion_vendedor
        - fit
        - inventario
        - no_aplica
        - precio
        - tiempo_entrega
        observed_values: *motivo_perdida_general
        type: text
        nullable: true  # V2: corregido, ver known_findings_v2 (23 filas con conversation_id valido pero campo NULL por prompt_id equivocado)
        description: Causa dominante de la venta perdida; sólo interpretable cuando hubo_venta_perdida=true (si no,
          vale no_aplica).
        operations:
        - filter
        - group
        - compare
      cantidad_productos_mencionados:
        type: integer
        observed_values:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
        - 8
        nullable: true  # V2: corregido, ver known_findings_v2 (23 filas con conversation_id valido pero campo NULL por prompt_id equivocado)
        description: Cantidad de productos comercialmente relevantes mencionados; debe coincidir con la cantidad de
          filas de ese conversation_id en categorical_product_insights.
        operations:
        - filter
        - group
        - aggregate
      cantidad_productos_comprados:
        type: integer
        observed_values:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        nullable: true  # V2: corregido, ver known_findings_v2 (23 filas con conversation_id valido pero campo NULL por prompt_id equivocado)
        description: Cantidad de productos con se_compro=true en categorical_product_insights para esa misma
          conversación.
        operations:
        - filter
        - group
        - aggregate
  descriptive_insights:
    source: dashboard_v2.vw_roberts_insights_descriptivos_generales
    use_when: Explicaciones y evidencia textual general de la conversación.
    grain: Una fila por conversación; texto libre no agregable como categoría.
    profile: descriptive_conversation
    fields:
      resumen_ejecutivo_conversacion:
        type: text
        nullable: true
        description: Resume qué quería el cliente, qué se negoció, qué compró y qué quedó sin resolver.
        operations:
        - select_evidence
      que_quiere_el_cliente_y_que_tenemos:
        type: text
        nullable: true
        description: Explica el match, mismatch o solución parcial entre la necesidad y la oferta disponible;
          destaca brechas de talla, color, fit, producto o inventario cuando son relevantes.
        operations:
        - select_evidence
      que_no_estamos_resolviendo:
        type: text
        nullable: true
        description: Describe la principal brecha accionable (producto, inventario, precio, ejecución o a medida)
          que explica la no compra o compra parcial.
        operations:
        - select_evidence
      por_que_llega_y_por_que_compra:
        type: text
        nullable: true
        description: Conecta motivador de visita, fuente de inspiración y driver real de cierre; si no compra,
          explica por qué llega y por qué no termina comprando.
        operations:
        - select_evidence
      rol_de_a_medida_en_la_conversacion:
        type: text
        nullable: true
        description: Explica si la confección a medida fue relevante, ganó la venta, pudo ayudar y no se ofreció,
          fue rechazada, o no tuvo rol real.
        operations:
        - select_evidence
      evaluacion_ejecucion_vendedor:
        type: text
        nullable: true
        description: Evalúa investigación, iniciativa, cierre, soluciones y manejo de objeciones en términos
          concretos y observables; no es una tasa de cumplimiento (para eso usar performance).
        operations:
        - select_evidence
      mejores_practicas_detectadas:
        type: text
        nullable: true
        description: Conductas replicables y claramente valiosas observadas. NULL si no hay ninguna destacable.
        operations:
        - select_evidence
      errores_principales_detectados:
        type: text
        nullable: true
        description: Fallas observables con impacto real, priorizadas. NULL si no hay error claro.
        operations:
        - select_evidence
      insight_cruzado_principal:
        type: text
        nullable: true
        description: Conecta al menos dos variables reales del caso (ej. producto+ocasión, precio+urgencia,
          ejecución+resultado). No extrapola tendencias globales desde un solo caso.
        operations:
        - select_evidence
      accion_sugerida:
        type: text
        nullable: true
        description: Una única acción corta, concreta y ejecutable derivada de la fricción principal de esa
          conversación.
        operations:
        - select_evidence
  categorical_product_insights:
    source: dashboard_v2.vw_roberts_insights_categoricos_por_producto
    use_when: Atributos y resultados categóricos por producto mencionado.
    grain: Una fila por conversation_id + producto_index.
    profile: standard_conversation
    fields:
      producto_index:
        type: integer
        observed_values:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        nullable: false
        description: Índice del producto dentro de la conversación (empieza en 1, correlativo por orden de primera
          aparición comercial relevante). Clave de join con descriptive_product_insights.
        operations:
        - join_key
        - filter
      producto_index_relacionado:
        type: integer
        observed_values:
        - 1
        - 2
        - 3
        - 4
        nullable: true
        description: Vincula un producto complementario o alternativo con su producto principal (apunta a otro
          producto_index de la misma conversación, nunca al propio). NULL para productos principales o cuando no
          hay relación clara.
        operations:
        - join_key
        - filter
      producto:
        configured_values: &producto_enum
        - abrigo
        - accesorios
        - blazer_y_saco
        - calzado
        - camisa
        - chamarra_y_chaleco
        - jeans
        - otro
        - pantalon
        - polos_y_playeras
        - separ_pantalon
        - separ_saco
        - sweater
        - traje
        observed_values: *producto_enum
        type: text
        nullable: false
        description: 'Categoría normalizada. separ_saco = saco de traje vendido sin su pantalón; separ_pantalon =
          pantalón de traje vendido sin su saco; blazer_y_saco = saco/blazer que no pertenece a un traje o no puede
          determinarse; otro sólo si no encaja razonablemente en el resto.'
        operations:
        - filter
        - group
        - compare
      rol_producto_en_conversacion:
        configured_values: &rol_producto
        - alternativo
        - complementario
        - no_claro
        - principal
        observed_values: *rol_producto
        type: text
        nullable: false
        description: 'Rol dominante en la historia comercial: principal (centro de la necesidad), complementario
          (agregado a otro producto), alternativo (reemplaza o compite con otro producto de la misma conversación),
          no_claro si es insuficientemente claro.'
        operations:
        - filter
        - group
        - compare
      ocasion_de_uso:
        configured_values: &ocasion_de_uso
        - boda
        - casual
        - evento
        - no_claro
        - regalo
        - trabajo
        observed_values: *ocasion_de_uso
        type: text
        nullable: true
        description: Ocasión para la que el cliente considera usar el producto. regalo sólo si es explícitamente un
          obsequio. NULL si no hay evidencia.
        operations:
        - filter
        - group
        - compare
      fit_buscado:
        configured_values: &fit_buscado
        - no_claro
        - regular
        - relaxed
        - slim
        observed_values: *fit_buscado
        type: text
        nullable: true
        description: 'Calce buscado, sólo con evidencia suficiente: entallado/ajustado -> slim; clásico/normal ->
          regular; holgado/amplio/suelto -> relaxed. NULL si no hay evidencia.'
        operations:
        - filter
        - group
        - compare
      color_solicitado_producto:
        configured_values: &color_enum
        - amarillo_naranja
        - azul
        - blanco_hueso
        - cafe_beige
        - gris
        - multicolor_otros
        - negro
        - rojo_vino
        - rosa_morado
        - verde
        observed_values: *color_enum
        type: text
        nullable: true
        description: 'Color principal solicitado (si hay varios, el claramente dominante). Mapeos: vino/borgoña/
          guinda -> rojo_vino; crema/marfil -> blanco_hueso; camel/beige -> cafe_beige. NULL si no hay evidencia.'
        operations:
        - filter
        - group
        - compare
      color_comprado_producto:
        configured_values: *color_enum
        observed_values: *color_enum
        type: text
        nullable: true
        description: Color final del producto comprado. Sólo se completa cuando se_compro=true y el color final
          queda claro; si no, NULL.
        operations:
        - filter
        - group
        - compare
      color_o_diseno_relevante:
        configured_values: &si_no_minuscula
        - 'no'
        - si
        observed_values: *si_no_minuscula
        type: text
        nullable: true
        description: 'si: color/diseño influyó realmente en la evaluación, objeción o decisión. no: claramente no
          tuvo peso. NULL: no puede saberse.'
        operations:
        - filter
        - group
        - compare
      talla_solicitada_producto:
        configured_values: &talla_enum
        - a_medida
        - chica_34-36
        - dos_extra_grande_50+
        - extra_grande_44-46-48
        - grande_42
        - mediana_38-40
        observed_values: *talla_enum
        type: text
        nullable: true
        description: Rango de talla principal buscado. NULL si no hay evidencia.
        operations:
        - filter
        - group
        - compare
      talla_comprada_producto:
        configured_values: *talla_enum
        observed_values: *talla_enum
        type: text
        nullable: true
        description: Talla final comprada. Sólo se completa cuando se_compro=true y la talla final queda clara; si
          no, NULL.
        operations:
        - filter
        - group
        - compare
      percepcion_calidad:
        configured_values: &percepcion_calidad
        - confeccion
        - marca
        - multiples
        - no_claro
        - relacion_valor_precio
        - tela
        observed_values: *percepcion_calidad
        type: text
        nullable: true
        description: 'Dimensión que sostiene la percepción de calidad/valor: tela, marca, confeccion,
          relacion_valor_precio, multiples, no_claro. NULL si la calidad no jugó un rol real.'
        operations:
        - filter
        - group
        - compare
      se_compro:
        type: boolean
        configured_values:
        - false
        - true
        observed_values:
        - false
        - true
        nullable: false
        description: true sólo cuando el producto termina resuelto en compra. Equivale 1:1 a
          resultado_producto=comprado. No es una transacción certificada, es una inferencia conversacional.
        operations:
        - filter
        - group
        - compare
      resultado_producto:
        configured_values: &resultado_producto
        - comprado
        - no_comprado
        - pendiente
        - reemplazado
        observed_values: *resultado_producto
        type: text
        nullable: true
        description: 'comprado (equivale a se_compro=true); no_comprado (se evalúa y se descarta sin reemplazo);
          reemplazado (la necesidad se resuelve con otro producto distinto); pendiente (desenlace abierto o no
          visible). NULL sólo si ni siquiera puede distinguirse razonablemente entre pendiente/no_comprado.'
        operations:
        - filter
        - group
        - compare
      motivo_venta_perdida_producto:
        configured_values: &motivo_perdida_producto
        - calidad_valor
        - diseno_estilo
        - ejecucion_vendedor
        - falta_color
        - falta_modelo
        - falta_talla
        - fit
        - no_claro
        - precio
        - tiempo_entrega
        observed_values: *motivo_perdida_producto
        type: text
        nullable: true
        description: Causa dominante de la pérdida de este producto específico; interpretar junto con
          resultado_producto=no_comprado. NULL si no aplica o no hay evidencia suficiente.
        operations:
        - filter
        - group
        - compare
      urgencia_cliente:
        configured_values: *urgencia_general
        observed_values: *urgencia_general
        type: text
        nullable: true
        description: Urgencia de la necesidad asociada específicamente a este producto (a diferencia de
          urgencia_general en demography, este campo sí puede ser NULL).
        operations:
        - filter
        - group
        - compare
      sensibilidad_precio:
        configured_values: *sensibilidad_precio_general
        observed_values: *sensibilidad_precio_general
        type: text
        nullable: true
        description: 'Sensibilidad al precio asociada a este producto: alta, media, baja, no_claro. NULL si el
          precio no aparece de forma útil.'
        operations:
        - filter
        - group
        - compare
      objecion_principal:
        configured_values: &objecion_principal
        - calidad
        - comparacion_competencia
        - estilo_diseno
        - fit
        - marca
        - precio
        - tiempo_entrega
        - urgencia
        observed_values: *objecion_principal
        type: text
        nullable: true
        description: Objeción comercial dominante expresada sobre este producto. marca y comparacion_competencia
          son valores válidos pero muy poco frecuentes en Roberts (3 y 6 filas). NULL si no hubo objeción clara.
        operations:
        - filter
        - group
        - compare
      hubo_manejo_objecion:
        type: boolean
        configured_values:
        - false
        - true
        observed_values:
        - false
        - true
        nullable: false
        description: true sólo si el vendedor trabaja realmente la objeción. false si no hubo objeción o si quedó
          sin trabajo real.
        operations:
        - filter
        - group
        - compare
      resultado_manejo_objecion:
        configured_values: &resultado_manejo_objecion
        - exitoso
        - fallido
        - no_aplica
        - parcial
        observed_values: *resultado_manejo_objecion
        type: text
        nullable: false
        description: 'exitoso: la objeción deja de frenar la venta. parcial: avanza pero no se resuelve del todo.
          fallido: no se resuelve o no fue trabajada pese a existir. no_aplica: no hubo objeción clara.'
        operations:
        - filter
        - group
        - compare
      solucion_ante_falta:
        configured_values: &solucion_ante_falta
        - a_medida
        - ajuste_sastreria
        - busqueda_otra_tienda
        - no_aplica
        - sin_solucion
        - sustitucion_funciona
        - sustitucion_no_funciona
        observed_values: *solucion_ante_falta
        type: text
        nullable: false
        description: Solución ofrecida ante una falta real de talla, color, modelo o disponibilidad de este producto.
          no_aplica cuando no hubo falta real.
        operations:
        - filter
        - group
        - compare
      hubo_ofrecimiento_complementario:
        type: boolean
        configured_values:
        - false
        - true
        observed_values:
        - false
        - true
        nullable: false
        description: true si el vendedor propone activamente un complemento vinculado específicamente a este
          producto.
        operations:
        - filter
        - group
        - compare
      hubo_ofrecimiento_a_medida:
        type: boolean
        configured_values:
        - false
        - true
        observed_values:
        - false
        - true
        nullable: false
        description: true si el vendedor propone explícitamente confección a medida/sastrería para este producto en
          particular.
        operations:
        - filter
        - group
        - compare
      resultado_a_medida:
        configured_values: &resultado_a_medida
        - cierra_venta
        - no_aplica
        - no_cierra_venta
        observed_values: *resultado_a_medida
        type: text
        nullable: false
        description: 'cierra_venta: la confección a medida destraba o ayuda a concretar la compra. no_cierra_venta:
          tuvo rol comercial real pero no cerró. no_aplica: no apareció o fue tangencial.'
        operations:
        - filter
        - group
        - compare
      disparador_de_cierre:
        configured_values: &disparador_cierre
        - a_medida
        - asesoria_vendedor
        - calidad_producto
        - fit_correcto
        - paquete_completo
        - promocion
        - urgencia
        observed_values: *disparador_cierre
        type: text
        nullable: true
        description: Factor principal que destraba/impulsa el cierre de este producto (sólo aplica si hubo compra).
          urgencia y calidad_producto son valores válidos pero poco frecuentes en Roberts (15 y 35 filas). NULL si
          no hubo compra o no hay driver identificable.
        operations:
        - filter
        - group
        - compare
  descriptive_product_insights:
    source: dashboard_v2.vw_roberts_insights_descriptivos_por_producto
    use_when: Evidencia y explicación textual por producto.
    grain: Una fila por conversation_id + producto_index; texto libre no agregable como categoría.
    profile: standard_conversation
    fields:
      producto_index:
        type: integer
        nullable: false
        description: Índice del producto; unir con la vista categórica usando conversation_id + producto_index.
        operations:
        - join_key
        - filter
      resumen_producto:
        type: text
        nullable: true
        description: Mini-historia comercial del producto -qué buscaba, qué ocurrió y cómo terminó.
        operations:
        - select_evidence
      preferencias_cliente_producto:
        type: text
        nullable: true
        description: Fit, color, diseño, ocasión y preferencias positivas o negativas sostenibles sobre este
          producto.
        operations:
        - select_evidence
      brechas_de_inventario_producto:
        type: text
        nullable: true
        description: Faltas de talla, color, modelo o producto y su impacto. NULL si no hubo brecha relevante.
        operations:
        - select_evidence
      sensibilidad_precio_y_umbral_producto:
        type: text
        nullable: true
        description: Cómo pesó el precio y cualquier umbral concreto mencionado. NULL si no fue relevante.
        operations:
        - select_evidence
      objeciones_y_respuesta_vendedor_producto:
        type: text
        nullable: true
        description: La objeción, la respuesta del vendedor y su resultado. NULL si no hubo objeción.
        operations:
        - select_evidence
      complementarios_y_paquete_producto:
        type: text
        nullable: true
        description: Complementarios/paquete vinculados a este producto y su resultado. NULL si no hubo dinámica
          relevante.
        operations:
        - select_evidence
      rol_de_a_medida_producto:
        type: text
        nullable: true
        description: Si la confección a medida fue ofrecida, considerada, rechazada o tuvo impacto en este producto.
          NULL si no fue relevante.
        operations:
        - select_evidence
      resultado_final_producto:
        type: text
        nullable: true
        description: Si terminó comprado, no comprado, reemplazado o pendiente, y el matiz principal del desenlace.
        operations:
        - select_evidence
      accion_sugerida_producto:
        type: text
        nullable: true
        description: Una única acción concreta de surtido, inventario, pricing, capacitación o venta complementaria
          vinculada a la fricción real de este producto.
        operations:
        - select_evidence
limitations:
- Compra y resultado son inferencias conversacionales del modelo, no tickets ni ventas certificadas.
- Los enums de configured_values reflejan el texto de los prompts de producción (checklist v8, insights v5) al
  momento de construir este mapa; si Langfuse sube de versión hay que revalidar. Los observed_values reflejan
  Postgres QA verificado el 2026-09-07 y pueden incluir valores de generaciones anteriores del prompt que ya no
  están en configured_values (ver motivador_visita.taxonomy_drift).
- 'El cluster de cashback (primer_mencion_cashback, cliente_llega_con_cashback_para_usar, conducta_vendedor_cashback)
  es NULL en aproximadamente 83% de las filas: no fue evaluado en esas conversaciones, no es lo mismo que
  no_mencionado/false.'
- Dos columnas de performance (vendedorexplicoprogramadelealtad, vendedormencionoprogramadelealtad) son legado y no
  forman parte del checklist v8 vigente; tienen datos pero no deben tratarse como criterios actuales.
- El mapa no responde organización, conectividad, gamificación, roleplays ni dominios de otros clientes.
- Este Data Map reutiliza la estructura de Mens Fashion V6 porque los prompts de negocio son idénticos, pero
  todos los números fueron re-verificados de forma independiente contra los datos propios de Roberts (ver
  metadata.known_findings_v1). Si en el futuro los prompts de Roberts y Mens Fashion divergen, dejar de asumir
  que ambos Data Maps deben evolucionar en paralelo.
