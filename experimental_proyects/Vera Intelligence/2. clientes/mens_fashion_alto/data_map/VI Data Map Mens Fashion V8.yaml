        configured_values: &primer_mencion_cashback
        - cliente
        - no_claro
        - no_mencionado
        - vendedor
        observed_values: *primer_mencion_cashback
        type: text
        nullable: true
        description: 'Quién introduce primero el tema del cashback: cliente, vendedor, no_mencionado (nunca aparece)
          o no_claro (excepcional; secuencia demasiado incompleta/contradictoria). IMPORTANTE: ~85% de las filas son
          NULL, no no_mencionado -el criterio de cashback simplemente no fue evaluado en esas conversaciones (versión
          de prompt anterior a la introducción del cluster de cashback, o insights no corrido). Filtrar por IS NOT
          NULL para acotar al subconjunto donde sí se evaluó.'
        operations:
        - filter
        - group
        - compare
      cliente_llega_con_cashback_para_usar:
        type: boolean
        configured_values:
        - false
        - true
        observed_values:
        - false
        - true
        nullable: true
        description: 'true sólo si hay evidencia razonable de que el cliente ya tenía cashback generado antes de esta
          compra y quiere usarlo ahora (no basta con conocer el programa o hablar del cashback que generará la
          compra actual). Igual que primer_mencion_cashback, es NULL en ~85% de las filas cuando el cluster de
          cashback no fue evaluado; no asumir false por defecto sin filtrar antes por IS NOT NULL si la pregunta
          depende de esa distinción.'
        operations:
        - filter
        - group
        - compare
      conducta_vendedor_cashback:
        configured_values: &conducta_vendedor_cashback
        - explica_beneficio
        - no_claro
        - no_menciona
        - promueve_compra_futura
        - sugiere_dividir_o_diferir_compra_actual
        observed_values: *conducta_vendedor_cashback
        type: text
        nullable: true
        description: 'no_menciona: no habla de cashback o no lo desarrolla comercialmente aunque el cliente lo
          introduzca. explica_beneficio: explica de forma neutral cómo funciona/cuánto genera/cuándo se usa, sin
          modificar la compra actual. promueve_compra_futura: usa el cashback para incentivar una compra incremental
          futura. sugiere_dividir_o_diferir_compra_actual: propone separar/postergar parte de una compra que ya
          formaba parte de la oportunidad actual para aprovechar el cashback. no_claro: conducta vinculada a cashback
          mas no distinguible entre categorías (excepcional). Mismo patrón de ~85% NULL que los otros dos campos de
          cashback.'
        operations:
        - filter
        - group
        - compare
      hubo_mencion_competencia:
        type: boolean
        configured_values:
        - false
        - true
        observed_values:
        - false
        - true
        nullable: false
        description: true si aparece comparación o referencia real a otra marca/tienda/opción externa, incluso
          implícita ("en otra tienda lo vi más barato"). No cuenta comparar opciones internas de la misma tienda.
        operations:
        - filter
        - group
        - compare
      hubo_mencion_a_medida:
        type: boolean
        configured_values:
        - false
        - true
        observed_values:
        - false
        - true
        nullable: false
        description: true si cliente o vendedor mencionan interés, posibilidad o necesidad de confección a medida/
          sastrería. Una mención no implica que haya sido ofrecida (ver hubo_ofrecimiento_a_medida).
        operations:
        - filter
        - group
        - compare
      hubo_ofrecimiento_a_medida:
        type: boolean
        configured_values:
        - false
        - true
        observed_values:
        - false
        - true
        nullable: false
        description: true sólo si el vendedor propone activamente la confección a medida/sastrería como opción o
          solución (no basta con que se haya mencionado el tema).
        operations:
        - filter
        - group
        - compare
      hubo_ofrecimiento_complementarios:
        type: boolean
        configured_values:
        - false
        - true
        observed_values:
        - false
        - true
        nullable: false
        description: true si el vendedor propone al menos un producto adicional comercialmente relacionado con el
          principal.
        operations:
        - filter
        - group
        - compare
      hubo_ofrecimiento_paquete:
        type: boolean
        configured_values:
        - false
        - true
        observed_values:
        - false
        - true
        nullable: false
        description: true si el vendedor arma o intenta armar una solución integral con múltiples prendas/accesorios.
          Un adicional aislado no constituye necesariamente un paquete.
        operations:
        - filter
        - group
        - compare
      hubo_pregunta_ocasion_de_uso:
        type: boolean
        configured_values:
        - false
        - true
        observed_values:
        - false
        - true
        nullable: true
        description: 'true sólo si el vendedor pregunta o explora para qué necesita el producto el cliente. Una
          ocasión aportada únicamente por el cliente no cuenta. CORRECCION V5 (2026-09-02): verificado 43 filas NULL sobre 20.388 (declarado antes nullable=false, incorrecto -corregido abajo-). VER semantic_dependencies.ocasion_uso_dual_source: este es el campo PRIMARIO para preguntas de negocio sobre esto -NO es intercambiable con vendedorpreguntaocasionuso de performance, coinciden ~72,5% de las veces-.'
        operations:
        - filter
        - group
        - compare
      atencion_pasiva_vendedor:
        type: boolean
        configured_values:
        - false
        - true
        observed_values:
        - false
        - true
        nullable: false
        description: true si el vendedor es mayormente reactivo, responde lo mínimo y muestra poca iniciativa; false
          si explora, propone y mueve la conversación. No se marca true por un momento aislado si el desempeño
          global fue proactivo.
        operations:
        - filter
        - group
        - compare
      falta_cierre_vendedor:
        type: boolean
        configured_values:
        - false
        - true
        observed_values:
        - false
        - true
        nullable: false
        description: true si, llegado un momento donde correspondía avanzar, el vendedor no intenta obtener una
          decisión, concretar la compra o definir un siguiente paso. No confundir con no_compra (falta_cierre_vendedor
          evalúa el intento, no el resultado).
        operations:
        - filter
        - group
        - compare
      no_ofrece_solucion_completa:
        type: boolean
        configured_values:
        - false
        - true
        observed_values:
        - false
        - true
        nullable: false
        description: true si el caso justificaba alternativas, complementarios, paquete, sustitución o a medida y el
          vendedor no construye una solución razonablemente completa. No exige perfección ni aplica cuando el
          contexto no justificaba una propuesta más amplia.
        operations:
        - filter
        - group
        - compare
      hubo_venta_perdida:
        type: boolean
        configured_values:
        - false
        - true
        observed_values:
        - false
        - true
        nullable: false
        description: true si al menos una necesidad o producto comercialmente relevante queda sin resolverse en
          compra. Puede coexistir con resultado_general=compra_parcial. Habilita motivo_principal_venta_perdida.
        operations:
        - filter
        - group
        - compare
      motivo_principal_venta_perdida:
        configured_values: &motivo_perdida_general
        - calidad_valor
        - diseno_estilo
        - ejecucion_vendedor
        - fit
        - inventario
        - no_aplica
        - precio
        - tiempo_entrega
        observed_values: *motivo_perdida_general
        type: text
        nullable: false
        description: Causa dominante de la venta perdida; sólo interpretable cuando hubo_venta_perdida=true (si no,
          vale no_aplica). ejecucion_vendedor sólo cuando la caída se explica principalmente por la intervención
          comercial, no por el resto de las causas.
        operations:
        - filter
        - group
        - compare
      cantidad_productos_mencionados:
        type: integer
        observed_values:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
        - 8
        nullable: false
        description: Cantidad de productos comercialmente relevantes mencionados; debe coincidir con la cantidad de
          filas de ese conversation_id en categorical_product_insights. Variantes de color/talla del mismo ítem
          cuentan una sola vez.
        operations:
        - filter
        - group
        - aggregate
      cantidad_productos_comprados:
        type: integer
        observed_values:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        nullable: false
        description: Cantidad de productos con se_compro=true en categorical_product_insights para esa misma
          conversación.
        operations:
        - filter
        - group
        - aggregate
  descriptive_insights:
    source: dashboard_v2.vw_mens_fashion_insights_descriptivos_generales
    use_when: Explicaciones y evidencia textual general de la conversación.
    grain: Una fila por conversación; texto libre no agregable como categoría.
    profile: descriptive_conversation
    fields:
      resumen_ejecutivo_conversacion:
        type: text
        nullable: true
        description: Resume qué quería el cliente, qué se negoció, qué compró y qué quedó sin resolver.
        operations:
        - select_evidence
      que_quiere_el_cliente_y_que_tenemos:
        type: text
        nullable: true
        description: Explica el match, mismatch o solución parcial entre la necesidad y la oferta disponible;
          destaca brechas de talla, color, fit, producto o inventario cuando son relevantes.
        operations:
        - select_evidence
      que_no_estamos_resolviendo:
        type: text
        nullable: true
        description: Describe la principal brecha accionable (producto, inventario, precio, ejecución o a medida)
          que explica la no compra o compra parcial.
        operations:
        - select_evidence
      por_que_llega_y_por_que_compra:
        type: text
        nullable: true
        description: Conecta motivador de visita, fuente de inspiración y driver real de cierre; si no compra,
          explica por qué llega y por qué no termina comprando.
        operations:
        - select_evidence
      rol_de_a_medida_en_la_conversacion:
        type: text
        nullable: true
        description: Explica si la confección a medida fue relevante, ganó la venta, pudo ayudar y no se ofreció,
          fue rechazada, o no tuvo rol real.
        operations:
        - select_evidence
      evaluacion_ejecucion_vendedor:
        type: text
        nullable: true
        description: Evalúa investigación, iniciativa, cierre, soluciones y manejo de objeciones en términos
          concretos y observables; no es una tasa de cumplimiento (para eso usar performance).
        operations:
        - select_evidence
      mejores_practicas_detectadas:
        type: text
        nullable: true
        description: Conductas replicables y claramente valiosas observadas. NULL si no hay ninguna destacable.
        operations:
        - select_evidence
      errores_principales_detectados:
        type: text
        nullable: true
        description: Fallas observables con impacto real, priorizadas. NULL si no hay error claro.
        operations:
        - select_evidence
      insight_cruzado_principal:
        type: text
        nullable: true
        description: Conecta al menos dos variables reales del caso (ej. producto+ocasión, precio+urgencia,
          ejecución+resultado). No extrapola tendencias globales desde un solo caso.
        operations:
        - select_evidence
      accion_sugerida:
        type: text
        nullable: true
        description: Una única acción corta, concreta y ejecutable derivada de la fricción principal de esa
          conversación.
        operations:
        - select_evidence
  categorical_product_insights:
    source: dashboard_v2.vw_mens_fashion_insights_categoricos_por_producto
    use_when: Atributos y resultados categóricos por producto mencionado.
    grain: Una fila por conversation_id + producto_index.
    profile: standard_conversation
    fields:
      producto_index:
        type: integer
        observed_values:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        nullable: false
        description: Índice del producto dentro de la conversación (empieza en 1, correlativo por orden de primera
          aparición comercial relevante). Clave de join con descriptive_product_insights.
        operations:
        - join_key
        - filter
      producto_index_relacionado:
        type: integer
        observed_values:
        - 1
        - 2
        - 3
        - 4
        nullable: true
        description: Vincula un producto complementario o alternativo con su producto principal (apunta a otro
          producto_index de la misma conversación, nunca al propio). NULL para productos principales o cuando no
          hay relación clara.
        operations:
        - join_key
        - filter
      producto:
        configured_values: &producto_enum
        - abrigo
        - accesorios
        - blazer_y_saco
        - calzado
        - camisa
        - chamarra_y_chaleco
        - jeans
        - otro
        - pantalon
        - polos_y_playeras
        - separ_pantalon
        - separ_saco
        - sweater
        - traje
        observed_values: *producto_enum
        type: text
        nullable: false
        description: 'Categoría normalizada. separ_saco = saco de traje vendido sin su pantalón; separ_pantalon =
          pantalón de traje vendido sin su saco; blazer_y_saco = saco/blazer que no pertenece a un traje o no puede
          determinarse; otro sólo si no encaja razonablemente en el resto.'
        operations:
        - filter
        - group
        - compare
      rol_producto_en_conversacion:
        configured_values: &rol_producto
        - alternativo
        - complementario
        - no_claro
        - principal
        observed_values: *rol_producto
        type: text
        nullable: false
        description: 'Rol dominante en la historia comercial: principal (centro de la necesidad), complementario
          (agregado a otro producto), alternativo (reemplaza o compite con otro producto de la misma conversación),
          no_claro si es insuficientemente claro.'
        operations:
        - filter
        - group
        - compare
      ocasion_de_uso:
        configured_values: &ocasion_de_uso
        - aniversario
        - bautismo_comunion
        - boda
        - cumpleanos
        - gala_cena_formal
        - graduacion
        - no_claro
        - regalo
        - trabajo
        - uso_cotidiano
        - viaje
        observed_values:
        - boda
        - casual
        - evento
        - no_claro
        - regalo
        - trabajo
        type: text
        nullable: true
        description: 'Usa una sola categoría por producto: boda, graduacion, cumpleanos, aniversario, bautismo_comunion,
          gala_cena_formal, trabajo, regalo, viaje, uso_cotidiano, no_claro o null. regalo sólo si el producto es un
          obsequio; comprar funcionalmente para un tercero no implica regalo. no_claro cuando hay señal de ocasión/uso
          pero no alcanza para una categoría específica (ej. "evento", "fiesta", "celebración"). NULL si no aparece
          ninguna señal útil sobre ocasión o uso. No inferir una ocasión específica a partir de una mención genérica.'
        operations:
        - filter
        - group
        - compare
      fit_buscado:
        configured_values: &fit_buscado
        - no_claro
        - regular
        - relaxed
        - slim
        observed_values: *fit_buscado
        type: text
        nullable: true
        description: 'Calce buscado, sólo con evidencia suficiente: entallado/ajustado -> slim; clásico/normal ->
          regular; holgado/amplio/suelto -> relaxed. Una duda de talla no implica fit. NULL si no hay evidencia.'
        operations:
        - filter
        - group
        - compare
      color_solicitado_producto:
        configured_values: &color_enum
        - amarillo_naranja
        - azul
        - blanco_hueso
        - cafe_beige
        - gris
        - multicolor_otros
        - negro
        - rojo_vino
        - rosa_morado
        - verde
        observed_values: *color_enum
        type: text
        nullable: true
        description: 'Color principal solicitado (si hay varios, el claramente dominante). Mapeos: vino/borgoña/
          guinda -> rojo_vino; crema/marfil -> blanco_hueso; camel/beige -> cafe_beige. NULL si no hay evidencia.'
        operations:
        - filter
        - group
        - compare
      color_comprado_producto:
        configured_values: *color_enum
        observed_values: *color_enum
        type: text
        nullable: true
        description: Color final del producto comprado. Sólo se completa cuando se_compro=true y el color final
          queda claro; si no, NULL (incluye siempre NULL cuando se_compro=false).
        operations:
        - filter
        - group
        - compare
      color_o_diseno_relevante:
        configured_values: &si_no_minuscula
        - 'no'
        - si
        observed_values: *si_no_minuscula
        type: text
        nullable: true
        description: 'si: color/diseño influyó realmente en la evaluación, objeción o decisión. no: claramente no
          tuvo peso. NULL: no puede saberse. (Nota: enum en minúsculas, distinto del "Sí"/"No" con mayúscula inicial
          de la vista performance.)'
        operations:
        - filter
        - group
        - compare
      talla_solicitada_producto:
        configured_values: &talla_enum
        - a_medida
        - chica_34-36
        - dos_extra_grande_50+
        - extra_grande_44-46-48
        - grande_42
        - mediana_38-40
        observed_values: *talla_enum
        type: text
        nullable: true
        description: Rango de talla principal buscado (no forzar una talla si sólo hubo tanteo ambiguo). NULL si no
          hay evidencia.
        operations:
        - filter
        - group
        - compare
      talla_comprada_producto:
        configured_values: *talla_enum
        observed_values: *talla_enum
        type: text
        nullable: true
        description: Talla final comprada. Sólo se completa cuando se_compro=true y la talla final queda clara; si
          no, NULL.
        operations:
        - filter
        - group
        - compare
      percepcion_calidad:
        configured_values: &percepcion_calidad
        - confeccion
        - marca
        - multiples
        - no_claro
        - relacion_valor_precio
        - tela
        observed_values: *percepcion_calidad
        type: text
        nullable: true
        description: 'Dimensión que sostiene la percepción de calidad/valor: tela (material/textura), marca
          (reputación/confianza), confeccion (hechura/terminaciones), relacion_valor_precio (si vale lo que cuesta),
          multiples (dos o más dimensiones con peso similar), no_claro (aparece pero no se puede categorizar). NULL
          si la calidad no jugó un rol real.'
        operations:
        - filter
        - group
        - compare
      se_compro:
        type: boolean
        configured_values:
        - false
        - true
        observed_values:
        - false
        - true
        nullable: false
        description: true sólo cuando el producto termina resuelto en compra (cambiar talla/color del mismo producto
          mantiene true). Si se reemplaza por otro producto distinto, el original pasa a false. Equivale 1:1 a
          resultado_producto=comprado. No es una transacción certificada, es una inferencia conversacional.
        operations:
        - filter
        - group
        - compare
      resultado_producto:
        configured_values: &resultado_producto
        - comprado
        - no_comprado
        - pendiente
        - reemplazado
        observed_values: *resultado_producto
        type: text
        nullable: true
        description: 'comprado (equivale a se_compro=true); no_comprado (se evalúa y se descarta sin reemplazo);
          reemplazado (la necesidad se resuelve con otro producto distinto); pendiente (desenlace abierto o no
          visible, típico si se corta la transcripción antes del cierre -no forzar no_comprado en ese caso-). NULL
          sólo si ni siquiera puede distinguirse razonablemente entre pendiente/no_comprado.'
        operations:
        - filter
        - group
        - compare
      motivo_venta_perdida_producto:
        configured_values: &motivo_perdida_producto
        - calidad_valor
        - diseno_estilo
        - ejecucion_vendedor
        - falta_color
        - falta_modelo
        - falta_talla
        - fit
        - no_claro
        - precio
        - tiempo_entrega
        observed_values: *motivo_perdida_producto
        type: text
        nullable: true
        description: Causa dominante de la pérdida de este producto específico; interpretar junto con
          resultado_producto=no_comprado. no_claro si la pérdida es evidente pero la causa no puede aislarse. NULL
          si no aplica o no hay evidencia suficiente.
        operations:
        - filter
        - group
        - compare
      urgencia_cliente:
        configured_values: *urgencia_general
        observed_values: *urgencia_general
        type: text
        nullable: true
        description: Urgencia de la necesidad asociada específicamente a este producto (a diferencia de
          urgencia_general en demography, este campo sí puede ser NULL si no hay ninguna pista).
        operations:
        - filter
        - group
        - compare
      sensibilidad_precio:
        configured_values: *sensibilidad_precio_general
        observed_values: *sensibilidad_precio_general
        type: text
        nullable: true
        description: 'Sensibilidad al precio asociada a este producto: alta (frena o domina), media (influye pero no
          es el único factor), baja (no parece barrera relevante), no_claro (comentarios sin intensidad clara). NULL
          si el precio no aparece de forma útil. Preguntar el precio no implica por sí solo alta sensibilidad. A
          diferencia de sensibilidad_precio_general (demography), este campo por producto sí admite NULL.'
        operations:
        - filter
        - group
        - compare
      objecion_principal:
        configured_values: &objecion_principal
        - calidad
        - comparacion_competencia
        - estilo_diseno
        - fit
        - marca
        - precio
        - tiempo_entrega
        - urgencia
        observed_values: *objecion_principal
        type: text
        nullable: true
        description: Objeción comercial dominante expresada sobre este producto (si hay varias, la que más condiciona
          el cierre). marca y comparacion_competencia son valores válidos pero poco frecuentes en los datos (2 y 5
          filas respectivamente). NULL si no hubo objeción clara.
        operations:
        - filter
        - group
        - compare
      hubo_manejo_objecion:
        type: boolean
        configured_values:
        - false
        - true
        observed_values:
        - false
        - true
        nullable: false
        description: true sólo si el vendedor trabaja realmente la objeción (respuesta, reencuadre, explicación o
          alternativa). false si no hubo objeción o si quedó sin trabajo real.
        operations:
        - filter
        - group
        - compare
      resultado_manejo_objecion:
        configured_values: &resultado_manejo_objecion
        - exitoso
        - fallido
        - no_aplica
        - parcial
        observed_values: *resultado_manejo_objecion
        type: text
        nullable: false
        description: 'exitoso: la objeción deja de frenar la venta. parcial: avanza pero no se resuelve del todo.
          fallido: no se resuelve o no fue trabajada pese a existir. no_aplica: no hubo objeción clara. Interpretar
          junto con hubo_manejo_objecion.'
        operations:
        - filter
        - group
        - compare
      solucion_ante_falta:
        configured_values: &solucion_ante_falta
        - a_medida
        - ajuste_sastreria
        - busqueda_otra_tienda
        - no_aplica
        - sin_solucion
        - sustitucion_funciona
        - sustitucion_no_funciona
        observed_values: *solucion_ante_falta
        type: text
        nullable: false
        description: Solución ofrecida ante una falta real de talla, color, modelo o disponibilidad de este producto.
          no_aplica cuando no hubo falta real.
        operations:
        - filter
        - group
        - compare
      hubo_ofrecimiento_complementario:
        type: boolean
        configured_values:
        - false
        - true
        observed_values:
        - false
        - true
        nullable: false
        description: true si el vendedor propone activamente un complemento vinculado específicamente a este
          producto. Si es true para algún producto, hubo_ofrecimiento_complementarios (general, en categorical_insights)
          también debe ser true.
        operations:
        - filter
        - group
        - compare
      hubo_ofrecimiento_a_medida:
        type: boolean
        configured_values:
        - false
        - true
        observed_values:
        - false
        - true
        nullable: false
        description: true si el vendedor propone explícitamente confección a medida/sastrería para este producto en
          particular. Consistencia esperada con el flag general en categorical_insights.
        operations:
        - filter
        - group
        - compare
      resultado_a_medida:
        configured_values: &resultado_a_medida
        - cierra_venta
        - no_aplica
        - no_cierra_venta
        observed_values: *resultado_a_medida
        type: text
        nullable: false
        description: 'cierra_venta: la confección a medida destraba o ayuda a concretar la compra de este producto.
          no_cierra_venta: tuvo rol comercial real pero no cerró. no_aplica: no apareció o fue tangencial. Excluir
          no_aplica al medir efectividad (tasa de cierre de a medida).'
        operations:
        - filter
        - group
        - compare
      disparador_de_cierre:
        configured_values: &disparador_cierre
        - a_medida
        - asesoria_vendedor
        - calidad_producto
        - fit_correcto
        - paquete_completo
        - promocion
        - urgencia
        observed_values: *disparador_cierre
        type: text
        nullable: true
        description: Factor principal que destraba/impulsa el cierre de este producto (sólo aplica si hubo compra;
          si hay varios, el más determinante o el último decisivo). urgencia y calidad_producto son valores válidos
          pero poco frecuentes (78 y 35 filas). NULL si no hubo compra o no hay driver identificable.
        operations:
        - filter
        - group
        - compare
  descriptive_product_insights:
    source: dashboard_v2.vw_mens_fashion_insights_descriptivos_por_producto
    use_when: Evidencia y explicación textual por producto.
    grain: Una fila por conversation_id + producto_index; texto libre no agregable como categoría.
    profile: standard_conversation
    fields:
      producto_index:
        type: integer
        nullable: false
        description: Índice del producto; unir con la vista categórica usando conversation_id + producto_index
          (mismos índices y misma cantidad de filas que categorical_product_insights para esa conversación).
        operations:
        - join_key
        - filter
      resumen_producto:
        type: text
        nullable: true
        description: Mini-historia comercial del producto -qué buscaba, qué ocurrió y cómo terminó.
        operations:
        - select_evidence
      preferencias_cliente_producto:
        type: text
        nullable: true
        description: Fit, color, diseño, ocasión y preferencias positivas o negativas sostenibles sobre este
          producto.
        operations:
        - select_evidence
      brechas_de_inventario_producto:
        type: text
        nullable: true
        description: Faltas de talla, color, modelo o producto y su impacto. NULL si no hubo brecha relevante.
        operations:
        - select_evidence
      sensibilidad_precio_y_umbral_producto:
        type: text
        nullable: true
        description: Cómo pesó el precio y cualquier umbral concreto mencionado. NULL si no fue relevante.
        operations:
        - select_evidence
      objeciones_y_respuesta_vendedor_producto:
        type: text
        nullable: true
        description: La objeción, la respuesta del vendedor y su resultado. NULL si no hubo objeción.
        operations:
        - select_evidence
      complementarios_y_paquete_producto:
        type: text
        nullable: true
        description: Complementarios/paquete vinculados a este producto y su resultado. NULL si no hubo dinámica
          relevante.
        operations:
        - select_evidence
      rol_de_a_medida_producto:
        type: text
        nullable: true
        description: Si la confección a medida fue ofrecida, considerada, rechazada o tuvo impacto en este producto.
          NULL si no fue relevante.
        operations:
        - select_evidence
      resultado_final_producto:
        type: text
        nullable: true
        description: Si terminó comprado, no comprado, reemplazado o pendiente, y el matiz principal del desenlace.
        operations:
        - select_evidence
      accion_sugerida_producto:
        type: text
        nullable: true
        description: Una única acción concreta de surtido, inventario, pricing, capacitación o venta complementaria
          vinculada a la fricción real de este producto.
        operations:
        - select_evidence
limitations:
- Compra y resultado son inferencias conversacionales del modelo, no tickets ni ventas certificadas.
- Los enums de configured_values reflejan el texto de los prompts de producción (checklist v10, insights v8) al
  momento de construir este mapa; si Langfuse sube de versión hay que revalidar. Los observed_values reflejan
  Postgres QA verificado el 2026-08-28 y pueden incluir valores de generaciones anteriores del prompt que ya no
  están en configured_values (ver motivador_visita.taxonomy_drift).
- 'El cluster de cashback (primer_mencion_cashback, cliente_llega_con_cashback_para_usar, conducta_vendedor_cashback)
  es NULL en aproximadamente 85% de las filas: no fue evaluado en esas conversaciones, no es lo mismo que
  no_mencionado/false.'
- Dos columnas de performance (vendedorexplicoprogramadelealtad, vendedormencionoprogramadelealtad) son legado y no
  forman parte del checklist v10 vigente; tienen datos pero no deben tratarse como criterios actuales.
- El mapa no responde organización, conectividad, gamificación, roleplays ni dominios de otros clientes.