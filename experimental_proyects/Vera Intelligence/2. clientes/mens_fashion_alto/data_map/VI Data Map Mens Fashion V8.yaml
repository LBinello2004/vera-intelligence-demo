          en configured_values) describe la necesidad concreta que motiva la visita (boda, graduacion, cumpleanos,
          aniversario, bautismo_comunion, gala_cena_formal, trabajo, regalo, viaje, reposicion_renovacion, uso_cotidiano, no_claro).
          Taxonomías anteriores incluían canales/fuentes (aparador, ecommerce, promocion, etc.) y categorías agrupadas
          (cumpleanos_aniversario, evento_formal_social, otra_necesidad_especifica). Ambas conviven en Postgres porque
          hay conversaciones analizadas con distintas versiones del prompt. Para preguntas sobre el período reciente,
          preferir/filtrar por configured_values; para preguntas históricas o agregadas de todo el dataset, puede ser
          necesario incluir ambos conjuntos y aclararlo en la respuesta.'
        description: Necesidad concreta que explica por qué el cliente llega a la tienda (no el canal/fuente de
          inspiración, eso es origen_inspiracion_cliente). Nunca admite null en el prompt. No inferir categorías
          específicas de términos genéricos como "evento" o "fiesta" (usar no_claro). Ver taxonomy_drift antes de
