        nullable: true
        description: 'compra_total: todas las necesidades principales quedan resueltas en compra. compra_parcial:
          se compra algo pero queda al menos una necesidad/producto relevante sin resolver. no_compra/cambio/queja:
          según el desenlace dominante. Si el cierre no es visible (transcripción cortada), no se fuerza no_compra.'
