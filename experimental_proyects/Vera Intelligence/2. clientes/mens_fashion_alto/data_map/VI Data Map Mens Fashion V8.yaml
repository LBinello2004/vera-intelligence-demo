metadata:
  name: VI Data Map Mens Fashion V8
  version: 8.0.0
  client: Mens Fashion
  model_target: Gemini 3.7
  generated_at: '2026-09-16'
  scope: Sólo seis vistas dashboard_v2 de Mens Fashion. El tenant ('Mens Fashion') es fijo para este prototipo de un solo
    cliente; no se resuelve dinámicamente.
  source_of_truth:
    checklist_prompt: clientes/Haber/Mens Fashion/checklist (Langfuse, label production, v10 al construir este mapa)
    insights_prompt: clientes/Haber/Mens Fashion/insights (Langfuse, label production, v8 al construir este mapa)
    note: Las descripciones y enums de este mapa se derivaron leyendo el texto completo de ambos prompts y verificando
      cada campo sospechoso contra valores reales en Postgres QA (no sólo contra la muestra que generó V1/V2). Si el
      checklist o el insights suben de versión, revalidar este mapa contra el nuevo texto.
  changes_from_v7:
  - 'insights v8: actualización y alineación de taxonomías en motivador_visita (general) y ocasion_de_uso (por producto).
      En motivador_visita se desglosó cumpleanos_aniversario en cumpleanos y aniversario; evento_formal_social fue reemplazado
      por bautismo_comunion y gala_cena_formal; se eliminó otra_necesidad_especifica (menciones genéricas de eventos o fiestas
      se clasifican como no_claro). En ocasion_de_uso a nivel producto se adoptó la misma taxonomía estructurada (boda, graduacion,
      cumpleanos, aniversario, bautismo_comunion, gala_cena_formal, trabajo, regalo, viaje, uso_cotidiano, no_claro, null),
      eliminando los valores casual y evento.'
  hallazgos_criticos_verificados_2026-09-16:
  - 'motivador_visita y ocasion_de_uso: verificado en Postgres QA que los datos históricos reflejan las taxonomías de versiones
      anteriores (en motivador_visita: no_claro 11.209, necesidad_especifica 4.402, evento_formal_social 1.442, uso_cotidiano 1.161,
      reposicion_renovacion 771, promocion 727, boda 573, trabajo 374, graduacion 128, regalo 105, aparador 60, otra_necesidad_especifica 52,
      viaje 26, cumpleanos_aniversario 26, entre otros; en ocasion_de_uso: no_claro 10.512, evento 9.718, casual 3.103, boda 2.604,
      trabajo 1.806, regalo 285, y 6.935 NULLs). Los nuevos valores específicos de v8 aún no registran filas procesadas en QA pero
      quedan formalizados en configured_values.'
  changes_from_v6:
  - 'checklist v10: el criterio Otros.VendedorInformoCashback20Porciento se renombró a VendedorInformoCashback y se simplificó
      su definición semántica. En v9 exigía comunicar la dinámica completa de 5 componentes (20%, 24h, 30 días, factor 3.33x,
      tope 30%); en v10 basta con cualquier mención explícita al beneficio de cashback por parte del vendedor para marcar "Sí",
      sin importar el porcentaje ni la explicación de mecánica o vigencia. La columna física en Postgres en la vista
      vw_mens_fashion_rendimiento_vendedor mantiene el nombre físico vendedorinformocashback20porciento.'
  hallazgos_criticos_verificados_2026-09-08:
  - 'vendedorinformocashback20porciento: la columna física en vw_mens_fashion_rendimiento_vendedor sigue llamándose
      vendedorinformocashback20porciento (verificado contra Postgres QA que no existe columna vendedorinformocashback).
      Presenta 4.038 filas evaluadas (196 Sí, 2.519 No, 1.323 N/A) y 17.545 NULLs (81,3% del total de 21.583 filas de Mens Fashion).'
  changes_from_v3:
  - 'PERFORMANCE.vendedordestacaventajasconfeccionmedida — HALLAZGO GRAVE (2026-08-31): el checklist define una cascada
      donde este campo debe ser N/A siempre que vendedormencionoconfeccionamedida sea N/A. Verificado contra Postgres:
      esa cascada NO se respeta de forma confiable en los datos — de 6.106 filas con vendedormencionoconfeccionamedida=N/A,
      4.360 (71%) tienen este campo en ''No'' en vez de ''N/A'' (sólo 1.746 sí quedaron N/A). Esto NO es un bug de SQL:
      es una limitación de la extracción que puebla el checklist, que no aplica su propia regla de cascada de forma
      consistente. Consecuencia práctica: un conteo crudo de "No" en este campo SOBRESTIMA fuertemente los casos de
      incumplimiento real (la mayoría de esos "No" en realidad nunca tuvieron una oportunidad real). Encontrado porque
      un agente real reportó "15.286 conversaciones (85.3%)" de incumplimiento sin ninguna salvedad, una cifra con
      falsa precisión. Marcado reliability: unreliable_no en el campo, con instrucción explícita de no reportar el
      conteo crudo sin advertencia.'
  - 'semantic_dependencies.cashback ampliado: cruzar categorical_insights (primer_mencion_cashback/conducta_vendedor_cashback)
      con performance.vendedorinformocashback20porciento sin decidir explícitamente qué hacer con las filas NULL de
      performance dispara resultados muy distintos según el denominador elegido (verificado: 80/805=9.9% incluyendo
      NULL de performance como "no informó", vs 80/361=22.2% excluyéndolas). Ambas convenciones son defendibles pero
      dan una diferencia de más de 12 puntos porcentuales; la respuesta debe declarar explícitamente cuál usó.'
  - 'Nota operativa (no es un cambio del mapa): en pruebas reales, gemini-3.7-flash generó dos veces SQL con un
      caracter CJK insertado espontáneamente en medio de un nombre de columna (ej. "seller_id圣", "primer_mencion_cashback四周"),
      lo que rompió la query (rechazada por sql_security.py en un caso, error de Postgres en el otro). El agente se
      autocorrigió en el siguiente intento ambas veces. No es un problema del Data Map ni de la validación — es una
      rareza de generación del modelo a monitorear si se repite con frecuencia.'
  changes_from_v2:
  - 'performance: las descripciones de V2 tenían texto de otro cliente (mencionaban "Puntos Robert''s" y "Busca, Consigue,
      Entrega", que no existen en Men''s Fashion). Reescritas desde el checklist v9 real.'
  - 'performance: configured_values de varios campos sólo listaba [Sí, No], omitiendo N/A pese a que el checklist v9
      dice explícitamente que TODOS los campos admiten Sí/No/N/A. Verificado con COUNT(*) real: N/A aparece en los 4
      campos muestreados que V2 marcaba como binarios.'
  - 'performance: vendedorexplicoprogramadelealtad y vendedormencionoprogramadelealtad existen en Postgres y tienen
      datos, pero NO forman parte del JSON de salida del checklist v9 vigente (no hay "programa de lealtad" en Men''s
      Fashion). Son legado de una versión de prompt anterior; marcados legacy: true.'
  - 'categorical_insights.motivador_visita: el enum de V2 (aparador, ecommerce, promocion, recomendacion, ...) es una
      taxonomía vieja que ya no está en el insights v7 vigente (ahora es boda, graduacion, evento_formal_social, etc.).
      Verificado en Postgres: AMBAS taxonomías coexisten en datos históricos porque el prompt cambió de enum en algún
      punto. Documentado como taxonomy_drift.'
  - 'categorical_insights.origen_inspiracion_cliente: faltaba ecommerce_terceros (confirmado en datos, 14 filas).'
  - 'categorical_insights.tipo_interaccion y resultado_general: faltaba el valor queja (confirmado, 57 y 41 filas
      respectivamente).'
  - 'categorical_insights.primer_mencion_cashback, cliente_llega_con_cashback_para_usar, conducta_vendedor_cashback:
      V2 sólo mostraba el valor que aparecía en una muestra chica (ej. sólo "false", sólo "no_mencionado"). Ampliado
      al enum completo del prompt y agregada nota sobre el altísimo % de NULL (~85%) en este cluster.'
  - 'categorical_product_insights.objecion_principal: faltaban marca y comparacion_competencia (raros pero reales:
      2 y 5 filas).'
  - 'categorical_product_insights.disparador_de_cierre: faltaban urgencia y calidad_producto (raros pero reales:
      78 y 35 filas).'
  - Se agregó nullable a nivel de campo en fuentes categóricas para distinguir "valor de enum" de "sin evidencia
      suficiente" (importante para IS NULL vs filtro por string en SQL).
  - 'tenant_field de descriptive_conversation (seller, no seller_id) NO es un typo: se verificó contra information_schema
      que la columna real de vw_mens_fashion_insights_descriptivos_generales se llama seller. Cada profile usa el
      nombre de columna real de su vista.'
decision_flow:
- Identificar si la pregunta es general de conversación o específica de producto.
- Elegir una sola familia primaria según routing; sumar una segunda fuente sólo si la pregunta exige evidencia y existe join
  declarado.
- Resolver profile, grano, tenant y fecha antes de escribir SQL.
- Elegir campos físicos exactos y valores observados; después construir filtros y agregaciones.
- 'Si el campo tiene nullable: true, decidir explícitamente si la pregunta requiere excluir NULL (IS NOT NULL) o si
  NULL es parte legítima de la respuesta (por ejemplo "en cuántas conversaciones no se evaluó cashback").'
- Verificar que cada condición explícita de la pregunta aparezca en SELECT, WHERE, GROUP BY o cálculo.
routing:
  demography:
    questions: quién es el cliente, cómo llega, para quién compra, necesidad, decisión, precio o urgencia
    avoid: no usar para motivos comerciales detallados ni evaluación del vendedor
  performance:
    questions: criterios, cumplimiento, incumplimiento, fortalezas, debilidades, ranking o evolución del vendedor
    avoid: no usar textos narrativos como si fueran criterios; no usar los dos campos legacy de programa de lealtad
      como si fueran parte del checklist vigente
  categorical_insights:
    questions: resultado general, venta perdida, motivador, cashback, competencia, a medida, cierre o cantidades
    avoid: no usar para ejemplos o explicaciones textuales; no filtrar cashback como false/no_mencionado sin antes
      considerar que ~85% de las filas son NULL (cashback no evaluado)
  descriptive_insights:
    questions: por qué, cómo fue la ejecución, ejemplos, errores, mejores prácticas o acciones sugeridas
    avoid: no agrupar ni calcular frecuencia de textos
  categorical_product_insights:
    questions: producto, compra, ocasión, fit, talla, color, objeción, inventario, complementarios o a medida por producto
    avoid: no afirmar ventas transaccionales
  descriptive_product_insights:
    questions: ejemplos y explicaciones narrativas de un producto
    avoid: no usar sin la vista categórica cuando la condición del producto debe comprobarse físicamente
profiles:
  standard_conversation:
    row_key: conversation_id
    tenant_field: seller_id
    date_field: uploaded_at_local
    optional_dimensions:
    - store_id
    - store_name
    - sector_id
    - sector_name
    - employee_id
    - employee_full_name
    quality_filter: 'usefulforanalysis IS TRUE cuando la pregunta se refiera a conversaciones analizables. REGLA NEGATIVA EXPLICITA (agregada V5, 2026-09-02, ver q16 en el README > "Actualizacion automatica del Data Map"): si la pregunta NO menciona "analizables" ni pide explicitamente excluir conversaciones de baja calidad, NO agregar este filtro por costumbre -verificado que el agente a veces lo agrega sin que se lo pidan, cambiando la poblacion silenciosamente y dando un resultado distinto al que corresponde-.'
  descriptive_conversation:
    row_key: conversation_id
    tenant_field: seller
    date_field: date
    optional_dimensions: []
    quality_filter: 'No asumir usefulforanalysis: esta vista no lo expone.'
sql_rules:
  scope: Usar únicamente sources[].source. Nunca consultar otra vista, schema o cliente.
  read_only: Un único SELECT o WITH...SELECT; parámetros psycopg; sin interpolar texto del usuario; LIMIT 200 para detalle.
  tenant: Aplicar el valor exacto autorizado de sesión sobre profiles[profile].tenant_field; no inferirlo del texto de la
    pregunta.
  time: Filtrar profiles[profile].date_field sólo cuando el usuario indique un período. No inventar ventanas temporales.
  conversation_population: COUNT(DISTINCT conversation_id).
  product_population: COUNT(DISTINCT (conversation_id, producto_index)).
  performance_rate: cumplimientos / base_evaluada; base = conversaciones distintas con valor Sí o No; excluir N/A y null.
  categorical_rate_general_rule: 'AGREGADO V5 (2026-09-02, mismo criterio que Farma24 V4): la misma convencion de performance_rate aplica a cualquier campo categorico booleano o Si/No/N-A del Data Map, no solo a los criterios de performance -incluye hubo_pregunta_ocasion_de_uso y vendedorpreguntaocasionuso, ver semantic_dependencies.ocasion_uso_dual_source-.'
  categorical_filters: Usar valores de configured_values (no sólo observed_values) respetando tipo, mayúsculas y acentos;
    excluir null/no_aplica de rankings salvo pedido explícito.
  nullable_fields: Para un campo con nullable=true, decidir si NULL debe incluirse, excluirse (IS NOT NULL) o ser el foco
    de la pregunta antes de agregar o filtrar.
  free_text: Seleccionar como evidencia con claves y fecha. Nunca GROUP BY, COUNT o ranking por texto narrativo.
semantic_dependencies:
  lost_sale_general: hubo_venta_perdida IS TRUE habilita motivo_principal_venta_perdida; excluir no_aplica.
  confeccion_medida_dual_source: 'AGREGADO V6 (2026-09-04, busqueda proactiva del mismo patron que ocasion_uso_dual_source): vendedormencionoconfeccionamedida (performance, checklist, Si/No/N-A) y hubo_mencion_a_medida (categorical_insights, boolean) son DOS MEDICIONES INDEPENDIENTES. Verificado contra Postgres QA (cruce por conversation_id): coinciden solo el 77,7% de las veces (Si/true=4.317, No/false=6.619; discrepan No/true=3.050, N-A/true=594, Si/false=85). REGLA: usar SIEMPRE hubo_mencion_a_medida (categorical_insights) como fuente primaria para preguntas de negocio sobre esto; vendedormencionoconfeccionamedida es la evaluacion del checklist, una lectura distinta, no intercambiable.'
  ofrecimiento_complementarios_dual_source: 'AGREGADO V6 (2026-09-04, misma busqueda proactiva): vendedorsugiriocomplementos (performance, checklist, Si/No/N-A) y hubo_ofrecimiento_complementarios (categorical_insights, boolean) son DOS MEDICIONES INDEPENDIENTES. Verificado contra Postgres QA: coinciden el 87,9% de las veces (Si/true=8.563, No/false=4.892; discrepan No/true=1.464, Si/false=391) -menos grave que confeccion_medida_dual_source pero igual de real-. REGLA: usar SIEMPRE hubo_ofrecimiento_complementarios (categorical_insights) como fuente primaria; vendedorsugiriocomplementos es la evaluacion del checklist, no intercambiable.'
  ocasion_uso_dual_source: 'AGREGADO V5 (2026-09-02): hubo_pregunta_ocasion_de_uso (categorical_insights, boolean) y vendedorpreguntaocasionuso (performance, checklist, enum Si/No/N-A) son DOS MEDICIONES INDEPENDIENTES de si el vendedor pregunto la ocasion de uso -no son la misma columna con dos nombres, ni intercambiables-. Verificado contra Postgres QA (cruce por conversation_id): coinciden en aproximadamente el 72,5% de los casos (false/No=9.210, true/Si=5.569); discrepan en el resto (false/N-A=3.622, true/No=919, false/Si=878, true/N-A=147). Encontrado como causa raiz de un error real del agente (ver README.md > "Actualizacion automatica del Data Map", primera corrida real de Mens Fashion, pregunta q16_tasa_compra_segun_pregunta_ocasion del banco dorado): el agente a veces cruzaba (JOIN) ambos campos como si fueran la misma medicion, dando un resultado distinto al pedido. REGLA: usar SIEMPRE hubo_pregunta_ocasion_de_uso (categorical_insights) como fuente primaria para esta pregunta de negocio -es la que usa el banco dorado verificado-; si se necesita la version del checklist, usar vendedorpreguntaocasionuso explicitamente y aclarar que es una lectura distinta, nunca cruzar ambas como si coincidieran.'
  lost_sale_product: resultado_producto = 'no_comprado' habilita motivo_venta_perdida_producto.
  bought_product: Para compra por producto preferir se_compro IS TRUE y mostrar resultado_producto para auditar consistencia.
  objection_handling: objecion_principal identifica la objeción; hubo_manejo_objecion habilita resultado_manejo_objecion.
  made_to_measure: hubo_ofrecimiento_a_medida habilita resultado_a_medida; excluir no_aplica al medir efectividad.
  cashback: 'Antes de leer primer_mencion_cashback o conducta_vendedor_cashback, filtrar por IS NOT NULL: en ~85% de
    las filas el cashback no fue evaluado (no es lo mismo NULL que no_mencionado/false). Una conjunción sobre llegada
    y primera mención exige cliente_llega_con_cashback_para_usar IS TRUE y primer_mencion_cashback con el valor
    pedido. Si además se cruza con performance.vendedorinformocashback20porciento (ver joins.cashback_cross_check),
    declarar explícitamente si la tasa resultante incluye o excluye las filas de performance con valor NULL: incluirlas
    (tratar "no evaluado" como "no informó") da un número; excluirlas (sólo casos con checklist evaluado) da otro,
    y la diferencia puede superar 10 puntos porcentuales. No reportar una sola cifra sin decir cuál convención se usó.'
  inventory: solucion_ante_falta describe la respuesta; una brecha textual requiere descriptive_product_insights unido por
    conversation_id + producto_index.
  cascada_a_medida_no_confiable: 'vendedordestacaventajasconfeccionmedida = ''No'' NO es un conteo confiable de
    incumplimiento real: ver fields.performance.vendedordestacaventajasconfeccionmedida.reliability_warning. Antes de
    responder cuántas veces "no se destacaron ventajas" (o calcular una tasa con este campo), advertir que el
    indicador está inflado por una cascada semántica que la extracción no respeta de forma consistente.'
  legacy_performance_fields: vendedorexplicoprogramadelealtad y vendedormencionoprogramadelealtad no están en el
    checklist v10 vigente. Sólo usarlos si el usuario pregunta explícitamente por "programa de lealtad" o pide una
    lectura histórica; aclarar en la respuesta que es un criterio legado, no evaluado por el checklist actual.
  motivador_visita_taxonomy: antes de filtrar por un valor puntual, considerar que hay múltiples generaciones de taxonomía
    (ver fields.motivador_visita.taxonomy_drift). Si la pregunta es sobre el período reciente, preferir los valores
    de configured_values (taxonomía v8 vigente); si es histórica o agregada, puede requerir ambos conjuntos.
joins:
  general_evidence:
    left: categorical_insights
    right: descriptive_insights
    keys:
    - conversation_id
    cardinality: conversation_to_conversation
  product_evidence:
    left: categorical_product_insights
    right: descriptive_product_insights
    keys:
    - conversation_id
    - producto_index
    cardinality: product_to_product
  cashback_cross_check:
    left: categorical_insights
    right: performance
    keys:
    - conversation_id
    cardinality: conversation_to_conversation
    note: 'Cruza "mencionó cashback" en insights (categorical_insights.primer_mencion_cashback/conducta_vendedor_cashback)
      con la evaluación del vendedor en checklist (performance.vendedorinformocashback20porciento, criterio VendedorInformoCashback en v10)
      — son lecturas independientes. Ver semantic_dependencies.cashback sobre cómo tratar los NULL de performance en
      este cruce antes de calcular una tasa.'
  rule: No usar CROSS JOIN para asociar evidencia. Si falta una clave, no atribuir el texto al grupo categórico.
sources:
  demography:
    source: dashboard_v2.vw_mens_fashion_demografia
    use_when: 'Características de las conversaciones y clientes: interacción, género, destinatario, tipo, necesidad, decisión,
      precio y urgencia.'
    grain: Una fila por conversación.
    profile: standard_conversation
    fields:
      tipointeraccion:
        configured_values: &tipointeraccion_generico
        - cambio
        - compra
        - no_compra
        - queja
        observed_values: *tipointeraccion_generico
        type: text
        nullable: false
        description: 'Resultado operativo de la interacción según el insights: compra, no_compra, cambio o queja.
          Es la copia de tipo_interaccion en esta vista (misma fuente, mismo campo).'
        operations:
        - filter
        - group
        - compare
      genero_cliente:
        configured_values: &genero_cliente
        - femenino
        - masculino
        - no_claro
        observed_values: *genero_cliente
        type: text
        nullable: false
        description: 'Género del cliente. Sólo masculino/femenino con evidencia razonable (nunca por estereotipo
          o tipo de producto); si no hay evidencia clara, no_claro.'
        operations:
        - filter
        - group
        - compare
      cliente_compra_para:
        configured_values: &cliente_compra_para
        - no_claro
        - regalo
        - si_mismo
        - tercero
        observed_values: *cliente_compra_para
        type: text
        nullable: false
        description: 'Destinatario de la compra: si_mismo (el propio cliente), regalo (obsequio explícito), tercero
          (uso funcional de otra persona sin ser regalo), o no_claro si la evidencia es insuficiente o contradictoria.'
        operations:
        - filter
        - group
        - compare
      tipo_cliente:
        configured_values: &tipo_cliente
        - no_claro
        - nuevo
        - recurrente
        observed_values: *tipo_cliente
        type: text
        nullable: false
        description: 'nuevo = primera visita o poca familiaridad; recurrente = hay evidencia de compras previas o
          trato habitual; no_claro si la evidencia es insuficiente.'
        operations:
        - filter
        - group
        - compare
      perfil_necesidad:
        configured_values: &perfil_necesidad
        - casual
        - evento
        - exploracion
        - no_claro
        - reposicion
        - trabajo
        observed_values: *perfil_necesidad
        type: text
        nullable: false
        description: 'Necesidad dominante que organiza la visita: evento, trabajo, casual, reposicion (reemplazar/renovar
          algo conocido), exploracion (búsqueda abierta sin necesidad definida), o no_claro si no es sostenible.'
        operations:
        - filter
        - group
        - compare
      nivel_decision_cliente:
        configured_values: &nivel_decision_cliente
        - comparando
        - decidido
        - indeciso
        - no_claro
        observed_values: *nivel_decision_cliente
        type: text
        nullable: false
        description: 'decidido = decisión fuerte o muy encaminada; comparando = evalúa opciones activamente (no implica
          indecisión); indeciso = duda sin avanzar con claridad; no_claro si la evidencia es insuficiente.'
        operations:
        - filter
        - group
        - compare
      sensibilidad_precio_general:
        configured_values: &sensibilidad_precio_general
        - alta
        - baja
        - media
        - no_claro
        observed_values: *sensibilidad_precio_general
        type: text
        nullable: false
        description: Nivel de sensibilidad del cliente frente al precio en la conversación completa (no admite null,
          a diferencia de sensibilidad_precio a nivel producto que sí puede ser null).
        operations:
        - filter
        - group
        - compare
      urgencia_general:
        configured_values: &urgencia_general
        - inmediata
        - no_claro
        - planeada
        observed_values: *urgencia_general
        type: text
        nullable: false
        description: Urgencia temporal general de la necesidad del cliente, coherente con las urgencias observadas
          por producto (no admite null a este nivel general).
        operations:
        - filter
        - group
        - compare
  performance:
    source: dashboard_v2.vw_mens_fashion_rendimiento_vendedor
    use_when: Criterios estructurados de desempeño del vendedor (checklist Sí/No/N/A), auditados por etapa de la
      atención (recepción, investigación, asesoría, complementos, manejo de objeciones, cierre, conocimiento del
      producto).
    grain: Una fila por conversación con múltiples columnas de criterios.
    profile: standard_conversation
    decision_semantics: Todos los campos de esta vista (salvo los marcados legacy) admiten únicamente Sí, No o N/A,
      con la misma lógica de desempate en las 27 columnas -> "Sí" = el vendedor tuvo una oportunidad real y hay
      evidencia clara de que cumplió; "No" = tuvo una oportunidad real y suficiente pero no cumplió o cumplió de
      forma insuficiente; "N/A" = no tuvo una oportunidad real (faltó la etapa/el disparador, el cliente resolvió
      espontáneamente antes de que correspondiera actuar, la conversación terminó antes, o la responsabilidad pasó
      a otro empleado). Verificado empíricamente que N/A aparece en la práctica en columnas que antes se creían
      binarias.
    fields:
      vendedoramable:
        configured_values: &si_no_na
        - Sí
        - 'No'
        - N/A
