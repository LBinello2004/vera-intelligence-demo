  categorical_insights:
    source: dashboard_v2.vw_mens_fashion_insights_categoricos_generales
    use_when: Resultados y hallazgos categóricos generales de la conversación.
    grain: Una fila por conversación.
    data_quality_note: 'Esta vista tiene ~2.092 filas con conversation_id NULL (verificado 2026-08-28:
      21771 filas totales vs 19679 conversation_id distintos no nulos para Mens Fashion) - parecen
      registros huérfanos de algún problema de ETL aguas arriba, no conversaciones reales. Un COUNT(*)
      sin filtrar las cuenta como si fueran conversaciones válidas e infla cualquier total/porcentaje
      ~10%. SIEMPRE usar COUNT(DISTINCT conversation_id) en esta vista (ya lo pide
      sql_rules.conversation_population), nunca COUNT(*) a secas. Encontrado auditando una discrepancia
      real entre una respuesta de vi_agent.py y el banco de preguntas de evaluación (ver
      Preguntas/preguntas_evaluacion_mens_fashion.yaml#q05).'
    profile: standard_conversation
    fields:
      tipo_interaccion:
        configured_values: *tipointeraccion_generico
        observed_values: *tipointeraccion_generico
        type: text
        nullable: true
        description: 'Clasificación del desenlace: compra (se compra al menos un producto nuevo), no_compra
          (interacción comercial sin compra), cambio o queja (sólo si son el objetivo principal). Un reemplazo
          dentro de un cambio no cuenta como compra; si además del cambio se compra algo nuevo, prevalece compra.'
        operations:
