        observed_values:
        - false
        - true
        description: Indica si se mencionó una marca o alternativa competidora.
        operations:
        - filter
        - group
        - compare
      hubo_mencion_a_medida:
        type: boolean
        observed_values:
        - false
        - true
        description: Indica si apareció la confección a medida en la conversación.
        operations:
        - filter
        - group
        - compare
      hubo_ofrecimiento_a_medida:
        type: boolean
        observed_values:
        - false
        - true
        description: Indica si el vendedor ofreció activamente confección a medida.
        operations:
