metadata:
  name: VI Data Map Mens Fashion V2
  version: 2.0.0-draft
  client: Mens Fashion
  model_target: Gemini 3.7
  generated_at: '2026-08-28'
  scope: Sólo seis vistas dashboard_v2 de Mens Fashion; enviar el YAML completo tras resolver el cliente por Langfuse/MCP.
decision_flow:
- Identificar si la pregunta es general de conversación o específica de producto.
- Elegir una sola familia primaria según routing; sumar una segunda fuente sólo si la pregunta exige evidencia y existe join
  declarado.
- Resolver profile, grano, tenant y fecha antes de escribir SQL.
- Elegir campos físicos exactos y valores observados; después construir filtros y agregaciones.
- Verificar que cada condición explícita de la pregunta aparezca en SELECT, WHERE, GROUP BY o cálculo.
routing:
  demography:
    questions: quién es el cliente, cómo llega, para quién compra, necesidad, decisión, precio o urgencia
    avoid: no usar para motivos comerciales detallados ni evaluación del vendedor
  performance:
    questions: criterios, cumplimiento, incumplimiento, fortalezas, debilidades, ranking o evolución del vendedor
    avoid: no usar textos narrativos como si fueran criterios
  categorical_insights:
    questions: resultado general, venta perdida, motivador, cashback, competencia, a medida, cierre o cantidades
    avoid: no usar para ejemplos o explicaciones textuales
  descriptive_insights:
    questions: por qué, cómo fue la ejecución, ejemplos, errores, mejores prácticas o acciones sugeridas
    avoid: no agrupar ni calcular frecuencia de textos
  categorical_product_insights:
    questions: producto, compra, ocasión, fit, talla, color, objeción, inventario, complementarios o a medida por producto
    avoid: no afirmar ventas transaccionales
  descriptive_product_insights:
    questions: ejemplos y explicaciones narrativas de un producto
    avoid: no usar sin la vista categórica cuando la condición del producto debe comprobarse físicamente
profiles:
  standard_conversation:
    row_key: conversation_id
    tenant_field: seller_id
    date_field: uploaded_at_local
    optional_dimensions:
    - store_id
    - store_name
    - sector_id
    - sector_name
    - employee_id
    - employee_full_name
    quality_filter: usefulforanalysis IS TRUE cuando la pregunta se refiera a conversaciones analizables.
  descriptive_conversation:
    row_key: conversation_id
    tenant_field: seller
    date_field: date
    optional_dimensions: []
    quality_filter: 'No asumir usefulforanalysis: esta vista no lo expone.'
sql_rules:
  scope: Usar únicamente sources[].source. Nunca consultar otra vista, schema o cliente.
  read_only: Un único SELECT o WITH...SELECT; parámetros psycopg; sin interpolar texto del usuario; LIMIT 200 para detalle.
  tenant: Aplicar el valor exacto autorizado de sesión sobre profiles[profile].tenant_field; no inferirlo del texto de la
    pregunta.
  time: Filtrar profiles[profile].date_field sólo cuando el usuario indique un período. No inventar ventanas temporales.
  conversation_population: COUNT(DISTINCT conversation_id).
  product_population: COUNT(DISTINCT (conversation_id, producto_index)).
  performance_rate: cumplimientos / base_evaluada; base = conversaciones distintas con valor Sí o No; excluir N/A y null.
  categorical_filters: Usar valores de observed_values respetando tipo, mayúsculas y acentos; excluir null/no_aplica de rankings
    salvo pedido explícito.
  free_text: Seleccionar como evidencia con claves y fecha. Nunca GROUP BY, COUNT o ranking por texto narrativo.
semantic_dependencies:
  lost_sale_general: hubo_venta_perdida IS TRUE habilita motivo_principal_venta_perdida; excluir no_aplica.
  lost_sale_product: resultado_producto = 'no_comprado' habilita motivo_venta_perdida_producto.
  bought_product: Para compra por producto preferir se_compro IS TRUE y mostrar resultado_producto para auditar consistencia.
  objection_handling: objecion_principal identifica la objeción; hubo_manejo_objecion habilita resultado_manejo_objecion.
  made_to_measure: hubo_ofrecimiento_a_medida habilita resultado_a_medida; excluir no_aplica al medir efectividad.
  cashback: Una conjunción sobre llegada y primera mención exige cliente_llega_con_cashback_para_usar IS TRUE y primer_mencion_cashback
    con el valor físico pedido.
  inventory: solucion_ante_falta describe la respuesta; una brecha textual requiere descriptive_product_insights unido por
    conversation_id + producto_index.
joins:
  general_evidence:
    left: categorical_insights
    right: descriptive_insights
    keys:
    - conversation_id
    cardinality: conversation_to_conversation
  product_evidence:
    left: categorical_product_insights
    right: descriptive_product_insights
    keys:
    - conversation_id
    - producto_index
    cardinality: product_to_product
  rule: No usar CROSS JOIN para asociar evidencia. Si falta una clave, no atribuir el texto al grupo categórico.
sources:
  demography:
    source: dashboard_v2.vw_mens_fashion_demografia
    use_when: 'Características de las conversaciones y clientes: interacción, género, destinatario, tipo, necesidad, decisión,
      precio y urgencia.'
    grain: Una fila por conversación.
    profile: standard_conversation
    fields:
      tipointeraccion:
        observed_values:
        - cambio
        - compra
        - no_compra
        - queja
        type: text
        description: 'Resultado operativo de la interacción: compra, no compra o cambio.'
        operations:
        - filter
        - group
        - compare
      genero_cliente:
        observed_values:
        - femenino
        - masculino
        - no_claro
        type: text
        description: Género inferido o declarado del cliente; puede ser no_identificado.
        operations:
        - filter
        - group
        - compare
      cliente_compra_para:
        observed_values:
        - no_claro
        - regalo
        - si_mismo
        - tercero
        type: text
        description: 'Persona destinataria de la compra: el propio cliente u otra persona.'
        operations:
        - filter
        - group
        - compare
      tipo_cliente:
        observed_values:
        - no_claro
        - nuevo
        - recurrente
        type: text
        description: Clasificación del cliente según su relación o comportamiento observado.
        operations:
        - filter
        - group
        - compare
      perfil_necesidad:
        observed_values:
        - casual
        - evento
        - exploracion
        - no_claro
        - reposicion
        - trabajo
        type: text
        description: Necesidad principal que organiza la visita, como evento, reposición, exploración o uso casual.
        operations:
        - filter
        - group
        - compare
      nivel_decision_cliente:
        observed_values:
        - comparando
        - decidido
        - indeciso
        - no_claro
        type: text
        description: Madurez de la decisión de compra observada durante la conversación.
        operations:
        - filter
        - group
        - compare
      sensibilidad_precio_general:
        observed_values: &id002
        - alta
        - baja
        - media
        - no_claro
        type: text
        description: Nivel de sensibilidad del cliente frente al precio en la conversación completa.
        operations:
        - filter
        - group
        - compare
      urgencia_general:
        observed_values: &id004
        - inmediata
        - no_claro
        - planeada
        type: text
        description: Urgencia temporal general de la necesidad del cliente.
        operations:
        - filter
        - group
        - compare
