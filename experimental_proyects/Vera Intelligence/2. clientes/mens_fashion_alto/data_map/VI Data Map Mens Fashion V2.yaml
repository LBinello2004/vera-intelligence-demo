      evaluacion_ejecucion_vendedor:
        type: text
        description: Evaluación narrativa de cómo actuó el vendedor; no es una tasa de cumplimiento.
        operations:
        - select_evidence
      mejores_practicas_detectadas:
        type: text
        description: Prácticas positivas observadas en la conversación.
        operations:
        - select_evidence
      errores_principales_detectados:
        type: text
        description: Errores de ejecución relevantes observados.
        operations:
        - select_evidence
      insight_cruzado_principal:
        type: text
        description: Hallazgo narrativo que conecta necesidad, producto, ejecución y resultado.
        operations:
        - select_evidence
      accion_sugerida:
        type: text
        description: Acción concreta sugerida a partir de la conversación.
