  descriptive_product_insights:
    source: dashboard_v2.vw_mens_fashion_insights_descriptivos_por_producto
    use_when: Evidencia y explicación textual por producto.
    grain: Una fila por conversation_id + producto_index; texto libre no agregable como categoría.
    profile: standard_conversation
    fields:
      producto_index:
        type: integer
        description: Índice del producto; unir con la vista categórica usando conversation_id + producto_index.
        operations:
        - join_key
        - filter
      resumen_producto:
        type: text
        description: Síntesis narrativa de necesidad, interacción y resultado del producto.
        operations:
        - select_evidence
      preferencias_cliente_producto:
        type: text
        description: Preferencias textuales de talla, color, estilo, fit u ocasión.
        operations:
        - select_evidence
      brechas_de_inventario_producto:
        type: text
        description: Detalle de faltantes o desajustes de inventario relevantes.
        operations:
        - select_evidence
      sensibilidad_precio_y_umbral_producto:
        type: text
        description: Evidencia textual sobre sensibilidad y umbral de precio.
        operations:
        - select_evidence
      objeciones_y_respuesta_vendedor_producto:
        type: text
        description: Objeciones del producto y respuesta concreta del vendedor.
        operations:
        - select_evidence
      complementarios_y_paquete_producto:
        type: text
        description: Detalle de complementarios, outfit o paquete ofrecido.
        operations:
        - select_evidence
      rol_de_a_medida_producto:
        type: text
        description: Explicación del papel de la confección a medida para este producto.
        operations:
        - select_evidence
      resultado_final_producto:
        type: text
        description: Explicación narrativa del desenlace del producto.
        operations:
        - select_evidence
      accion_sugerida_producto:
        type: text
        description: Acción sugerida para mejorar la gestión de este producto o caso similar.
        operations:
        - select_evidence
limitations:
- Compra y resultado son inferencias conversacionales, no tickets ni ventas certificadas.
- Los valores observados reflejan PostgreSQL QA al construir el mapa y pueden ampliarse.
- El mapa no responde organización, conectividad, gamificación, roleplays ni dominios de otros clientes.
