metadata:
  name: VI Data Map Mens Fashion V1
  version: 1.0.0-draft
  client: Mens Fashion
  generated_at: '2026-08-28'
  generated_from: VI Data Map V12.yaml + information_schema
  scope: Sólo dashboard_v2 de Mens Fashion. Diseñado para entregar completo en el contexto del cliente.
routing:
  demografía: demography
  criterios_cumplimiento_desempeño: performance
  resultados_motivos_flags_generales: categorical_insights
  explicaciones_evidencia_general: descriptive_insights
  atributos_resultados_por_producto: categorical_product_insights
  explicaciones_evidencia_por_producto: descriptive_product_insights
sql_contract:
  scope: Usar exclusivamente las seis fuentes dashboard_v2 declaradas abajo; ninguna fuente transversal ni vista de otro cliente.
  safety: Generar un único SELECT o WITH...SELECT read-only; sin DDL/DML; parámetros psycopg %(nombre)s; LIMIT 200 sólo para
    detalle.
  tenant: El tenant exacto proviene de la sesión. Aplicarlo sobre physical_context.tenant antes de agrupar o limitar; no inferir
    ni cambiar mayúsculas.
  time: Aplicar fechas sólo si la pregunta lo pide, sobre physical_context.date y con parámetros. No inventar períodos.
  physical_names: Usar literalmente source, physical_context, common_fields y business_fields; no traducir nombres físicos.
  categorical_values: Para filtros usar sólo observed_values con tipo, mayúsculas y acentos exactos. Si el mapeo es ambiguo,
    devolver distribución; no inventar literales.
  not_applicable: Excluir null, N/A, n/a y no_aplica de rankings o motivos salvo pedido explícito; mostrarlos aparte sólo
    si aportan contexto.
  enabling_flags: Para motivos o detalles condicionados, aplicar primero la bandera booleana habilitante de la misma fuente
    cuando exista.
  grain: Población de conversación = COUNT(DISTINCT conversation_id). Población de producto = COUNT(DISTINCT (conversation_id,
    producto_index)).
  performance: Convertir únicamente los business_fields de performance a filas criterio/valor. Cumplimiento y base se calculan
    con conversaciones distintas sobre valores evaluables; excluir N/A y null.
  descriptive_text: Devolver texto como evidencia con row_key y fecha; no hacer GROUP BY ni frecuencia de textos libres.
  joins: 'Unir fuentes sólo por claves compartidas declaradas: conversation_id y, para producto, producto_index. Prohibido
    CROSS JOIN de textos y agregados.'
