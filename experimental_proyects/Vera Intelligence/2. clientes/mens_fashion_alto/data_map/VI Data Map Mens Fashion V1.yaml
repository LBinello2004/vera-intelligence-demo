limitations:
- Las señales de compra describen lo detectado en conversaciones; no sustituyen ventas transaccionales.
- Los valores observados ayudan a construir filtros físicos, pero pueden cambiar con nuevas cargas.
- El mapa no contiene dominios transversales, organización, conectividad, gamificación, roleplays ni datos de otros clientes.
