client_id: mens_fashion
display_name: "Men's Fashion"
tenant: "Mens Fashion"
model: gemini-3.7-flash
data_map: "2. clientes/mens_fashion_alto/data_map/VI Data Map Mens Fashion V9.yaml"

# Cada fuente declara el campo que debe contener el tenant autorizado. El
# validador SQL exige el filtro de forma deterministica antes de ejecutar.
sources:
  dashboard_v2.vw_mens_fashion_demografia:
    tenant_field: seller_id
  dashboard_v2.vw_mens_fashion_rendimiento_vendedor:
    tenant_field: seller_id
  dashboard_v2.vw_mens_fashion_insights_categoricos_generales:
    tenant_field: seller_id
  dashboard_v2.vw_mens_fashion_insights_descriptivos_generales:
    tenant_field: seller
  dashboard_v2.vw_mens_fashion_insights_categoricos_por_producto:
    tenant_field: seller_id
  dashboard_v2.vw_mens_fashion_insights_descriptivos_por_producto:
    tenant_field: seller_id

# Búsqueda semántica sobre conversaciones vectorizadas (prototipo conectado 2026-09-10, ver
# "6. busqueda_vectorial/README.md"). No declara tenant_field ni tabla: el aislamiento por
# seller_id y la tabla física son fijos en vector_search.py, no configurables por cliente.
vector_search:
  top_k: 5

# Fuentes semanticas autorizadas. El agente no puede listar ni solicitar otros
# contenidos de Langfuse; siempre resuelve la version marcada production.
business_rulebooks:
  sales_evaluation:
    name: "clientes/Haber/Mens Fashion/checklist"
    label: production
    business_scope: "Criterios de atención y desempeño del vendedor"
  conversation_insights:
    name: "clientes/Haber/Mens Fashion/insights"
    label: production
    business_scope: "Criterios de resultados, motivos y comportamiento comercial"
  # Piloto (2026-09-11) -source local, NO Langfuse: contenido versionado en este mismo repo
  # ("2. clientes/_shared/business_rulebooks/coaching_playbook.md"), borrador técnico sin revisión
  # del equipo de negocio todavía. Ver README de "3. experimentos/coaching_playbook/".
  coaching_playbook:
    source: local
    path: "2. clientes/_shared/business_rulebooks/coaching_playbook.md"
    business_scope: "Recomendaciones de coaching y desarrollo de vendedores según su desempeño (bajo o alto)"
