  - id: q25_cascada_na_confeccion_medida
    es_trampa: true
    pregunta: ¿En cuántas conversaciones el vendedor no destacó las ventajas de la confección a medida, teniendo la oportunidad real de hacerlo?
    fuentes_requeridas: [performance]
    requisitos:
    - 'TRAMPA / HALLAZGO GRAVE DE CALIDAD DE DATOS (2026-08-31): el checklist define que
      vendedordestacaventajasconfeccionmedida debe ser N/A siempre que vendedormencionoconfeccionamedida
      sea N/A (cascada semántica: sin mención previa no hay "oportunidad real" de destacar ventajas).
      Verificado contra Postgres: quien puebla el checklist NO respeta esta cascada de forma confiable
      — quedan 6.106 filas con vendedormencionoconfeccionamedida=N/A, y de esas, 4.360 (71%) tienen
      vendedordestacaventajasconfeccionmedida=''No'' en vez de ''N/A'' (sólo 1.746 sí quedaron N/A, y 4
      quedaron ''Sí''). Esto significa que un conteo ingenuo de "No" en este campo SOBRESTIMA
      fuertemente los casos de incumplimiento real: la mayoría de esos "No" en realidad no tuvieron
      ninguna oportunidad real (el vendedor nunca mencionó la confección a medida). Una respuesta
      correcta no puede reportar el conteo crudo de "No" sin esta advertencia.'
    - Este NO es un problema de SQL corregible por VI — es una limitación de los datos de origen (la
      extracción no aplica su propia regla de cascada de forma consistente). Lo correcto es que el
      agente lo señale como limitación de confiabilidad del indicador en vez de reportar el número sin
      matices.
    sql: |
      SELECT
        COUNT(*) FILTER (
          WHERE vendedormencionoconfeccionamedida = 'N/A'
            AND vendedordestacaventajasconfeccionmedida <> 'N/A'
        ) AS violaciones_cascada,
        COUNT(*) FILTER (WHERE vendedormencionoconfeccionamedida = 'N/A') AS base_na
      FROM dashboard_v2.vw_mens_fashion_rendimiento_vendedor
      WHERE seller_id = 'Mens Fashion'
    respuesta_esperada: 'No hay un número "limpio" — el indicador vendedordestacaventajasconfeccionmedida=No está inflado: 4.360 de 6.106 filas (71%) que deberían ser N/A según la propia regla del checklist están marcadas No. Una respuesta correcta señala esta limitación de confiabilidad en vez de dar un conteo crudo con falsa precisión.'

  - id: q26_evidencia_venta_perdida_precio
    pregunta: Dame el resumen de 2 o 3 conversaciones donde se perdió la venta por precio, para entender qué pasó.
    fuentes_requeridas: [categorical_insights, descriptive_insights]
    omit_from_numeric_gate: true
    requisitos:
    - Requiere el join general_evidence declarado en el Data Map (categorical_insights +
      descriptive_insights por conversation_id), filtrando hubo_venta_perdida IS TRUE AND
      motivo_principal_venta_perdida = 'precio', y trayendo texto libre (resumen_ejecutivo_conversacion,
      que_no_estamos_resolviendo) como evidencia — no agregado, no rankeado, sólo unas pocas filas.
    - 'No hay RAG en este MVP: la única forma de traer "resúmenes de conversaciones" es vía SQL sobre
      las vistas descriptivas, no buscando en las transcripciones originales.'
    - 'CORRECCIÓN post-evaluación: al unir dos fuentes hay que filtrar el tenant en AMBAS, calificado
      por alias — sql_security.py lo exige explícitamente cuando hay más de una tabla en la consulta.
      El profile descriptive_conversation usa seller (no seller_id) como tenant_field para
      descriptive_insights; la primera versión de este SQL sólo filtraba ci.seller_id y quedaba
      rechazada por el validador.'
    sql: |
      SELECT ci.conversation_id, di.resumen_ejecutivo_conversacion, di.que_no_estamos_resolviendo
      FROM dashboard_v2.vw_mens_fashion_insights_categoricos_generales ci
      JOIN dashboard_v2.vw_mens_fashion_insights_descriptivos_generales di
        ON ci.conversation_id = di.conversation_id
      WHERE ci.seller_id = 'Mens Fashion'
        AND di.seller = 'Mens Fashion'
        AND ci.hubo_venta_perdida IS TRUE
        AND ci.motivo_principal_venta_perdida = 'precio'
      LIMIT 3
    respuesta_esperada: 'Cualquiera de las filas reales que unan ambas vistas por conversation_id con esos filtros; ver Preguntas/resultados_evaluacion.json para los 3 ejemplos verificados el 2026-08-31 (todas describen clientes que no cerraron por precio/paquete sin confirmar).'

