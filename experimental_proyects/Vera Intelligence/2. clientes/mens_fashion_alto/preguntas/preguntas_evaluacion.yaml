  # agregación por vendedor a través de TODOS los criterios (no un campo
  # puntual), ranking de tiendas, cascadas semánticas N/A, joins de evidencia
  # categórica+descriptiva, y un periodo de fecha explícito.

  - id: q21_peores_vendedores_cumplimiento_general
    pregunta: ¿Quiénes son mis tres peores vendedores en términos de rendimiento?
    fuentes_requeridas: [performance]
    requisitos:
    - 'Rendimiento "general" implica agregar sobre TODOS los criterios vigentes del checklist (25
      campos), no sobre uno solo. Requiere "unpivotear" las 25 columnas Sí/No/N/A por vendedor:
      tasa = Sí / (Sí+No), excluyendo N/A y null en cada criterio individual.'
    - Excluir los 2 campos legacy (vendedorexplicoprogramadelealtad, vendedormencionoprogramadelealtad)
      del cálculo general — no son parte del checklist vigente (ver Data Map).
    - Aplicar un piso de volumen razonable (ej. >=20 conversaciones) para no rankear a alguien con 1-2
      conversaciones evaluadas como "el peor". No hay un piso "correcto" único, pero debe existir
      alguno y debe decirlo explícitamente.
    - Agrupar por vendedor (employee_id, no sólo por nombre — dos personas distintas podrían compartir
      nombre; el Data Map no expone employee_id como campo de negocio pero SQL puede agrupar por él
      internamente).
    - 'CORRECCIÓN post-evaluación (2026-08-31): la primera versión de este SQL usaba un CTE con 25
      UNION ALL (una por criterio) para "unpivotear" los campos. Es funcionalmente correcta pero
      sql_security.py la rechaza: al referenciar la misma tabla 25 veces sin alias, exige un filtro de
      tenant calificado por alias en cada una, que un WHERE sin calificar no satisface. La query real
      que generó el agente (y que sí pasa la validación) suma los criterios con CASE WHEN dentro de un
      único FROM/WHERE — ese es el patrón correcto para este tipo de agregación y el que quedó abajo.'
    sql: |
      WITH agg AS (
        SELECT employee_id, employee_full_name,
               COUNT(DISTINCT conversation_id) AS conversaciones,
               SUM((CASE WHEN vendedoramable = 'Sí' THEN 1 ELSE 0 END) + (CASE WHEN vendedorsepresenta = 'Sí' THEN 1 ELSE 0 END) +
                   (CASE WHEN vendedorrealizocierrecompra = 'Sí' THEN 1 ELSE 0 END) + (CASE WHEN vendedorofrecioasistencia = 'Sí' THEN 1 ELSE 0 END) +
                   (CASE WHEN vendedorofreciotomarmedidas = 'Sí' THEN 1 ELSE 0 END) + (CASE WHEN vendedormuestraprendas = 'Sí' THEN 1 ELSE 0 END) +
                   (CASE WHEN vendedormencionadescuentos = 'Sí' THEN 1 ELSE 0 END) + (CASE WHEN vendedoragradecioeinvitovolver = 'Sí' THEN 1 ELSE 0 END) +
                   (CASE WHEN vendedorconfirmoenvioticketemail = 'Sí' THEN 1 ELSE 0 END) + (CASE WHEN vendedorofreciomesessinintereses = 'Sí' THEN 1 ELSE 0 END) +
                   (CASE WHEN vendedorsugiriocomplementos = 'Sí' THEN 1 ELSE 0 END) + (CASE WHEN vendedorpreguntaocasionuso = 'Sí' THEN 1 ELSE 0 END) +
                   (CASE WHEN vendedormencionobeneficiosprendas = 'Sí' THEN 1 ELSE 0 END) + (CASE WHEN vendedormencionoconfeccionamedida = 'Sí' THEN 1 ELSE 0 END) +
                   (CASE WHEN vendedorinvitoaencuestasatisfaccion = 'Sí' THEN 1 ELSE 0 END) + (CASE WHEN vendedormencionanuevoslanzamientos = 'Sí' THEN 1 ELSE 0 END) +
                   (CASE WHEN vendedormencionotrescomplementos = 'Sí' THEN 1 ELSE 0 END) + (CASE WHEN conocimientosuficiente = 'Sí' THEN 1 ELSE 0 END) +
                   (CASE WHEN vendedorrecomiendasegunocasionuso = 'Sí' THEN 1 ELSE 0 END) + (CASE WHEN vendedordestacaventajasconfeccionmedida = 'Sí' THEN 1 ELSE 0 END) +
                   (CASE WHEN vendedorpreguntapreferenciascliente = 'Sí' THEN 1 ELSE 0 END) + (CASE WHEN vendedorofrecesolucionantefaltadeproducto = 'Sí' THEN 1 ELSE 0 END) +
                   (CASE WHEN vendedorofrecebeneficiosanteobjeccionprecio = 'Sí' THEN 1 ELSE 0 END) + (CASE WHEN vendedorofrecesolucionanteobjeccioncomosevesiente = 'Sí' THEN 1 ELSE 0 END) +
                   (CASE WHEN vendedorinformocashback20porciento = 'Sí' THEN 1 ELSE 0 END)) AS cumplidos,
               SUM((CASE WHEN vendedoramable IN ('Sí','No') THEN 1 ELSE 0 END) + (CASE WHEN vendedorsepresenta IN ('Sí','No') THEN 1 ELSE 0 END) +
                   (CASE WHEN vendedorrealizocierrecompra IN ('Sí','No') THEN 1 ELSE 0 END) + (CASE WHEN vendedorofrecioasistencia IN ('Sí','No') THEN 1 ELSE 0 END) +
                   (CASE WHEN vendedorofreciotomarmedidas IN ('Sí','No') THEN 1 ELSE 0 END) + (CASE WHEN vendedormuestraprendas IN ('Sí','No') THEN 1 ELSE 0 END) +
                   (CASE WHEN vendedormencionadescuentos IN ('Sí','No') THEN 1 ELSE 0 END) + (CASE WHEN vendedoragradecioeinvitovolver IN ('Sí','No') THEN 1 ELSE 0 END) +
                   (CASE WHEN vendedorconfirmoenvioticketemail IN ('Sí','No') THEN 1 ELSE 0 END) + (CASE WHEN vendedorofreciomesessinintereses IN ('Sí','No') THEN 1 ELSE 0 END) +
                   (CASE WHEN vendedorsugiriocomplementos IN ('Sí','No') THEN 1 ELSE 0 END) + (CASE WHEN vendedorpreguntaocasionuso IN ('Sí','No') THEN 1 ELSE 0 END) +
                   (CASE WHEN vendedormencionobeneficiosprendas IN ('Sí','No') THEN 1 ELSE 0 END) + (CASE WHEN vendedormencionoconfeccionamedida IN ('Sí','No') THEN 1 ELSE 0 END) +
                   (CASE WHEN vendedorinvitoaencuestasatisfaccion IN ('Sí','No') THEN 1 ELSE 0 END) + (CASE WHEN vendedormencionanuevoslanzamientos IN ('Sí','No') THEN 1 ELSE 0 END) +
                   (CASE WHEN vendedormencionotrescomplementos IN ('Sí','No') THEN 1 ELSE 0 END) + (CASE WHEN conocimientosuficiente IN ('Sí','No') THEN 1 ELSE 0 END) +
                   (CASE WHEN vendedorrecomiendasegunocasionuso IN ('Sí','No') THEN 1 ELSE 0 END) + (CASE WHEN vendedordestacaventajasconfeccionmedida IN ('Sí','No') THEN 1 ELSE 0 END) +
                   (CASE WHEN vendedorpreguntapreferenciascliente IN ('Sí','No') THEN 1 ELSE 0 END) + (CASE WHEN vendedorofrecesolucionantefaltadeproducto IN ('Sí','No') THEN 1 ELSE 0 END) +
                   (CASE WHEN vendedorofrecebeneficiosanteobjeccionprecio IN ('Sí','No') THEN 1 ELSE 0 END) + (CASE WHEN vendedorofrecesolucionanteobjeccioncomosevesiente IN ('Sí','No') THEN 1 ELSE 0 END) +
                   (CASE WHEN vendedorinformocashback20porciento IN ('Sí','No') THEN 1 ELSE 0 END)) AS base_evaluada
        FROM dashboard_v2.vw_mens_fashion_rendimiento_vendedor
        WHERE seller_id = 'Mens Fashion' AND employee_full_name IS NOT NULL
        GROUP BY employee_id, employee_full_name
        HAVING COUNT(DISTINCT conversation_id) >= 20
      )
      SELECT employee_full_name, conversaciones, cumplidos, base_evaluada,
             ROUND(cumplidos::numeric / NULLIF(base_evaluada, 0), 4) AS tasa
      FROM agg
      ORDER BY tasa ASC
      LIMIT 3
    respuesta_esperada: 'Jorge Javier Martinez Blanco (14.95%, 27 conv.), Ubaldo Ramos (21.12%, 162 conv.), Karla Santos (22.60%, 203 conv.) — cifras vivas, esperar drift razonable.'

