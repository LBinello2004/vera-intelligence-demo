    requisitos:
    - 'TRAMPA sutil: "mencionó el cashback" (insights.primer_mencion_cashback=''vendedor'', un criterio
      amplio y binario) NO es lo mismo que "informó correctamente la mecánica completa del 20%"
      (performance.vendedorinformocashback20porciento=''Sí'', que exige los 5 componentes exactos del
      checklist). Cruzarlos por conversation_id da sólo 80 de 805 (9.9%) — un agente que no distinga
      ambos criterios podría reportar el mismo número para las dos preguntas, o confundir "mencionar"
      con "informar completo".'
    - Requiere JOIN entre categorical_insights y performance por conversation_id (ambas vistas usan
      seller_id como tenant_field, mismo profile standard_conversation).
    sql: |
      SELECT
        COUNT(*) FILTER (WHERE rv.vendedorinformocashback20porciento = 'Sí') AS informo_completo,
        COUNT(*) AS base_menciono
      FROM dashboard_v2.vw_mens_fashion_insights_categoricos_generales ci
      JOIN dashboard_v2.vw_mens_fashion_rendimiento_vendedor rv
        ON ci.conversation_id = rv.conversation_id
      WHERE ci.seller_id = 'Mens Fashion' AND rv.seller_id = 'Mens Fashion'
        AND ci.primer_mencion_cashback = 'vendedor'
    respuesta_esperada: '80 de 805 (9.9%) informaron la mecánica completa de las que mencionaron el cashback. Un agente que confunda "mencionar" con "informar completo" daría un número mucho más alto (564, el total de primer_mencion_cashback=vendedor) o reportaría el mismo dato para ambas preguntas.'
