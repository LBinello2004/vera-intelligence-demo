client_id: farma24
display_name: "Farma 24"
tenant: "Farma 24"
model: gemini-3.7-flash
data_map: "2. clientes/farma24_alto/data_map/VI Data Map Farma24 V10.yaml"

# Cada fuente declara el campo que debe contener el tenant autorizado. El
# validador SQL exige el filtro de forma deterministica antes de ejecutar.
# A diferencia de Mens Fashion, las 6 vistas de Farma24 usan seller_id de
# forma consistente (verificado 2026-08-31, ninguna usa "seller").
sources:
  dashboard_v2.vw_farma24_demografia:
    tenant_field: seller_id
  dashboard_v2.vw_farma24_rendimiento_vendedor:
    tenant_field: seller_id
  dashboard_v2.vw_farma24_insights_categoricos_generales:
    tenant_field: seller_id
  dashboard_v2.vw_farma24_insights_descriptivos_generales:
    tenant_field: seller_id
  dashboard_v2.vw_farma24_insights_categoricos_por_producto:
    tenant_field: seller_id
  dashboard_v2.vw_farma24_insights_descriptivos_por_producto:
    tenant_field: seller_id

# Fuentes semanticas autorizadas. El agente no puede listar ni solicitar otros
# contenidos de Langfuse; siempre resuelve la version marcada production.
business_rulebooks:
  sales_evaluation:
    name: "clientes/Farma 24/checklist"
    label: production
    business_scope: "Criterios de atención y desempeño del vendedor/farmacéutico"
  conversation_insights:
    name: "clientes/Farma 24/insights"
    label: production
    business_scope: "Criterios de resultados, faltantes de stock, sustituciones y promoción Banco Provincia/Cuenta DNI"
  # Piloto (2026-09-11) -source local, NO Langfuse: contenido versionado en este mismo repo
  # ("2. clientes/_shared/business_rulebooks/coaching_playbook.md"), borrador técnico sin revisión
  # del equipo de negocio todavía. Ver README de "3. experimentos/coaching_playbook/".
  coaching_playbook:
    source: local
    path: "2. clientes/_shared/business_rulebooks/coaching_playbook.md"
    business_scope: "Recomendaciones de coaching y desarrollo de vendedores según su desempeño (bajo o alto)"

# Fuentes de RAG (Gemini File Search) autorizadas. El nombre físico del store
# se resuelve en tiempo de ejecución vía rag_sources.py, nunca se declara acá.
rag_sources:
  product_catalog:
    name: "clientes/Farma 24/checklist"
    label: production
    business_scope: "Catálogo de productos y patologías: información de referencia sobre productos, sustitutos y usos"
    top_k: 5

# Búsqueda semántica sobre conversaciones vectorizadas (generalización 2026-09-11, ver
# "6. busqueda_vectorial/README.md" > Iteración 17). Primer cliente piloto con RAG + búsqueda
# vectorial activos a la vez -objetivo explícito: confirmar que ambas fuentes conviven sin
# pisarse en la misma respuesta. Cobertura de backfill verificada: 82,6% (362.211/438.682
# recordings con embedding, mismo EMBEDDING_CONFIG_ID que mens_fashion_alto).
# vw_farma24_insights_descriptivos_generales sí matchea la convención de nombre de
# _find_descriptivos_source, así que resumen_verificado sí está disponible acá (a diferencia de
# Steren).
vector_search:
  top_k: 5
