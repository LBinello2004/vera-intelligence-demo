  - id: q17_poblacion_producto
    pregunta: ¿Cuántos productos distintos se mencionaron en total (contando cada mención por conversación)?
    fuentes_requeridas: [categorical_product_insights]
    requisitos:
    - 'Población de producto: COUNT(DISTINCT (conversation_id, producto_index)), según
      sql_rules.product_population. En esta vista no hay filas duplicadas por esa clave (el
      COUNT(*) da el mismo resultado que el COUNT DISTINCT compuesto), pero el agente debe
      aplicar la regla igual, no asumir que nunca hay duplicados.'
    sql: |
      SELECT COUNT(*) AS filas, COUNT(DISTINCT (conversation_id, producto_index)) AS productos_distintos
      FROM dashboard_v2.vw_farma24_insights_categoricos_por_producto
      WHERE seller_id = 'Farma 24'
    respuesta_esperada: '735799 menciones de producto (sin duplicados por conversación+índice)'

  - id: q18_se_termino_comprando_dist
    pregunta: ¿En qué porcentaje de las menciones de producto el producto terminó vendiéndose?
    fuentes_requeridas: [categorical_product_insights]
    max_missing_numbers: 3  # calibrado 2026-09-09 (gate V7 vs V9): la tasa central y la base
    # evaluada siempre coinciden; lo que varía es si el modelo agrega o no la lectura alternativa
    # "sobre el total absoluto" como dato extra de contexto.
    requisitos:
    - se_termino_comprando es boolean nullable; calcular la tasa sobre filas con valor (true+false),
      excluyendo NULL (filas donde el insights no corrió sobre esa conversación).
    - Un producto faltante reemplazado por un sustituto exitoso queda false para el original y
      true para el sustituto (son filas separadas) — no inferir que false implica pérdida neta
      de venta sin revisar si hubo sustitución en otra fila de la misma conversación.
    sql: |
      SELECT
        COUNT(*) FILTER (WHERE se_termino_comprando IS TRUE) AS comprado,
        COUNT(*) FILTER (WHERE se_termino_comprando IS FALSE) AS no_comprado,
        COUNT(*) FILTER (WHERE se_termino_comprando IS NULL) AS sin_dato,
        ROUND(
          COUNT(*) FILTER (WHERE se_termino_comprando IS TRUE)::numeric
          / NULLIF(COUNT(*) FILTER (WHERE se_termino_comprando IS NOT NULL), 0),
          4
        ) AS tasa
      FROM dashboard_v2.vw_farma24_insights_categoricos_por_producto
      WHERE seller_id = 'Farma 24'
    respuesta_esperada: 'comprado=453210, no_comprado=237106, sin_dato=45483, tasa sobre base con dato=65.65%'

  - id: q19_evidencia_falta_stock_selection
    pregunta: Dame algunos ejemplos textuales de conversaciones donde faltó stock, con el producto involucrado.
    fuentes_requeridas: [categorical_product_insights, descriptive_product_insights]
    omit_from_numeric_gate: true
    es_trampa: true
    requisitos:
    - 'Pregunta cualitativa: seleccionar evidencia puntual (join product_evidence por
      conversation_id + producto_index), NO agrupar, contar ni rankear el texto libre de
      evidencia_falta_stock (sql_rules.free_text). Un agente que responda con un GROUP BY o un
      conteo de frases está tratando texto narrativo como si fuera una categoría.'
    - Filtrar hubo_falta_stock IS TRUE en la vista categórica para asegurar que la evidencia
      corresponde a un caso real de falta de stock (evidencia_falta_stock es NULL cuando
      hubo_falta_stock=false).
    sql: |
      SELECT p.conversation_id, p.producto_index, p.producto, d.evidencia_falta_stock
      FROM dashboard_v2.vw_farma24_insights_categoricos_por_producto p
      JOIN dashboard_v2.vw_farma24_insights_descriptivos_por_producto d
        ON p.conversation_id = d.conversation_id AND p.producto_index = d.producto_index
        AND d.seller_id = 'Farma 24'
      WHERE p.seller_id = 'Farma 24' AND p.hubo_falta_stock IS TRUE AND d.evidencia_falta_stock IS NOT NULL
      LIMIT 3
    respuesta_esperada: >-
      Ejemplos textuales puntuales, ej. producto "Tukolbuk de miel y limón" con evidencia
      "Miel no me quedó. No tengo de miel y limón. Esa sí que no me queda." — no un conteo ni
      un ranking de frases.

  - id: q20_tasa_despedida_cierre
    pregunta: ¿En qué porcentaje de las conversaciones evaluables el vendedor se despidió y acompañó a caja?
    fuentes_requeridas: [performance]
    requisitos:
    - despideyacompanaacaja (paso 9) marca el cierre de venta (semantic_dependencies.sale_closed_cutoff);
      calcular la tasa sobre la base evaluada (Sí+No), excluyendo N/A.
    sql: |
      SELECT
        COUNT(*) FILTER (WHERE despideyacompanaacaja = 'Sí') AS si,
        COUNT(*) FILTER (WHERE despideyacompanaacaja = 'No') AS no,
        COUNT(*) FILTER (WHERE despideyacompanaacaja = 'N/A') AS na,
        ROUND(
          COUNT(*) FILTER (WHERE despideyacompanaacaja = 'Sí')::numeric
          / NULLIF(COUNT(*) FILTER (WHERE despideyacompanaacaja IN ('Sí','No')), 0),
          4
        ) AS tasa
      FROM dashboard_v2.vw_farma24_rendimiento_vendedor
      WHERE seller_id = 'Farma 24'
    respuesta_esperada: 'Sí=235396, No=11980, N/A=10238, base evaluada=247376, tasa=95.16%'
