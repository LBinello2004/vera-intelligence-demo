metadata:
  name: VI Data Map High Life V2
  version: 2.0.0
  client: High Life
  model_target: Gemini 3.7
  generated_at: '2026-09-09'
  scope: Sólo seis vistas dashboard_v2 de High Life. El tenant ('High Life') es fijo para este cliente; no
    se resuelve dinámicamente.
  source_of_truth:
    checklist_prompt: clientes/Haber/High Life/checklist (Langfuse, label production, v10 al construir este
      mapa — "Ritual de Experiencia High Life", 7 etapas, 19 criterios)
    insights_prompt: clientes/Haber/High Life/insights (Langfuse, label production, v5 al construir este mapa
      — idéntico carácter por carácter al de Mens Fashion/Roberts/Boggi, sin cashback)
    note: 'El checklist vigente (v10) reestructura el Ritual de Experiencia en 19 criterios específicos sobre
      7 etapas (Bienvenida y Conexión, Descubrimiento y Escucha Activa, Presentación y Storytelling, Demostración
      Sensorial, Manejo de Objeciones, Cierre Natural y Confirmación, Despedida y Seguimiento). El prompt de
      insights es el compartido de retail de moda. Verificado con GROUP BY/COUNT contra Postgres QA el 2026-09-09.'
  changes_from_v1:
    - 'Actualización de sales_evaluation v8 a v10 (Ritual de Experiencia High Life, 7 etapas): se reemplazaron
      los 16 criterios de v8 por 19 criterios estructurados con nombres nuevos en Postgres (14 conversaciones
      registradas con v10 desde 2026-09-08).'
    - 'Los campos del rubric v8 pasan a la sección legacy_fields_v8_checklist en performance, conviviendo ahora
      tres generaciones de checklist en la vista: checklist viejo (hasta 2026-08-15), rubric v8 (2026-08-10 a
      2026-09-08) y rubric v10 vigente (desde 2026-09-08).'
    - 'vendedorsaludasinfraesedepresion (roto en v8 con 0 filas) fue sustituido por vendedordabienvenidaysepresentaconsunombre
      en v10, el cual sí recibe datos normalmente (verificado en QA).'
  hallazgos_criticos_verificados_2026-09-09:
    - 'TRES GENERACIONES DE CHECKLIST EN performance (vw_high_life_rendimiento_vendedor):
      (1) CHECKLIST VIEJO: 26 campos (ej. vendedoramable, vendedorsepresenta), 2.205 filas (72,1%), hasta 2026-08-15.
      (2) CHECKLIST V8 (Ritual de Experiencia v8): 16 campos (ej. vendedorhaceminimodospreguntasabiertas), 840 filas (27,5%), 2026-08-10 a 2026-09-08.
      (3) CHECKLIST V10 VIGENTE (Ritual de Experiencia v10): 19 campos estructurados, 14 filas (0,5%), desde 2026-09-08.
      Ninguna de las tres generaciones es directamente comparable con las otras; filtrar siempre por las columnas o fechas pertinentes.'
    - 'CAMPOS OBLIGATORIOS POR PROTOCOLO EN V10: VendedorMencionaServicioSuMisura y VendedorOfreceTomarMedidasParaConocerTalla
      aplican en toda interacción comercial analizable; no admiten N/A por el simple hecho de que el cliente no lo pida o conozca su talla.'
    - 'DESPEDIDA Y AGRADECIMIENTO: VendedorAcompanaSeDespideConNombreYAgradeceVisita mide primordialmente la despedida
      cordial con agradecimiento; por limitaciones de audio, no exige registrar acompañamiento físico a la puerta ni uso del nombre.'
  known_findings_v1:
  - 'VALIDACIÓN DE CONFIABILIDAD (2026-09-07, mismo día del onboarding): High Life había quedado en grado
      "bajo" (ver README.md > convención de nombres de carpeta) por la severidad del hallazgo central de
      abajo (73% del histórico bajo un rubric no comparable con el vigente). Se corrió el banco completo
      de 11 preguntas -incluidas 5 marcadas es_trampa, varias apuntando directamente a este hallazgo y al
      campo roto- y dio 11/11 sin ningún UNSAFE_ANSWER_FALLBACK. En particular, `q04_campo_roto_trap`
      (pregunta sobre un campo con 0 filas pobladas) respondió correctamente que no hay datos disponibles
      para esa pregunta, sin inventar un número ni confundirlo con otro criterio -exactamente lo que pide
      `respuesta_esperada`-. No se encontró ninguna falla de ejecución: el agente maneja los dos rubrics
      incompatibles, el rename de polaridad y el campo roto de forma correcta y honesta en todos los
      casos probados. Con esta evidencia, carpeta renombrada de `high_life_bajo` a `high_life_medio`
      (2026-09-07).
      RECONSIDERADO EL MISMO DÍA, A PEDIDO DEL USUARIO: el criterio de dejarlo en "medio" por el tamaño
      del hallazgo (73% del histórico) era inconsistente con cómo se gradúan Atlas y Farma24, que también
      tienen hallazgos grandes y abiertos (el corte de cobertura de Atlas desde 2026-08-10, las
      ambigüedades de denominador y filas huérfanas documentadas de Farma24) y quedaron en "alto" porque
      la ejecución es confiable y cada limitación está correctamente advertida -exactamente lo que también
      es cierto acá-. Además, el rubric vigente arrancó el 10/08 y crece todos los días (825 conversaciones
      y subiendo) -no es una limitación fija que empeora con el tiempo, es una que se va achicando como
      proporción del total, mismo patrón que el corte de Atlas-. No hay una razón consistente para tratar
      a High Life distinto de esos dos clientes: la ejecución es igual de sólida (11/11, incluida la
      trampa del campo roto respondida correctamente) y cada hallazgo -migración de rubric, rename de
      polaridad, campo roto- tiene su propia regla explícita que el agente respeta. Carpeta renombrada de
      `high_life_medio` a `high_life_alto` (2026-09-07, mismo día). El hallazgo central sigue documentado
      tal cual, sin resolver (no se "arregló" nada nuevo) — sólo se corrigió el criterio de grado.'
  - 'HALLAZGO CENTRAL — MIGRACIÓN DE CHECKLIST, TRES RUBRICS INCOMPATIBLES CONVIVIENDO EN performance: la vista
      vw_high_life_rendimiento_vendedor contiene tres generaciones de checklist:
      (1) CHECKLIST VIEJO (26 campos, ej. vendedoramable, vendedorsepresenta, vendedorrealizocierrecompra,
      vendedorexplicoprogramadelealtad, vendedordestacaventajasconfeccionmedida) — es literalmente el mismo
      rubric que usa Mens Fashion/Roberts (Recepción/Investigación/Asesoría/Complementos/Manejo de
      Objeciones/Cierre, con cashback y confección a medida). Cubre 2.205 conversaciones (hasta 2026-08-15).
      (2) CHECKLIST V8 ("Ritual de Experiencia v8", 16 campos) — cubre 840 conversaciones (2026-08-10 a 2026-09-08).
      (3) CHECKLIST V10 ("Ritual de Experiencia v10", 19 campos) — cubre conversaciones desde 2026-09-08.
      ESTOS TRES RUBRICS NO SON DIRECTAMENTE COMPARABLES ENTRE SÍ. Cualquier pregunta sobre "todo el histórico"
      de performance debe advertir que los datos fueron evaluados con protocolos comerciales distintos según la
      época, no mezclar ambos como si fueran una serie temporal continua del mismo criterio.'
  - 'DENTRO del checklist v8 hay una migración menor de nombres de campo (polaridad): 3 campos se renombraron
      de negativo a positivo el 2026-08-24/25. Verificado en Postgres: vendedorinterrumpealcliente/
      vendedorofrecedescuentocomoprimerarespuesta/vendedorusaurgenciafalsa (nombres viejos, polaridad negativa)
      tienen 465 filas pobladas cada uno, fecha 2026-08-10 a 2026-08-24; sus reemplazos
      vendedorevitainterrumpiralcliente/vendedorevitaofrecerdescuentocomoprimerarespuesta/
      vendedorevitausarurgenciafalsa (polaridad positiva) tienen 375 filas cada uno en v8. SON EL MISMO
      CRITERIO CON POLARIDAD INVERTIDA en v8.'
  - 'CAMPO ROTO EN V8: VendedorSaludaSinFraseDePresion (primer campo de v8, etapa "Bienvenida y Conexión")
      tuvo 0 filas pobladas en Postgres (columna física vendedorsaludasinfraesedepresion). En v10 fue
      reemplazado por vendedordabienvenidaysepresentaconsunombre, que sí recibe datos.'
  - 'categorical_insights (a diferencia de performance) SÍ cubre el histórico completo sin discontinuidad:
      fecha mínima 2026-06-07, máxima 2026-09-08. Usar siempre COUNT(DISTINCT conversation_id).'
  - 'categorical_insights tiene 274 filas huérfanas sobre 3.351 (8,2% — 3.351 filas totales vs 3.077
      conversation_id distintos). Usar siempre COUNT(DISTINCT conversation_id).'
  - 'ocasion_uso_dual_source: vendedorpreguntaocasionuso SÓLO existe en el checklist VIEJO (0 filas en v8).
      En v10 existe vendedordescubreocasiononecesidaddeuso. Verificado contra hubo_pregunta_ocasion_de_uso
      (categorical_insights, cubre todo el histórico).'
  - 'motivador_visita taxonomy_drift: mismo fenómeno que el resto de los clientes hermanos de insights —
      necesidad_especifica=894 (legado, segundo valor más frecuente después de no_claro=1.471), promocion=121
      (legado), aparador=25 (legado), y otros valores legados menores (ecommerce=4, recomendacion=3,
      referencia_externa=3, redes_sociales=2).'
  - 'RAG no aplica: el checklist de High Life no declara geminiFileSearchStoreName. El store de
      clientes/Haber/High Life/feedback es compartido con Boggi/Mens Fashion/Roberts y pertenece a otro
      producto/feature, no a Vera Intelligence.'
  - 'Dataset grande para este batch: más de 3.059 conversaciones totales en demografía y rendimiento.'
decision_flow:
- Identificar si la pregunta es general de conversación o específica de producto.
- Elegir una sola familia primaria según routing; sumar una segunda fuente sólo si la pregunta exige evidencia y existe
  join declarado.
- 'CRÍTICO para performance: identificar primero si la pregunta puede responderse con el checklist
  vigente v10 (post 2026-09-08, 19 campos del Ritual de Experiencia), el rubric v8 (2026-08-10 a 2026-09-08,
  16 campos) o si exige el histórico completo -en cuyo caso advertir las migraciones de rubric, ver known_findings_v1-.'
- Resolver profile, grano, tenant y fecha antes de escribir SQL.
- Si el campo tiene nullable=true, decidir explícitamente si la pregunta requiere excluir NULL o si NULL es
  parte legítima de la respuesta.
- Verificar que cada condición explícita de la pregunta aparezca en SELECT, WHERE, GROUP BY o cálculo.
routing:
  demography:
    questions: resultado de la interacción, características de la conversación
    avoid: no usar para motivos comerciales detallados ni evaluación del vendedor
  performance:
    questions: criterios del checklist vigente v10 (Ritual de Experiencia, 7 etapas, 19 campos) desde el 2026-09-08
    avoid: 'NO mezclar con los campos del rubric v8 ni del checklist viejo como si fueran el mismo criterio
      -son rubrics distintos, ver known_findings_v1-. No tratar N/A como incumplimiento.'
  categorical_insights:
    questions: resultado general, venta perdida, motivador, competencia, cierre o cantidades — cubre todo el
      histórico
    avoid: no usar para ejemplos o explicaciones textuales
  descriptive_insights:
    questions: por qué, cómo fue la ejecución, ejemplos, errores, mejores prácticas o acciones sugeridas
    avoid: no agrupar ni calcular frecuencia de textos
  categorical_product_insights:
    questions: producto, compra, ocasión, fit, talla, color, objeción, inventario o complementarios por producto
    avoid: no afirmar ventas transaccionales
  descriptive_product_insights:
    questions: ejemplos y explicaciones narrativas de un producto
    avoid: no usar sin la vista categórica cuando la condición del producto debe comprobarse físicamente
profiles:
  standard_conversation:
    row_key: conversation_id
    tenant_field: seller_id
    date_field: uploaded_at_local
    optional_dimensions: [store_id, store_name, sector_id, sector_name, employee_id, employee_full_name]
    quality_filter: 'usefulforanalysis IS TRUE cuando la pregunta se refiera a conversaciones analizables. No
      agregar por costumbre si no se pide explícitamente.'
  descriptive_conversation:
    row_key: conversation_id
    tenant_field: seller
    date_field: date
    optional_dimensions: []
    quality_filter: 'No asumir usefulforanalysis: no se verificó si esta vista lo expone de forma confiable.'
sql_rules:
  scope: Usar únicamente sources[].source. Nunca consultar otra vista, schema o cliente.
  read_only: Un único SELECT o WITH...SELECT; sin interpolar texto del usuario; LIMIT 200 para detalle.
  tenant: Aplicar el valor exacto autorizado de sesión ('High Life') sobre el tenant_field de cada fuente
    (seller_id en 5 de 6 fuentes, seller en descriptive_insights).
  time: Filtrar profiles[profile].date_field sólo cuando el usuario indique un período.
  conversation_population: COUNT(DISTINCT conversation_id).
  product_population: COUNT(DISTINCT (conversation_id, producto_index)).
  performance_rate: 'cumplimientos / base_evaluada; base = conversaciones distintas con valor Sí o No; excluir
    N/A y null. Para el checklist vigente v10: siempre filtrar primero a vendedordabienvenidaysepresentaconsunombre IS NOT NULL
    (o uploaded_at_local >= 2026-09-08) para no mezclar con rubrics anteriores.'
  categorical_rate_general_rule: La misma convención de performance_rate aplica a cualquier campo categórico
    booleano o Sí/No/N-A del Data Map.
  polarity_flip_rule: 'Para evaluar v8 histórico (10/08 a 24/08 vs 25/08 a 08/09): combinar el campo viejo
    (polaridad negativa) invirtiendo su lectura con el campo nuevo (polaridad positiva). En v10 todos los
    campos tienen polaridad positiva estándar.'
  free_text: Seleccionar como evidencia con claves y fecha. Nunca GROUP BY, COUNT o ranking por texto narrativo.
semantic_dependencies:
  lost_sale_general: hubo_venta_perdida IS TRUE habilita motivo_principal_venta_perdida; excluir no_aplica.
  ocasion_uso_dual_source: 'vendedordescubreocasiononecesidaddeuso (performance v10), vendedorpreguntaocasionuso
    (performance viejo, hasta 24/06) y hubo_pregunta_ocasion_de_uso (categorical_insights, cubre todo el histórico)
    representan indagación de ocasión/uso en sus respectivos períodos.'
  checklist_migration: 'Ver known_findings_v1: tres rubrics de checklist conviven en performance (viejo hasta
    2026-08-15; v8 del 2026-08-10 al 2026-09-08; v10 desde 2026-09-08). No sumar ni promediar tasas de distintos
    períodos como si midieran lo mismo.'
  polarity_flip: 'Ver known_findings_v1 y sql_rules.polarity_flip_rule: aplicable al período del rubric v8.'
  saludo_sin_presion_broken: 'vendedorsaludasinfraesedepresion perteneció al rubric v8 (0 filas pobladas).
    En v10 fue reemplazado por vendedordabienvenidaysepresentaconsunombre.'
  motivador_visita_taxonomy: hay dos generaciones de taxonomía conviviendo (ver known_findings_v1).
joins:
  general_evidence:
    left: categorical_insights
    right: descriptive_insights
    keys: [conversation_id]
    cardinality: conversation_to_conversation
    note: descriptive_insights sí tiene conversation_id en High Life (igual que Boggi).
  product_evidence:
    left: categorical_product_insights
    right: descriptive_product_insights
    keys: [conversation_id, producto_index]
    cardinality: product_to_product
  rule: No usar CROSS JOIN para asociar evidencia. Si falta una clave, no atribuir el texto al grupo categórico.
sources:
  demography:
    source: dashboard_v2.vw_high_life_demografia
    use_when: 'Características de las conversaciones y clientes: interacción, género, destinatario, tipo,
      necesidad, decisión, precio y urgencia.'
    grain: Una fila por conversación.
    profile: standard_conversation
    fields:
      tipointeraccion:
        configured_values: &tipointeraccion_generico [cambio, compra, no_compra, queja]
        observed_values: *tipointeraccion_generico
        type: text
        nullable: true
        description: Resultado operativo de la interacción según el insights.
        operations: [filter, group, compare]
      genero_cliente:
        configured_values: &genero_cliente [femenino, masculino, no_claro]
        observed_values: *genero_cliente
        type: text
        nullable: true
        description: Género del cliente. Sólo masculino/femenino con evidencia razonable.
        operations: [filter, group, compare]
      cliente_compra_para:
        configured_values: &cliente_compra_para [no_claro, regalo, si_mismo, tercero]
        observed_values: *cliente_compra_para
        type: text
        nullable: true
        description: Destinatario de la compra.
        operations: [filter, group, compare]
      tipo_cliente:
        configured_values: &tipo_cliente [no_claro, nuevo, recurrente]
        observed_values: *tipo_cliente
        type: text
        nullable: true
        description: nuevo = primera visita; recurrente = evidencia de compras previas.
        operations: [filter, group, compare]
      perfil_necesidad:
        configured_values: &perfil_necesidad [casual, evento, exploracion, no_claro, reposicion, trabajo]
        observed_values: *perfil_necesidad
        type: text
        nullable: true
        description: Necesidad dominante que organiza la visita.
        operations: [filter, group, compare]
      nivel_decision_cliente:
        configured_values: &nivel_decision_cliente [comparando, decidido, indeciso, no_claro]
        observed_values: *nivel_decision_cliente
        type: text
        nullable: true
        description: Nivel de decisión del cliente.
        operations: [filter, group, compare]
      sensibilidad_precio_general:
        configured_values: &sensibilidad_precio_general [alta, baja, media, no_claro]
        observed_values: *sensibilidad_precio_general
        type: text
        nullable: true
        description: Sensibilidad del cliente frente al precio.
        operations: [filter, group, compare]
      urgencia_general:
        configured_values: &urgencia_general [inmediata, no_claro, planeada]
        observed_values: *urgencia_general
        type: text
        nullable: true
        description: Urgencia temporal general de la necesidad del cliente.
        operations: [filter, group, compare]
  performance:
    source: dashboard_v2.vw_high_life_rendimiento_vendedor
    use_when: Criterios del checklist VIGENTE de High Life (v10, "Ritual de Experiencia", 7 etapas, 19 campos,
      sólo conversaciones desde el 2026-09-08). Para períodos anteriores, ver legacy_fields.
    grain: Una fila por conversación.
    profile: standard_conversation
    decision_semantics: 'Los campos vigentes están redactados como conductas POSITIVAS: "Sí" = cumplió la
      conducta positiva; "No" = la conducta era aplicable, la oportunidad quedó capturada y el vendedor no la
      cumplió; "N/A" = no aplicaba o la etapa relevante no quedó capturada con suficiente claridad.'
    legacy_fields_v8_checklist:
      description: 'Campos pertenecientes al checklist v8 (840 filas, 2026-08-10 a 2026-09-08), 16 criterios
        del Ritual de Experiencia v8. Incluye los campos con rename de polaridad del 24/08 y el campo roto
        vendedorsaludasinfraesedepresion.'
      field_names: [vendedorsaludasinfraesedepresion, vendedorhaceminimodospreguntasabiertas,
        vendedorevitainterrumpiralcliente, vendedorinterrumpealcliente, vendedorreflejaentendimiento,
        vendedorpresentamaximotresopciones, vendedorusafraseanclada, vendedormencionaprecioalfinal,
        vendedorinvitaaprobarproducto, vendedornombraelementosensorial, vendedorvalidaobjecionantesderesponder,
        vendedorevitaofrecerdescuentocomoprimerarespuesta, vendedorofrecedescuentocomoprimerarespuesta,
        vendedorconfirmarespuestafuesuficiente, vendedorusafrasedecierre, vendedorevitausarurgenciafalsa,
        vendedorusaurgenciafalsa, vendedorcelebraelecciondelcliente, vendedorsedespideconnombredelcliente]
    legacy_fields_v1_checklist:
      description: 'Los siguientes campos pertenecen al checklist VIEJO (2.205 filas, hasta 2026-08-15),
        mismo rubric que usa hoy Mens Fashion/Roberts. NO forman parte del checklist vigente de High Life.'
      field_names: [vendedoramable, vendedorsepresenta, vendedorrealizocierrecompra, vendedorofrecioasistencia,
        vendedorofreciotomarmedidas, vendedormuestraprendas, vendedormencionadescuentos,
        vendedoragradecioeinvitovolver, vendedorexplicoprogramadelealtad, vendedorconfirmoenvioticketemail,
        vendedorofreciomesessinintereses, vendedormencionoprogramadelealtad, vendedorsugiriocomplementos,
        vendedorpreguntaocasionuso, vendedormencionobeneficiosprendas, vendedormencionoconfeccionamedida,
        vendedorinvitoaencuestasatisfaccion, vendedormencionanuevoslanzamientos,
        vendedormencionotrescomplementos, conocimientosuficiente, vendedorrecomiendasegunocasionuso,
        vendedordestacaventajasconfeccionmedida, vendedorpreguntapreferenciascliente,
        vendedorofrecebeneficiosanteobjeccionprecio, vendedorofrecesolucionanteobjeccioncomosevesiente]
    fields:
      vendedordabienvenidaysepresentaconsunombre:
        configured_values: &si_no_na [Sí, 'No', N/A]
        observed_values: [N/A, 'No', Sí]
        type: text
        nullable: true
        description: 'Bienvenida y Conexión. Sí: el inicio está capturado, el vendedor saluda o da la bienvenida
          y se presenta verbalmente con su nombre. No: inicio capturado y falta al menos una de las dos conductas.
          N/A si el inicio no quedó capturado.'
        operations: [filter, group, compare]
      vendedorpreguntasiconocehighlife:
        configured_values: *si_no_na
        observed_values: [N/A, 'No']
        type: text
        nullable: true
        description: 'Bienvenida y Conexión. Sí: pregunta explícitamente si el cliente conoce High Life o si es su
          primera vez en la tienda. No: conexión inicial capturada y no realiza la pregunta. N/A si la conexión no
          quedó capturada.'
        operations: [filter, group, compare]
      vendedorpresentamarcasonuevascolecciones:
        configured_values: *si_no_na
        observed_values: [N/A, 'No', Sí]
        type: text
        nullable: true
        description: 'Bienvenida y Conexión. Sí: presenta/informa comercialmente al menos UNA marca (High Life, Calderoni,
          Ermenegildo Zegna, Boss, Boggi, Cerruti, Loro Piana) o una nueva colección. "Bienvenido a High Life" por sí
          solo no cuenta.'
        operations: [filter, group, compare]
      vendedorpreguntanombredelcliente:
        configured_values: *si_no_na
        observed_values: [N/A, 'No', Sí]
        type: text
        nullable: true
        description: 'Descubrimiento y Escucha Activa. Sí: solicita, pregunta o verifica el nombre del cliente. No:
          etapa capturada y no lo hace. Que el cliente lo diga espontáneamente no basta.'
        operations: [filter, group, compare]
      vendedordescubreocasiononecesidaddeuso:
        configured_values: *si_no_na
        observed_values: [N/A, 'No', Sí]
        type: text
        nullable: true
        description: 'Descubrimiento y Escucha Activa. Sí: al menos una pregunta que explora para qué se busca la
          prenda o en qué contexto se usará (evento, trabajo, boda, etc.). No cuentan preguntas puramente logísticas
          de talla/color/stock.'
        operations: [filter, group, compare]
      vendedorpreguntafechalugarocodigodevestimenta:
        configured_values: *si_no_na
        observed_values: [N/A, 'No', Sí]
        type: text
        nullable: true
        description: 'Descubrimiento y Escucha Activa. Sí: ante una ocasión/contexto conocido, pregunta al menos UNO de:
          fecha, lugar o código de vestimenta. N/A si no existe ocasión/contexto conocido.'
        operations: [filter, group, compare]
      vendedorpreguntapreferenciasdeprendacolormaterialoestilo:
        configured_values: *si_no_na
        observed_values: [N/A, 'No', Sí]
        type: text
        nullable: true
        description: 'Descubrimiento y Escucha Activa. Sí: pregunta explícitamente por al menos una preferencia entre
          tipo de prenda, color, material o estilo.'
        operations: [filter, group, compare]
      vendedorrecomiendasegunnecesidadouso:
        configured_values: *si_no_na
        observed_values: [N/A, 'No', Sí]
        type: text
        nullable: true
        description: 'Presentación y Storytelling. Sí: existe necesidad/ocasión conocida, presenta/recomienda una prenda
