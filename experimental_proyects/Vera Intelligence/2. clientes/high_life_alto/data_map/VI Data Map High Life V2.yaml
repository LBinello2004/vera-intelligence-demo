  descriptive_product_insights:
    source: dashboard_v2.vw_high_life_insights_descriptivos_por_producto
    use_when: Evidencia y explicación textual por producto.
    grain: Una fila por conversation_id + producto_index; texto libre no agregable como categoría.
    profile: standard_conversation
    fields:
      producto_index: {type: integer, nullable: false, description: Índice del producto; unir con la vista categórica usando conversation_id + producto_index., operations: [join_key, filter]}
      resumen_producto: {type: text, nullable: true, description: Mini-historia comercial del producto., operations: [select_evidence]}
      preferencias_cliente_producto: {type: text, nullable: true, description: Fit, color, diseño, ocasión y preferencias sobre este producto., operations: [select_evidence]}
      brechas_de_inventario_producto: {type: text, nullable: true, description: Faltas de talla, color, modelo o producto y su impacto., operations: [select_evidence]}
      sensibilidad_precio_y_umbral_producto: {type: text, nullable: true, description: Cómo pesó el precio y cualquier umbral concreto mencionado., operations: [select_evidence]}
      objeciones_y_respuesta_vendedor_producto: {type: text, nullable: true, description: La objeción, la respuesta del vendedor y su resultado., operations: [select_evidence]}
      complementarios_y_paquete_producto: {type: text, nullable: true, description: Complementarios/paquete vinculados a este producto y su resultado., operations: [select_evidence]}
      rol_de_a_medida_producto: {type: text, nullable: true, description: Si la confección a medida fue ofrecida, considerada, rechazada o tuvo impacto., operations: [select_evidence]}
      resultado_final_producto: {type: text, nullable: true, description: Si terminó comprado, no comprado, reemplazado o pendiente., operations: [select_evidence]}
      accion_sugerida_producto: {type: text, nullable: true, description: Una única acción concreta vinculada a la fricción real de este producto., operations: [select_evidence]}
limitations:
- Compra y resultado son inferencias conversacionales del modelo, no tickets ni ventas certificadas.
- 'LIMITACIÓN PRINCIPAL: el checklist tiene tres rubrics incompatibles (viejo hasta 2026-08-15, v8 del 2026-08-10
  al 2026-09-08, y v10 desde 2026-09-08). Ver metadata.known_findings_v1 y metadata.hallazgos_criticos_verificados_2026-09-09.'
- 'vendedorsaludasinfraesedepresion (VendedorSaludaSinFraseDePresion) no tuvo datos en el rubric v8. En v10 fue
  sustituido por vendedordabienvenidaysepresentaconsunombre, que sí recibe datos.'
- categorical_insights cubre todo el histórico sin el hueco de performance, pero no se confirmó si hay
  población idéntica entre ambas fuentes en el rango de la discontinuidad.
- descriptive_insights tiene más filas que conversaciones totales (7.811 vs 3.092) — no se investigó si hay
  duplicados o huérfanas propias.
- El mapa no responde organización, conectividad, gamificación, roleplays ni dominios de otros clientes.