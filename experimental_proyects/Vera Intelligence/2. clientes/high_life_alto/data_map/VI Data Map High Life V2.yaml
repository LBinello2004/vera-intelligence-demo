    data_quality_note: 'Esta vista tiene 274 filas huérfanas sobre 3.351 (8,2% — verificado 2026-09-07: 3.351
      filas totales vs 3.077 conversation_id distintos). SIEMPRE usar COUNT(DISTINCT conversation_id).'
