client_id: dalton
display_name: "Dalton"
tenant: "Dalton"
model: gemini-3.7-flash
data_map: "2. clientes/dalton_medio/data_map/VI Data Map Dalton V1.yaml"

# Dalton es "schema delgado" (2 vistas, sin insights) y de volumen chico (30 conversaciones).
# Langfuse tiene DOS sub-marcas para Dalton (Hostess y Ventas) pero la vista de Postgres
# corresponde exclusivamente a Ventas -confirmado con el prompt_id de la vista de
# rendimiento_vendedor (a2rFW9VbTU6hNVdlD32z), que coincide exacto con
# clientes/Dalton/Ventas/checklist, no con clientes/Dalton/Hostess/checklist-.
sources:
  dashboard_v2.vw_dalton_demografia:
    tenant_field: seller_id
  dashboard_v2.vw_dalton_rendimiento_vendedor:
    tenant_field: seller_id

business_rulebooks:
  sales_evaluation:
    name: "clientes/Dalton/Ventas/checklist"
    label: production
    business_scope: "Criterios de venta consultiva en concesionaria de vehículos Kia (Dalton)"
  # Generalizado a todos los clientes (2026-09-11) -source local, NO Langfuse: contenido
  # versionado en este mismo repo ("2. clientes/_shared/business_rulebooks/coaching_playbook.md"),
  # borrador técnico sin revisión del equipo de negocio todavía. Ver README de
  # "3. experimentos/coaching_playbook/".
  coaching_playbook:
    source: local
    path: "2. clientes/_shared/business_rulebooks/coaching_playbook.md"
    business_scope: "Recomendaciones de coaching y desarrollo de vendedores según su desempeño (bajo o alto)"

# Dalton no tiene RAG: su prompt de checklist no declara geminiFileSearchStoreName -el store
# de clientes/Dalton/Ventas/feedback es de otro producto/feature, no de Vera Intelligence-.

# Búsqueda vectorial habilitada (2026-09-16, ampliación a todos los clientes viables) -verificado
# por SQL directo: sólo 56 embeddings reales para seller_id='Dalton', tienda única (2026-05-14 a
# 2026-07-07). Volumen bajo: top_k=5 puede devolver menos de 5 resultados distintos casi siempre,
# o candidatos con distancia relativa alta -queda habilitado igual (no hay motivo para negarle la
# herramienta a un cliente activo sólo por volumen chico), pero es el candidato más débil de este
# batch y el primero a revisar si aparece una queja de baja calidad de resultados. Sin
# insights_descriptivos_generales -resumen_verificado sale None, degradación normal.
vector_search:
  top_k: 5
